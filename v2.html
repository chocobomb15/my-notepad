<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTEPAD</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   변수 / 테마
   ============================================================ */
:root{
  --font-ui: "Pretendard", "Apple SD Gothic Neo", -apple-system, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
  --font-mono: "D2Coding", "Cascadia Mono", Consolas, "Nanum Gothic Coding", "Courier New", monospace;
  --radius: 8px;
  --tabbar-h: 38px;
  --title-h: 46px;
  --status-h: 26px;
}
html[data-theme="light"]{
  --bg: #f4f5f7;
  --bg-elev: #ffffff;
  --bg-sunken: #eceef1;
  --bg-hover: #e6e8ec;
  --bg-active: #ffffff;
  --fg: #1f2328;
  --fg-dim: #656d76;
  --fg-faint: #8b949e;
  --border: #d7dae0;
  --border-soft: #e5e7eb;
  --accent: #2f6feb;
  --accent-soft: #dbe7ff;
  --danger: #cf222e;
  --ok: #1a7f37;
  --warn: #9a6700;
  --code-bg: #f4f6f8;
  --code-border: #e3e6ea;
  --quote-border: #d0d7de;
  --mark: #fff3a3;
  --mark-active: #ffb648;
  --shadow: 0 6px 24px rgba(20,25,35,.14);
  --tok-k:#cf222e; --tok-s:#0a6b34; --tok-c:#7a828e; --tok-n:#0550ae;
  --tok-f:#8250df; --tok-b:#953800; --tok-t:#116329; --tok-a:#0550ae; --tok-p:#57606a;
}
html[data-theme="dark"]{
  --bg: #15181d;
  --bg-elev: #1b1f26;
  --bg-sunken: #101317;
  --bg-hover: #262c35;
  --bg-active: #21262e;
  --fg: #dfe3e8;
  --fg-dim: #97a0ab;
  --fg-faint: #6e7681;
  --border: #2c333d;
  --border-soft: #242a32;
  --accent: #5b9bff;
  --accent-soft: #1d2b45;
  --danger: #ff7b72;
  --ok: #56d364;
  --warn: #e3b341;
  --code-bg: #12161b;
  --code-border: #262c35;
  --quote-border: #3a424d;
  --mark: #6b5b17;
  --mark-active: #b07d10;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  --tok-k:#ff7b72; --tok-s:#7ee787; --tok-c:#7d8590; --tok-n:#79c0ff;
  --tok-f:#d2a8ff; --tok-b:#ffa657; --tok-t:#7ee787; --tok-a:#79c0ff; --tok-p:#8b949e;
}
html[data-theme="sepia"]{
  --bg: #ece3d2;
  --bg-elev: #f7f1e3;
  --bg-sunken: #e4dac6;
  --bg-hover: #e0d5bf;
  --bg-active: #fbf7ec;
  --fg: #3c332405;
  --fg: #3f3627;
  --fg-dim: #6f6350;
  --fg-faint: #8d8069;
  --border: #d3c6ac;
  --border-soft: #ded2ba;
  --accent: #9a5b1f;
  --accent-soft: #f0dfc4;
  --danger: #a8321f;
  --ok: #4a6b2a;
  --warn: #8a6512;
  --code-bg: #f0e8d6;
  --code-border: #ddd0b6;
  --quote-border: #cfc0a2;
  --mark: #ffe9a8;
  --mark-active: #ffbf5e;
  --shadow: 0 6px 24px rgba(80,60,30,.18);
  --tok-k:#a8321f; --tok-s:#4a6b2a; --tok-c:#8d8069; --tok-n:#7a5a12;
  --tok-f:#7b4b9a; --tok-b:#95541a; --tok-t:#4a6b2a; --tok-a:#7a5a12; --tok-p:#6f6350;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--fg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg-faint);background-clip:content-box;border:3px solid transparent}

#app{display:flex;flex-direction:column;height:100%}

/* ============================================================
   상단 바
   ============================================================ */
.titlebar{
  height:var(--title-h); flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:0 10px;
  background:var(--bg-elev);
  border-bottom:1px solid var(--border);
  user-select:none;
}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px;font-weight:700;letter-spacing:-.2px}
.brand .logo{
  width:24px;height:24px;border-radius:6px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;
}
.brand span{font-size:14px}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.tb-spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 10px;
  background:transparent;border:1px solid transparent;border-radius:var(--radius);
  cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--bg-hover)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.btn svg{width:16px;height:16px;flex:0 0 auto}

.segmented{display:flex;background:var(--bg-sunken);border-radius:var(--radius);padding:2px;gap:2px}
.segmented button{
  height:26px;padding:0 11px;border:0;background:transparent;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--fg-dim);display:flex;align-items:center;gap:5px;
}
.segmented button:hover{color:var(--fg)}
.segmented button.on{background:var(--bg-elev);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ============================================================
   탭 바
   ============================================================ */
.tabbar{
  height:var(--tabbar-h);flex:1 1 auto;min-width:0;
  display:flex;align-items:stretch;
  background:var(--bg-sunken);
  overflow-x:auto;overflow-y:hidden;
  user-select:none;
}
.tabbar::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:7px;
  padding:0 8px 0 12px;max-width:230px;min-width:110px;
  border-right:1px solid var(--border);
  background:transparent;cursor:pointer;position:relative;
  color:var(--fg-dim);font-size:13px;flex:0 0 auto;
}
.tab:hover{background:var(--bg-hover)}
.tab.on{background:var(--bg-elev);color:var(--fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;display:none}
.tab.dirty .dot{display:block}
.tab.dirty .x{display:none}
.tab.dirty:hover .dot{display:none}
.tab.dirty:hover .x{display:grid}
.tab .x{
  width:18px;height:18px;border-radius:4px;display:grid;place-items:center;
  flex:0 0 auto;opacity:.6;font-size:14px;line-height:1;
}
.tab .x:hover{background:var(--bg-hover);opacity:1;color:var(--danger)}
.tab:not(:hover):not(.on) .x{visibility:hidden}
.tab.drag-over{background:var(--accent-soft)}
/* --- 탭 바 좌우 스크롤 (구버전과 동일) --- */
.tabrow{
  display:flex;align-items:stretch;flex:0 0 auto;
  background:var(--bg-sunken);border-bottom:1px solid var(--border);
}
.tabscroll{
  width:28px;flex:0 0 auto;border:0;background:transparent;cursor:pointer;
  color:var(--fg-dim);font-size:11px;line-height:1;
}
.tabscroll:hover{background:var(--bg-hover);color:var(--fg)}
.tabscroll:first-child{border-right:1px solid var(--border)}
.tabscroll:last-child{border-left:1px solid var(--border)}

/* ============================================================
   본문
   ============================================================ */
.body{flex:1;display:flex;min-height:0;position:relative}

.sidebar{
  width:250px;flex:0 0 auto;
  background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
body.no-sidebar .sidebar{display:none}
.sidebar-head{
  height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--fg-faint);text-transform:uppercase;flex:0 0 auto;
}
.toc{overflow:auto;padding:0 6px 16px;flex:1;font-size:13px}
.toc a{
  display:block;padding:5px 8px;border-radius:6px;
  color:var(--fg-dim);text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toc a:hover{background:var(--bg-hover);color:var(--fg)}
.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc a.h1{padding-left:8px;font-weight:600;color:var(--fg)}
.toc a.h2{padding-left:20px}
.toc a.h3{padding-left:32px;font-size:12.5px}
.toc a.h4{padding-left:44px;font-size:12.5px}
.toc a.h5,.toc a.h6{padding-left:56px;font-size:12px}
.toc-empty{padding:14px 12px;color:var(--fg-faint);font-size:12.5px;line-height:1.6}

/* --- 사이드바 전환 (문서 / 목차) --- */
.sidebar-head{padding:6px 8px;height:auto}
.segmented.sidesw{width:100%}
.segmented.sidesw button{flex:1;justify-content:center;height:24px;padding:0 6px;font-size:12px}
.segmented.sidesw button #tocCount{margin-left:5px;color:var(--fg-faint);font-size:11px}

/* --- 폴더 트리 --- */
.tree{overflow:auto;padding:2px 6px 16px;flex:1;font-size:13px;user-select:none}
.tree .row{
  display:flex;align-items:center;gap:5px;
  padding:4px 6px;border-radius:6px;cursor:pointer;
  color:var(--fg-dim);white-space:nowrap;
}
.tree .row:hover{background:var(--bg-hover);color:var(--fg)}
.tree .row.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree .row .tw{width:12px;flex:0 0 auto;text-align:center;font-size:9px;color:var(--fg-faint)}
.tree .row .ic{flex:0 0 auto;font-size:12px;position:relative}
.tree .row .dot{
  position:absolute;right:-3px;bottom:-1px;width:7px;height:7px;border-radius:50%;
  border:2px solid var(--bg-elev);
}
.tree .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tree .row .ct{flex:0 0 auto;font-size:10.5px;color:var(--fg-faint)}
.tree .row .addbtn{
  flex:0 0 auto;width:18px;height:18px;line-height:1;
  border:1px solid var(--border);border-radius:5px;
  background:var(--bg-elev);color:var(--fg-dim);
  cursor:pointer;font-family:inherit;font-size:12px;
  display:none;place-items:center;padding:0;
}
.tree .row:hover .addbtn{display:grid}
.tree .row .addbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.tree .row.file .nm{font-size:12.5px}
.tree-empty{padding:14px 12px;color:var(--fg-faint);font-size:12.5px;line-height:1.6}
.tree .row.sel{background:var(--accent-soft);color:var(--accent)}
.tree .row.sel.on{box-shadow:inset 2px 0 0 var(--accent)}
.tree .row input.rename{
  flex:1;min-width:0;background:var(--bg-elev);color:var(--fg);
  border:1px solid var(--accent);border-radius:4px;outline:0;
  font-family:inherit;font-size:12.5px;padding:1px 5px;
}
.tree-head{
  display:flex;align-items:center;gap:4px;padding:2px 6px 6px;
  border-bottom:1px solid var(--border-soft);margin-bottom:4px;
}
.tree-head button{
  height:24px;padding:0 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-elev);color:var(--fg-dim);cursor:pointer;font-size:11.5px;font-family:inherit;
}
.tree-head button:hover{background:var(--bg-hover);color:var(--fg)}
.tree-head .selinfo{flex:1;font-size:11px;color:var(--accent);font-weight:600;text-align:right}

/* --- 우클릭 메뉴 --- */
#ctxmenu{
  position:fixed;z-index:1500;min-width:172px;padding:4px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;
  box-shadow:var(--shadow);font-size:12.5px;
}
#ctxmenu[hidden]{display:none}
#ctxmenu .mi{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--fg);
}
#ctxmenu .mi:hover{background:var(--bg-hover)}
#ctxmenu .mi.danger{color:var(--danger)}
#ctxmenu .sep{height:1px;background:var(--border-soft);margin:4px 2px}
#ctxmenu .lbl{padding:6px 10px 3px;font-size:10.5px;color:var(--fg-faint);font-weight:700;letter-spacing:.04em}
#ctxmenu .colors{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 8px}
#ctxmenu .colors i{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent}
#ctxmenu .colors i.on{border-color:var(--fg)}

/* --- 폴더 고르기 (이동) --- */
.pickrow{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;
}
.pickrow:hover{background:var(--bg-hover)}
.pickrow .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.trashrow{
  display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);
}
.trashrow .meta{flex:1;min-width:0}
.trashrow .meta b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trashrow .meta span{font-size:11px;color:var(--fg-dim)}
.trashrow button{height:26px;padding:0 10px;font-size:11.5px;border-radius:6px;border:1px solid var(--border);background:var(--bg-elev);color:var(--fg);cursor:pointer}
.trashrow button.danger{color:var(--danger);border-color:var(--danger)}

/* --- 비밀번호 게이트 --- */
#gate{
  position:fixed;inset:0;z-index:2000;display:flex;
  align-items:center;justify-content:center;background:var(--bg);
}
#gate[hidden]{display:none}
.gate-box{
  display:flex;flex-direction:column;gap:12px;width:300px;padding:32px 34px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
}
.gate-logo{font-size:38px;text-align:center;line-height:1}
.gate-title{
  text-align:center;font-size:19px;font-weight:800;letter-spacing:3px;
  color:var(--accent);margin-bottom:4px;
}
.gate-box label{font-size:11px;color:var(--fg-dim);letter-spacing:.06em}
.gate-box input{
  height:38px;padding:0 12px;font-family:inherit;font-size:14px;
  background:var(--bg-sunken);border:1px solid var(--border);border-radius:8px;color:var(--fg);outline:0;
}
.gate-box input:focus{border-color:var(--accent)}
.gate-box .btn{justify-content:center;height:38px;font-weight:700}
.gate-err{font-size:11.5px;color:var(--danger)}
.gate-err[hidden]{display:none}

/* --- 여러 줄 빈 줄 (장면 전환 간격) --- */
.markdown-body .blankrun{pointer-events:none}

.workspace{flex:1;display:flex;min-width:0;min-height:0;position:relative}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.editor-pane{flex:1 1 50%;background:var(--bg-elev);border-right:1px solid var(--border)}
.preview-pane{flex:1 1 50%;background:var(--bg-elev);overflow:auto;display:block}

/* 분할 모드는 없앴다. 한 번에 한 쪽만 전체 너비로 쓴다. */
.splitter{display:none !important}
body[data-mode="view"] .editor-pane{display:none}
body[data-mode="view"] .preview-pane{flex:1 1 100%}
body[data-mode="edit"] .preview-pane{display:none}
body[data-mode="edit"] .editor-pane{flex:1 1 100%;border-right:0}

.splitter{
  width:5px;flex:0 0 auto;cursor:col-resize;background:transparent;
  margin-left:-3px;margin-right:-2px;z-index:5;position:relative;
}
.splitter:hover,.splitter.dragging{background:var(--accent);opacity:.5}

/* --- 에디터 --- */
.mdtoolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:1px;flex-wrap:wrap;
  padding:5px 8px;border-bottom:1px solid var(--border-soft);background:var(--bg-elev);
}
.mdtoolbar button{
  width:29px;height:28px;border:0;background:transparent;border-radius:6px;
  cursor:pointer;color:var(--fg-dim);display:grid;place-items:center;font-size:13px;
}
.mdtoolbar button:hover{background:var(--bg-hover);color:var(--fg)}
.mdtoolbar .gap{width:1px;height:18px;background:var(--border);margin:0 5px}
.mdtoolbar svg{width:15px;height:15px}

#editor{
  flex:1;width:100%;border:0;outline:0;resize:none;
  padding:20px 24px 40vh;
  background:var(--bg-elev);color:var(--fg);
  font-family:var(--font-doc,var(--font-mono));
  font-size:calc(13.5px * var(--zoom,1));
  line-height:1.75;tab-size:2;
  white-space:pre-wrap;word-break:break-word;
}
#editor::placeholder{color:var(--fg-faint)}

/* --- 상태 바 --- */
.statusbar{
  height:var(--status-h);flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  padding:0 12px;font-size:11.5px;color:var(--fg-dim);
  background:var(--bg-elev);border-top:1px solid var(--border);
  user-select:none;overflow:hidden;white-space:nowrap;
}
.statusbar .sp{flex:1}
.statusbar .chip{display:inline-flex;align-items:center;gap:5px}
.statusbar .path{overflow:hidden;text-overflow:ellipsis;max-width:40vw;direction:rtl;text-align:left}
.statusbar b{font-weight:600;color:var(--fg)}

/* --- 저장 상태 (헤더) ---
   구버전은 저장 표시가 상단에 크게 있었다. 데이터가 올라갔는지가 이 앱에서
   가장 중요한 정보라, 하단 구석이 아니라 눈에 띄는 자리에 둔다. */
.savechip{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  height:26px;padding:0 10px;border-radius:13px;
  font-size:12px;font-weight:600;white-space:nowrap;
  background:var(--bg-sunken);color:var(--fg-dim);
  border:1px solid transparent;transition:.15s;
}
.savechip.ok{background:var(--ok-soft,#dafbe1);color:var(--ok);border-color:transparent}
.savechip.dirty{background:var(--warn-soft,#fff8c5);color:var(--warn)}
.savechip.busy{background:var(--accent-soft);color:var(--accent)}
.savechip.err{background:var(--danger-soft,#ffebe9);color:var(--danger);border-color:var(--danger)}
html[data-theme="dark"]{--ok-soft:#12261a;--warn-soft:#2e2409;--danger-soft:#3d1d1b}
html[data-theme="sepia"]{--ok-soft:#e3ecd4;--warn-soft:#f6e9c4;--danger-soft:#f3dcd6}

.fontsel{
  height:28px;padding:0 6px;flex:0 0 auto;
  background:var(--bg-sunken);color:var(--fg);
  border:1px solid var(--border);border-radius:7px;
  font-family:inherit;font-size:12.5px;cursor:pointer;outline:0;
}
.fontsel:focus{border-color:var(--accent)}

/* --- 확대 조절 (구버전 상단 바에 있던 － % ＋) --- */
.zoombox{
  display:flex;align-items:center;flex:0 0 auto;
  background:var(--bg-sunken);border:1px solid var(--border);border-radius:7px;overflow:hidden;
}
.zoombox button{
  width:26px;height:26px;border:0;background:transparent;cursor:pointer;
  color:var(--fg-dim);font-size:13px;line-height:1;display:grid;place-items:center;
}
.zoombox button:hover{background:var(--bg-hover);color:var(--fg)}
.zoombox span{
  min-width:42px;text-align:center;font-size:11.5px;color:var(--fg-dim);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  line-height:26px;cursor:default;user-select:none;
}

/* ============================================================
   빈 화면 / 드롭 오버레이
   ============================================================ */
.empty{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--fg-faint);text-align:center;padding:24px;
}
body.empty-state .empty{display:flex}
body.empty-state .workspace > .pane,
body.empty-state .workspace > .splitter{visibility:hidden}
.empty .big{font-size:52px;line-height:1;margin-bottom:10px;opacity:.5}

mark.find{background:var(--mark);color:inherit;border-radius:2px}

/* ============================================================
   모달
   ============================================================ */
#modal{
  position:fixed;inset:0;z-index:1000;display:none;

}

.markdown-body p{margin:0 0 1.05em}

.markdown-body blockquote{
  margin:0 0 1.05em;padding:.15em 0 .15em 1.05em;

.markdown-body kbd{font-size:.82em}

.markdown-body .fnref{font-size:.78em;vertical-align:super;text-decoration:none;padding:0 .12em}

  php: 'function class extends implements public private protected static return if else elseif foreach for while do break continue try catch finally throw new echo print require include namespace use var const true false null array isset unset global',
  rb: 'def class module end return if elsif else unless while until for in do begin rescue ensure raise yield self nil true false require require_relative attr_accessor attr_reader attr_writer puts new lambda proc then',
  sql: 'SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE ALTER DROP INDEX VIEW JOIN LEFT RIGHT INNER OUTER FULL ON GROUP BY ORDER HAVING LIMIT OFFSET AND OR NOT NULL AS DISTINCT UNION ALL CASE WHEN THEN ELSE END PRIMARY KEY FOREIGN REFERENCES DEFAULT UNIQUE CONSTRAINT WITH RETURNING EXISTS IN BETWEEN LIKE IS ASC DESC COUNT SUM AVG MIN MAX',
  sh:  'if then else elif fi for while do done case esac function return export local readonly source echo cd exit set unset shift trap eval exec test in select until',
};
const BUILTIN = {
  js: 'console document window Math JSON Object Array String Number Boolean Promise Map Set Symbol Date RegExp Error require module exports process globalThis fetch localStorage',
  py: 'print len range str int float list dict set tuple bool open enumerate zip map filter sum min max sorted type isinstance super self __init__ __name__ Exception ValueError TypeError',
  sh: 'ls cat grep sed awk mkdir rm cp mv chmod curl wget git npm node python pip docker sudo find xargs tee head tail sort uniq wc',
};
const LANG_ALIAS = {
  javascript:'js', node:'js', jsx:'js', mjs:'js', cjs:'js',
  typescript:'ts', tsx:'ts',
  python:'py', py3:'py', python3:'py',
  bash:'sh', shell:'sh', zsh:'sh', console:'sh', terminal:'sh', powershell:'sh', ps1:'sh', cmd:'sh', bat:'sh',
  'c++':'c', cpp:'c', 'c#':'c', csharp:'c', cs:'c', h:'c', hpp:'c', objc:'c', kotlin:'java', kt:'java', swift:'java', scala:'java', dart:'java',
  golang:'go', rs:'rust', ruby:'rb', postgres:'sql', postgresql:'sql', mysql:'sql', sqlite:'sql',
  html:'markup', xml:'markup', svg:'markup', vue:'markup', xhtml:'markup',
  scss:'css', sass:'css', less:'css', styl:'css',
  yml:'yaml', json5:'json', jsonc:'json',
  patch:'diff',
};
const LANG_CFG = {
  js:   { kw:KW.js + ' ' + KW.ts, bi:BUILTIN.js, line:'//', block:['/*','*/'], str:['`','"',"'"] },
  ts:   { kw:KW.js + ' ' + KW.ts, bi:BUILTIN.js, line:'//', block:['/*','*/'], str:['`','"',"'"] },
  py:   { kw:KW.py, bi:BUILTIN.py, line:'#', str:['"""',"'''",'"',"'"] },
  java: { kw:KW.java, line:'//', block:['/*','*/'], str:['"',"'"] },
  c:    { kw:KW.c, line:'//', block:['/*','*/'], str:['"',"'"] },
  go:   { kw:KW.go, line:'//', block:['/*','*/'], str:['`','"',"'"] },
  rust: { kw:KW.rust, line:'//', block:['/*','*/'], str:['"'] },
  php:  { kw:KW.php, line:'//', block:['/*','*/'], str:['"',"'"] },
  rb:   { kw:KW.rb, line:'#', str:['"',"'"] },
  sql:  { kw:KW.sql, line:'--', block:['/*','*/'], str:["'",'"'], ci:true },
  sh:   { kw:KW.sh, bi:BUILTIN.sh, line:'#', str:['"',"'"] },
  css:  { kw:'important media import keyframes supports from to and not only', line:'//', block:['/*','*/'], str:['"',"'"] },
  json: { kw:'true false null', str:['"'] },
};
for (const k in LANG_CFG) {
  const c = LANG_CFG[k];
  c.kwSet = new Set((c.kw || '').split(/\s+/).filter(Boolean).map(w => c.ci ? w.toLowerCase() : w));
  c.biSet = new Set((c.bi || '').split(/\s+/).filter(Boolean));
}

const isWordChar = c => c >= '0' && c <= '9' || c >= 'a' && c <= 'z' || c >= 'A' && c <= 'Z' || c === '_' || c === '$';
const tok = (cls, txt) => '<span class="tok-' + cls + '">' + esc(txt) + '</span>';

function normLang(lang) {
  const l = String(lang || '').toLowerCase().trim().split(/[\s,{:]/)[0];
  return LANG_ALIAS[l] || l;
}

function highlight(code, lang) {
  const l = normLang(lang);
  if (l === 'markup') return hlMarkup(code);
  if (l === 'yaml')   return hlYaml(code);
  if (l === 'diff')   return hlDiff(code);
  const cfg = LANG_CFG[l];
  if (!cfg) return esc(code);

  let out = '', i = 0;
  const n = code.length;
  while (i < n) {
    const rest = code.slice(i);

    // 줄 주석
    if (cfg.line && rest.startsWith(cfg.line)) {
      let e = code.indexOf('\n', i); if (e < 0) e = n;
      out += tok('c', code.slice(i, e)); i = e; continue;
    }
    // 블록 주석
    if (cfg.block && rest.startsWith(cfg.block[0])) {
      let e = code.indexOf(cfg.block[1], i + cfg.block[0].length);
      e = e < 0 ? n : e + cfg.block[1].length;
      out += tok('c', code.slice(i, e)); i = e; continue;
    }
    // 문자열
    const q = cfg.str && cfg.str.find(x => rest.startsWith(x));
    if (q) {
      let j = i + q.length;
      const multi = q.length > 1 || q === '`';
      while (j < n) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code.startsWith(q, j)) { j += q.length; break; }
        if (code[j] === '\n' && !multi) break;
        j++;
      }
      out += tok('s', code.slice(i, Math.min(j, n))); i = Math.min(j, n); continue;
    }
    // 숫자
    if (!isWordChar(code[i - 1] || ' ')) {
      const m = /^(0[xXbBoO][0-9a-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)(?![\w$])/.exec(rest);
      if (m) { out += tok('n', m[0]); i += m[0].length; continue; }
    }
    // 단어
    if (isWordChar(code[i]) && !(code[i] >= '0' && code[i] <= '9')) {
      let j = i; while (j < n && isWordChar(code[j])) j++;
      const w = code.slice(i, j);
      const key = cfg.ci ? w.toLowerCase() : w;
      if (cfg.kwSet.has(key))       out += tok('k', w);
      else if (cfg.biSet.has(w))    out += tok('b', w);
      else if (code[j] === '(')     out += tok('f', w);
      else                          out += esc(w);
      i = j; continue;
    }
    out += esc(code[i]); i++;
  }
  return out;
}

function hlMarkup(code) {
  return esc(code)
    .replace(/&lt;!--[\s\S]*?--&gt;/g, m => '<span class="tok-c">' + m + '</span>')
    .replace(/(&lt;\/?)([\w:.-]+)/g, (m, a, b) => '<span class="tok-p">' + a + '</span><span class="tok-t">' + b + '</span>')
    .replace(/([\w:.-]+)=(&quot;.*?&quot;|&#39;.*?&#39;)/g,
      (m, a, b) => '<span class="tok-a">' + a + '</span>=<span class="tok-s">' + b + '</span>');
}
function hlYaml(code) {
  return code.split('\n').map(line => {
    if (/^\s*#/.test(line)) return tok('c', line);
    const m = /^(\s*-?\s*)([\w.$/-]+)(\s*:)(.*)$/.exec(line);
    if (m) {
      let val = m[4];
      let vh;
      if (/^\s*(&quot;|")/.test(esc(val)) || /^\s*['"]/.test(val)) vh = tok('s', val);
      else if (/^\s*(true|false|null|~|\d[\d.]*)\s*$/i.test(val)) vh = tok('n', val);
      else if (/#/.test(val)) {
        const ci = val.indexOf('#');
        vh = esc(val.slice(0, ci)) + tok('c', val.slice(ci));
      } else vh = esc(val);
      return esc(m[1]) + '<span class="tok-a">' + esc(m[2]) + '</span><span class="tok-p">' + esc(m[3]) + '</span>' + vh;
    }
    return esc(line);
  }).join('\n');
}
function hlDiff(code) {
  return code.split('\n').map(line => {
    if (/^\+\+\+|^---|^diff |^index /.test(line)) return tok('hd', line);
    if (/^@@/.test(line)) return tok('n', line);
    if (/^\+/.test(line)) return tok('add', line);
    if (/^-/.test(line))  return tok('del', line);
    return esc(line);
  }).join('\n');
}

/* =========================== 2. 새니타이저 ============================== */
const BAD_TAGS = new Set(['SCRIPT','STYLE','IFRAME','FRAME','FRAMESET','OBJECT','EMBED','APPLET',
  'LINK','META','BASE','FORM','TEXTAREA','SELECT','OPTION','BUTTON','NOSCRIPT','TEMPLATE','SLOT']);
const SAFE_URL = /^(https?:|mailto:|tel:|ftp:|#|\/|\.|[^:]*$)/i;

function sanitize(html) {
  let root;
  try {
    const doc = new DOMParser().parseFromString('<body><div id="r">' + html + '</div></body>', 'text/html');
    root = doc.getElementById('r');
  } catch (e) { return esc(html); }
  if (!root) return esc(html);

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  const kill = [];
  let el;
  while ((el = walker.nextNode())) {
    const tag = el.tagName;
    // 체크박스만 예외적으로 허용 (할 일 목록). 그 외 속성은 전부 제거.
    if (tag === 'INPUT') {
      if ((el.getAttribute('type') || '').toLowerCase() !== 'checkbox') { kill.push(el); continue; }
      for (const a of Array.from(el.attributes))
        if (!['type', 'checked', 'disabled', 'class', 'data-task'].includes(a.name)) el.removeAttribute(a.name);
      if (!el.hasAttribute('data-task')) el.setAttribute('disabled', '');  // 문서에 직접 쓴 체크박스는 읽기 전용
      continue;
    }
    if (BAD_TAGS.has(tag)) { kill.push(el); continue; }

    for (const attr of Array.from(el.attributes)) {
      const name = attr.name.toLowerCase();
      const val  = attr.value;
      if (name.startsWith('on') || name === 'srcdoc' || name === 'formaction') { el.removeAttribute(attr.name); continue; }
      if (name === 'href' || name === 'src' || name === 'xlink:href' || name === 'action' || name === 'data') {
        const v = val.trim();
        const isDataImg = /^data:image\/(png|jpe?g|gif|webp|svg\+xml|bmp);/i.test(v);
        if (!isDataImg && !SAFE_URL.test(v)) { el.removeAttribute(attr.name); }
      }
    }
    if (tag === 'A') {
      const href = el.getAttribute('href') || '';
      if (/^(https?:|mailto:|tel:|ftp:)/i.test(href)) { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
    }
  }
  kill.forEach(n => n.remove());
  return root.innerHTML;
}

/* ========================= 3. 마크다운 파서 ============================= */
let CTX = null;                       // 현재 렌더링 컨텍스트
const PH = '\uE000';                  // 인라인 플레이스홀더 문자

const INLINE_TAGS = new Set(['a','b','i','em','strong','code','span','br','img','kbd','sub','sup',
  'mark','small','del','s','u','abbr','q','cite','time','var','samp','wbr','big','font','ins','bdo','ruby','rt','rp']);

const CALLOUT = {
  note:      ['ℹ️', '참고'],
  tip:       ['💡', '팁'],
  important: ['❗', '중요'],
  warning:   ['⚠️', '주의'],
  caution:   ['🛑', '경고'],
};

const leadingSpaces = s => { let k = 0; while (s[k] === ' ') k++; return k; };
const stripIndent = (s, k) => { let j = 0; while (j < k && s[j] === ' ') j++; return s.slice(j); };
const stripTags = h => h.replace(/<[^>]*>/g, '')
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
  .replace(/&#39;/g, "'").replace(/&amp;/g, '&').trim();

function slugify(text) {
  let s = text.toLowerCase()
    .replace(/[^\p{L}\p{N}\s_-]/gu, '')
    .trim().replace(/\s+/g, '-');
  if (!s) s = 'section';
  if (CTX.slugs[s] == null) { CTX.slugs[s] = 0; return s; }
  CTX.slugs[s]++;
  return s + '-' + CTX.slugs[s];
}

function safeUrl(u) {
  let v = String(u == null ? '' : u).trim().replace(/^<|>$/g, '');
  if (/^\s*(javascript|vbscript|file):/i.test(v)) return '';
  if (/^\s*data:/i.test(v) && !/^\s*data:image\//i.test(v)) return '';
  return v;
}

/* --------------------------- 인라인 요소 ------------------------------- */
function inline(text) {
  if (text == null) return '';
  let s = String(text);
  const store = [];
  const keep = html => { store.push(html); return PH + (store.length - 1) + PH; };

  // 1) 백슬래시 이스케이프
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!>~|"'$:^])/g, (m, c) => keep(esc(c)));

  // 2) 인라인 코드
  s = s.replace(/(`+)([\s\S]*?)\1(?!`)/g, (m, ticks, code) => {
    if (!code) return m;
    let c = code;
    if (/^ [\s\S]* $/.test(c) && c.trim()) c = c.slice(1, -1);
    return keep('<code>' + esc(c) + '</code>');
  });

  // 3) 자동 링크 <url> / <email>
  s = s.replace(/<((?:https?|ftp):\/\/[^\s<>]+)>/gi, (m, u) =>
    keep('<a href="' + esc(safeUrl(u)) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>'));
  s = s.replace(/<([\w.!#$%&'*+/=?^`{|}~-]+@[\w-]+(?:\.[\w-]+)+)>/g, (m, e) =>
    keep('<a href="mailto:' + esc(e) + '">' + esc(e) + '</a>'));

  // 4) 원본 HTML 태그 보호 (뒤 단계에서 손상되지 않도록)
  s = s.replace(/<!--[\s\S]*?-->/g, m => keep(m));
  s = s.replace(/<\/?[a-zA-Z][\w:-]*(?:\s[^<>]*)?\/?>/g, m => keep(m));

  // 5) 남은 특수문자 이스케이프
  s = s.replace(/&(?![a-zA-Z][a-zA-Z0-9]{1,9};|#\d{1,7};|#[xX][0-9a-fA-F]{1,6};)/g, '&amp;')
       .replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // 6) 줄바꿈
  //    마크다운 기본 규칙은 줄바꿈 하나를 공백으로 취급해 문단을 이어붙인다.
  //    원고는 한 줄이 곧 한 줄이라 그 규칙을 쓰면 대사가 줄줄이 붙어버린다.
  //    GitHub 댓글과 같은 "줄바꿈 = 줄바꿈" 방식으로 바꾼다.
  s = s.replace(/ {2,}\n/g, '<br>\n').replace(/\\\n/g, '<br>\n').replace(/\n/g, '<br>\n');

  // 7) 이미지
  s = s.replace(/!\[([^\]]*)\]\(\s*(<[^>]*>|[^\s)]*)(?:\s+["'(]([^"')]*)["')])?\s*\)/g, (m, alt, url, title) => {
    const u = safeUrl(url);
    if (!u) return keep(esc(alt));
    return keep('<img src="' + esc(u) + '" alt="' + esc(alt) + '"' + (title ? ' title="' + esc(title) + '"' : '') + ' loading="lazy">');
  });
  // 이미지 참조형
  s = s.replace(/!\[([^\]]+)\]\[([^\]]*)\]/g, (m, alt, label) => {
    const r = CTX.refs[(label || alt).trim().toLowerCase()];
    if (!r) return m;
    return keep('<img src="' + esc(safeUrl(r.url)) + '" alt="' + esc(alt) + '" loading="lazy">');
  });

  // 8) 링크
  s = s.replace(/\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\(\s*(<[^>]*>|[^\s)]*)(?:\s+["'(]([^"')]*)["')])?\s*\)/g, (m, txt, url, title) => {
    const u = safeUrl(url);
    if (!u) return txt;
    const ext = /^(https?|ftp|mailto|tel):/i.test(u) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return keep('<a href="' + esc(u) + '"' + (title ? ' title="' + esc(title) + '"' : '') + ext + '>') + txt + keep('</a>');
  });
  // 참조형 링크
  s = s.replace(/\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\[([^\]]*)\]/g, (m, txt, label) => {
    const r = CTX.refs[(label || txt).trim().toLowerCase()];
    if (!r) return m;
    const u = safeUrl(r.url);
    const ext = /^(https?|ftp|mailto|tel):/i.test(u) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return keep('<a href="' + esc(u) + '"' + (r.title ? ' title="' + esc(r.title) + '"' : '') + ext + '>') + txt + keep('</a>');
  });

  // 9) 각주 참조
  s = s.replace(/\[\^([^\]]+)\]/g, (m, k) => {
    const key = k.trim();
    if (CTX.fnDefs[key] == null) return m;
    if (CTX.fnOrder.indexOf(key) < 0) CTX.fnOrder.push(key);
    const num = CTX.fnOrder.indexOf(key) + 1;
    return keep('<sup><a id="fnref-' + esc(key) + '" href="#fn-' + esc(key) + '" class="fnref">[' + num + ']</a></sup>');
  });

  // 10) 나머지 축약 참조형 링크 [label]
  s = s.replace(/\[([^\[\]]+)\]("|(?!\())/g, (m, txt, tail) => {
    const r = CTX.refs[txt.trim().toLowerCase()];
    if (!r) return m;
    const u = safeUrl(r.url);
    const ext = /^(https?|ftp|mailto|tel):/i.test(u) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return keep('<a href="' + esc(u) + '"' + ext + '>') + txt + keep('</a>') + tail;
  });

  // 11) 벌거벗은 URL 자동 링크
  s = s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>"'`)\]]+[^\s<>"'`)\].,;:!?])/g, (m, pre, u) => {
    const href = u.startsWith('www.') ? 'http://' + u : u;
    return pre + keep('<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>');
  });

  // 12) 강조
  s = s.replace(/\*\*\*(?!\s)([\s\S]*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/(^|[^\w])___(?!\s)([\s\S]*?)___(?!\w)/g, '$1<strong><em>$2</em></strong>');
  s = s.replace(/\*\*(?!\s)([\s\S]*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^\w])__(?!\s)([\s\S]*?)__(?!\w)/g, '$1<strong>$2</strong>');
  s = s.replace(/\*(?!\s)([^*\n]*?)\*/g, '<em>$1</em>');
  s = s.replace(/(^|[^\w])_(?!\s)([^_\n]*?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~(?!\s)([\s\S]*?)~~/g, '<del>$1</del>');
  s = s.replace(/==(?!\s)([\s\S]*?)==/g, '<mark>$1</mark>');

  // 13) 플레이스홀더 복원
  const re = new RegExp(PH + '(\\d+)' + PH, 'g');
  for (let pass = 0; pass < 8 && s.indexOf(PH) >= 0; pass++)
    s = s.replace(re, (m, idx) => (store[+idx] != null ? store[+idx] : ''));

  return s;
}

/* --------------------------- 블록 요소 --------------------------------- */
function listMatch(line) {
  const m = /^(\s*)([-*+]|\d{1,9}[.)])([ \t]+)(.*)$/.exec(line);
  if (!m) return null;
  return {
    indent: m[1].length, marker: m[2], ordered: /\d/.test(m[2]),
    start: parseInt(m[2], 10), content: m[4],
    pad: m[1].length + m[2].length + m[3].length,
  };
}
const isHr = l => /^ {0,3}(\*[ \t]*){3,}$|^ {0,3}(-[ \t]*){3,}$|^ {0,3}(_[ \t]*){3,}$/.test(l);
const isTableSep = l => /^[ \t]*\|?[ \t]*:?-{1,}:?[ \t]*(\|[ \t]*:?-{1,}:?[ \t]*)*\|?[ \t]*$/.test(l) && l.includes('-');

function startsBlock(lines, i) {
  const l = lines[i];
  if (!l || !l.trim()) return true;
  if (/^ {0,3}#{1,6}(\s|$)/.test(l)) return true;
  if (/^ {0,3}(`{3,}|~{3,})/.test(l)) return true;
  if (isHr(l)) return true;
  if (/^ {0,3}>/.test(l)) return true;
  if (/^ {0,3}([-*+]|\d{1,9}[.)])[ \t]+\S/.test(l)) return true;
  if (/^ {0,3}<(\/?[a-zA-Z][\w:-]*|!--)/.test(l)) return true;
  if (l.includes('|') && lines[i + 1] && isTableSep(lines[i + 1])) return true;
  return false;
}

function splitRow(row) {
  let s = row.trim().replace(/^\|/, '').replace(/\|\s*$/, '');
  const cells = [];
  let cur = '';
  for (let k = 0; k < s.length; k++) {
    if (s[k] === '\\' && s[k + 1] === '|') { cur += '\\|'; k++; continue; }
    if (s[k] === '|') { cells.push(cur); cur = ''; continue; }
    cur += s[k];
  }
  cells.push(cur);
  return cells.map(c => c.trim());
}

function heading(level, text) {
  const inner = inline(text);
  const plain = stripTags(inner);
  const id = slugify(plain);
  CTX.headings.push({ level, text: plain, id });
  return '<h' + level + ' id="' + esc(id) + '">' + inner + '</h' + level + '>';
}

function codeBlock(code, info) {
  const lang = String(info || '').trim();
  const norm = lang ? normLang(lang) : '';
  return '<div class="codeblock" data-lang="' + esc(lang.split(/\s+/)[0] || '') + '" data-code="' + esc(code) + '">'
       + '<pre><code class="lang-' + esc(norm) + '">' + highlight(code, lang) + '</code></pre></div>';
}

function renderList(chunk, base) {
  while (chunk.length && !chunk[chunk.length - 1].trim()) chunk.pop();
  const first = listMatch(chunk[0]);
  if (!first) return '';
  const items = [];
  let cur = null;
  for (const l of chunk) {
    const m = listMatch(l);
    if (m && m.indent <= base + 1) { cur = { lines: [m.content], pad: m.pad }; items.push(cur); }
    else if (cur) cur.lines.push(stripIndent(l, cur.pad));
  }
  const loose = chunk.some((l, idx) => !l.trim() && idx < chunk.length - 1);

  const html = items.map(it => {
    let cls = '', box = '', isTask = false;
    const tm = /^\[([ xX])\]\s+([\s\S]*)$/.exec(it.lines[0]);
    if (tm) {
      isTask = true;
      const done = tm[1].toLowerCase() === 'x';
      cls = ' class="task' + (done ? ' done' : '') + '"';
      box = '<input type="checkbox" data-task="' + (CTX.taskCount++) + '"' + (done ? ' checked' : '') + '>';
      it.lines[0] = tm[2];
    }
    let body = blocks(it.lines);
    if (!loose) body = body.replace(/^<p>([\s\S]*?)<\/p>\s*/, '$1');
    if (isTask) {
      body = /^<(ul|ol|p|div|pre|blockquote|h[1-6]|table)\b/i.test(body)
        ? box + body
        : box + '<span class="tasktext">' + body + '</span>';
    }
    return '<li' + cls + '>' + body + '</li>';
  }).join('');

  if (first.ordered) {
    const st = first.start && first.start !== 1 ? ' start="' + first.start + '"' : '';
    return '<ol' + st + '>' + html + '</ol>';
  }
  return '<ul>' + html + '</ul>';
}

function blocks(lines) {
  const out = [];
  const n = lines.length;
  let i = 0;

  while (i < n) {
    const line = lines[i];
    if (!line.trim()) {
      // 마크다운은 빈 줄이 몇 개든 문단 구분 하나로 본다. 원고에서는
      // 연속된 빈 줄이 장면 전환 간격이므로 그만큼 세로 공간을 남긴다.
      let k = i; while (k < n && !lines[k].trim()) k++;
      const run = k - i;
      if (run > 1 && out.length && k < n) out.push('<div class="blankrun" style="height:calc(1.78em * ' + (run - 1) + ')"></div>');
      i = k; continue;
    }

    /* --- 펜스 코드 --- */
    let m = /^( {0,3})(`{3,}|~{3,})(.*)$/.exec(line);
    if (m && !(m[2][0] === '`' && m[3].includes('`'))) {
      const ch = m[2][0], len = m[2].length, ind = m[1].length, info = m[3].trim();
      const buf = [];
      i++;
      while (i < n) {
        const c = /^ {0,3}(`{3,}|~{3,})\s*$/.exec(lines[i]);
        if (c && c[1][0] === ch && c[1].length >= len) { i++; break; }
        buf.push(stripIndent(lines[i], ind));
        i++;
      }
      out.push(codeBlock(buf.join('\n'), info));
      continue;
    }

    /* --- ATX 제목 --- */
    m = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?[ \t]*$/.exec(line);
    if (m) {
      out.push(heading(m[1].length, (m[2] || '').replace(/[ \t]+#+[ \t]*$/, '')));
      i++; continue;
    }

    /* --- 수평선 --- */
    if (isHr(line)) { out.push('<hr>'); i++; continue; }

    /* --- 인용문 / 콜아웃 --- */
    if (/^ {0,3}>/.test(line)) {
      const buf = [];
      while (i < n) {
        if (/^ {0,3}>/.test(lines[i])) { buf.push(lines[i].replace(/^ {0,3}>[ \t]?/, '')); i++; continue; }
        if (lines[i].trim() && buf.length && buf[buf.length - 1].trim() && !startsBlock(lines, i)) { buf.push(lines[i]); i++; continue; }
        break;
      }
      const cm = /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*(.*)$/i.exec(buf[0] || '');
      if (cm) {
        const kind = cm[1].toLowerCase();
        buf[0] = cm[2] || '';
        out.push('<div class="callout ' + kind + '"><div class="cl-title">' + CALLOUT[kind][0] + ' ' + CALLOUT[kind][1] + '</div>' + blocks(buf) + '</div>');
      } else {
        out.push('<blockquote>' + blocks(buf) + '</blockquote>');
      }
      continue;
    }

    /* --- 목록 --- */
    const li = listMatch(line);
    if (li && line.trim()) {
      const base = li.indent;
      const chunk = [];
      while (i < n) {
        const l = lines[i];
        if (!l.trim()) {
          let k = i + 1;
          while (k < n && !lines[k].trim()) k++;
          const nx = k < n ? lines[k] : null;
          const nm = nx != null ? listMatch(nx) : null;
          if (nx != null && ((nm && nm.indent >= base) || leadingSpaces(nx) > base)) { chunk.push(''); i++; continue; }
          break;
        }
        const cm2 = listMatch(l);
        if (cm2 && cm2.indent >= base) { chunk.push(l); i++; continue; }
        if (leadingSpaces(l) > base) { chunk.push(l); i++; continue; }
        if (chunk.length && chunk[chunk.length - 1].trim() && !startsBlock(lines, i)) { chunk.push(l); i++; continue; }
        break;
      }
      out.push(renderList(chunk, base));
      continue;
    }

    /* --- 표 --- */
    if (line.includes('|') && i + 1 < n && isTableSep(lines[i + 1]) && lines[i + 1].includes('-')) {
      const head = splitRow(line);
      const aligns = splitRow(lines[i + 1]).map(c =>
        /^:-+:$/.test(c) ? 'center' : /^-+:$/.test(c) ? 'right' : /^:-+$/.test(c) ? 'left' : '');
      i += 2;
      const rows = [];
      while (i < n && lines[i].trim() && lines[i].includes('|') && !isHr(lines[i])) { rows.push(splitRow(lines[i])); i++; }
      const al = k => aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '';
      let t = '<table><thead><tr>';
      head.forEach((c, k) => { t += '<th' + al(k) + '>' + inline(c) + '</th>'; });
      t += '</tr></thead><tbody>';
      for (const r of rows) {
        t += '<tr>';
        for (let k = 0; k < head.length; k++) t += '<td' + al(k) + '>' + inline(r[k] || '') + '</td>';
        t += '</tr>';
      }
      out.push(t + '</tbody></table>');
      continue;
    }

    /* --- 수식 블록 $$ --- */
    if (/^ {0,3}\$\$/.test(line)) {
      let head = line.replace(/^ {0,3}\$\$/, '');
      if (/\$\$\s*$/.test(head) && head.trim() !== '') {
        out.push('<div class="math-block">' + esc(head.replace(/\$\$\s*$/, '')) + '</div>'); i++; continue;
      }
      const buf = head.trim() ? [head] : [];
      i++;
      while (i < n && !/\$\$\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      if (i < n) { const t = lines[i].replace(/\$\$\s*$/, ''); if (t.trim()) buf.push(t); i++; }
      out.push('<div class="math-block">' + esc(buf.join('\n')) + '</div>');
      continue;
    }

    /* --- 들여쓰기 코드 블록 --- (원고에서는 사용하지 않는다)
       공백 4칸으로 시작하는 줄을 코드로 보는 규칙인데, 원고에서 문단을
       들여쓴 것뿐인 줄이 코드 상자로 둔갑한다. 백슬래시로 막을 수 있는
       문법이 아니라서 규칙 자체를 끈다. 코드는 ``` 펜스로만 쓴다. */

    /* --- HTML 블록 --- */
    m = /^ {0,3}<(?:!--|\/?([a-zA-Z][\w:-]*))/.exec(line);
    if (m && (!m[1] || !INLINE_TAGS.has(m[1].toLowerCase()))) {
      const buf = [];
      while (i < n && lines[i].trim()) { buf.push(lines[i]); i++; }
      out.push(buf.join('\n'));
      continue;
    }

    /* --- 문단 / Setext 제목 --- */
    const buf = [line];
    i++;
    let setext = 0;
    while (i < n) {
      const l = lines[i];
      if (!l.trim()) break;
      const sm = /^ {0,3}(=+|-+)[ \t]*$/.exec(l);
      if (sm) { setext = sm[1][0] === '=' ? 1 : 2; i++; break; }
      if (startsBlock(lines, i)) break;
      buf.push(l); i++;
    }
    const text = buf.join('\n').trim();
    if (setext) out.push(heading(setext, text));
    else if (text) out.push('<p>' + inline(text) + '</p>');
  }

  return out.join('\n');
}

/* --------------------------- 진입점 ------------------------------------ */
function mdRender(src) {
  CTX = { headings: [], slugs: {}, refs: {}, fnDefs: {}, fnOrder: [], taskCount: 0 };
  const lines = String(src == null ? '' : src)
    .replace(/^﻿/, '').replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');

  // YAML 머리말(front matter) 분리 — 구분선으로 오인되지 않도록 먼저 처리
  let frontHtml = '';
  if (/^---[ \t]*$/.test(lines[0] || '')) {
    let k = 1;
    while (k < lines.length && !/^(---|\.\.\.)[ \t]*$/.test(lines[k])) k++;
    if (k < lines.length && k > 1) {
      const front = lines.slice(1, k).filter(l => l.trim());
      // 진짜 구분선으로 시작하는 문서와 구분하기 위해 `키: 값` 줄이 하나라도 있어야 머리말로 인정
      if (front.some(l => /^[\w.$-]+[ \t]*:/.test(l))) {
        lines.splice(0, k + 1);
        frontHtml = '<div class="frontmatter">' + front.map(l => {
          const m = /^([\w.$-]+)[ \t]*:[ \t]*(.*)$/.exec(l);
          return m
            ? '<span class="fm-k">' + esc(m[1]) + '</span><span class="fm-v">' + esc(m[2]) + '</span>'
            : '<span class="fm-k"></span><span class="fm-v">' + esc(l.trim()) + '</span>';
        }).join('') + '</div>';
      }
    }
  }

  // 사전 수집: 각주 정의 / 링크 참조 정의
  const rest = [];
  for (let i = 0; i < lines.length; i++) {
    let m = /^ {0,3}\[\^([^\]]+)\]:[ \t]*([\s\S]*)$/.exec(lines[i]);
    if (m) {
      const key = m[1].trim();
      const buf = [m[2]];
      i++;
      while (i < lines.length && (/^ {4,}\S/.test(lines[i]) || (!lines[i].trim() && /^ {4,}\S/.test(lines[i + 1] || '')))) {
        buf.push(lines[i].replace(/^ {4}/, '')); i++;
      }
      i--;
      CTX.fnDefs[key] = buf.join('\n');
      continue;
    }
    m = /^ {0,3}\[([^\^\]][^\]]*|[^\^\]])\]:[ \t]*(\S+)(?:[ \t]+["'(](.*)["')])?[ \t]*$/.exec(lines[i]);
    if (m && /^(https?:\/\/|ftp:\/\/|mailto:|tel:|#|\.{0,2}\/|<|[\w.-]+\.[a-z]{2,})/i.test(m[2])) {
      CTX.refs[m[1].trim().toLowerCase()] = { url: m[2], title: m[3] || '' };
      continue;
    }
    rest.push(lines[i]);
  }

  let html = frontHtml + blocks(rest);

  if (CTX.fnOrder.length) {
    const items = CTX.fnOrder.map(key => {
      let body = blocks(String(CTX.fnDefs[key] == null ? '' : CTX.fnDefs[key]).split('\n'));
      const back = ' <a href="#fnref-' + esc(key) + '" class="fnref" title="본문으로">↩</a>';
      body = /<\/p>\s*$/.test(body) ? body.replace(/<\/p>\s*$/, back + '</p>') : body + back;
      return '<li id="fn-' + esc(key) + '">' + body + '</li>';
    }).join('');
    html += '\n<section class="footnotes"><ol>' + items + '</ol></section>';
  }

  return { html: sanitize(html), headings: CTX.headings };
}

/* 본문 글꼴 — 편집 화면과 미리보기에 함께 걸린다.
   구버전에 있던 선택지를 그대로 옮겼다. */
const FONTS = {
  nanum:  "'Nanum Gothic', sans-serif",
  noto:   "'Noto Sans KR', sans-serif",
  system: "'Malgun Gothic','Apple SD Gothic Neo','Helvetica Neue', sans-serif",
  mono:   "'D2Coding','Cascadia Mono',Consolas,'Nanum Gothic Coding', monospace",
};
const FONT_LABELS = { nanum:'나눔고딕', noto:'Noto Sans KR', system:'시스템 기본', mono:'고정폭(코드)' };

function setFont(key) {
  state.font = FONTS[key] ? key : 'nanum';
  document.documentElement.style.setProperty('--font-doc', FONTS[state.font]);
  if (D.fontSel) D.fontSel.value = state.font;
  persist();
}

const activeTab = () => state.tabs.find(t => t.id === state.active) || null;
const isDirty   = t => !!t && t.content !== t.saved;
const byOrder   = (a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0);
const docBytes  = s => new TextEncoder().encode(String(s || '')).length;

/* ============================ 5. 탭 관리 =============================== */
function stash() {
  const t = activeTab();
  if (!t) return;
  t.content   = D.editor.value;
  t.pvScroll  = D.pvPane.scrollTop;
  t.edScroll  = D.editor.scrollTop;
  t.sel       = D.editor.selectionStart;
}

function createTab(opts) {
  const t = Object.assign({
    id: uid(), name: '제목 없음.md', path: '', content: '', saved: '',
    handle: null, pvScroll: 0, edScroll: 0, sel: 0, headings: [],
  }, opts || {});
  state.tabs.push(t);
  return t;
}

function setActive(id) {
  if (state.active === id) return;
  stash();
  state.active = id;
  const t = activeTab();
  if (t) {
    D.editor.value = t.content;
    document.title = (isDirty(t) ? '● ' : '') + t.name + ' — NOTEPAD';
  } else {
    D.editor.value = '';
    document.title = 'NOTEPAD';
  }
  if (t && !hist.has(t.id)) histInit(t.id, t.content);
  updateUndoButtons();
  renderTabs();
  renderPreview();
  renderTree();      // 탐색기의 현재 문서 표시도 같이 옮긴다
  if (t) {
    D.pvPane.scrollTop = t.pvScroll || 0;
    D.editor.scrollTop = t.edScroll || 0;
    try { D.editor.setSelectionRange(t.sel || 0, t.sel || 0); } catch (e) {}
  }
  updateStatus();
  closeFind();
}

function closeTab(id, skipConfirm) {
  const idx = state.tabs.findIndex(t => t.id === id);
  if (idx < 0) return;
  const t = state.tabs[idx];
  if (t.id === state.active) stash();
  // 닫기 전에 대기 중인 저장을 밀어넣는다. 폴더를 전환하면 탭이 무더기로
  // 닫히는데, 그때 아직 안 올라간 편집분이 그대로 사라지면 안 된다.
  // flushTab 은 첫 await 전에 탭 객체를 잡아두므로 아래에서 배열에서
  // 빼도 안전하다.
  if (isDirty(t) || saveTimers.has(id)) flushTab(id);
  hist.delete(id);
  state.tabs.splice(idx, 1);
  if (state.active === id) {
    const next = state.tabs[idx] || state.tabs[idx - 1];
    state.active = null;
    if (next) setActive(next.id);
    else { D.editor.value = ''; renderTabs(); renderPreview(); updateStatus(); document.title = 'NOTEPAD'; }
  } else renderTabs();
  persist();
}

function renderTabs() {
  const frag = document.createDocumentFragment();
  for (const t of state.tabs) {
    const b = document.createElement('div');
    b.className = 'tab' + (t.id === state.active ? ' on' : '') + (isDirty(t) ? ' dirty' : '');
    b.dataset.id = t.id;
    b.draggable = true;
    b.title = t.path || t.name;
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = t.name;
    const dot = document.createElement('span'); dot.className = 'dot';
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = '닫기';
    b.append(nm, dot, x);
    frag.appendChild(b);
  }
  D.tabbar.querySelectorAll('.tab').forEach(n => n.remove());
  D.tabbar.appendChild(frag);
  document.body.classList.toggle('empty-state', state.tabs.length === 0);
  const cur = D.tabbar.querySelector('.tab.on');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ============================ 6. 렌더링 ================================ */
let lastRendered = null;

function renderPreview() {
  const t = activeTab();
  if (!t) { D.preview.innerHTML = ''; D.toc.innerHTML = ''; D.tocCount.textContent = ''; lastRendered = null; return; }
  const src = D.editor.value;
  if (lastRendered && lastRendered.id === t.id && lastRendered.src === src) return;

  let res;
  try { res = mdRender(src); }
  catch (err) {
    console.error(err);
    res = { html: '<p style="color:var(--danger)">렌더링 오류: ' + esc(err.message) + '</p>', headings: [] };
  }
  D.preview.innerHTML = res.html;
  t.headings = res.headings;
  lastRendered = { id: t.id, src };
  decorateCodeBlocks();
  markBrokenImages();
  renderToc();
}

function decorateCodeBlocks() {
  $$('.codeblock', D.preview).forEach(cb => {
    if (cb.querySelector('.cb-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'cb-bar';
    const lang = document.createElement('span');
    lang.className = 'cb-lang';
    lang.textContent = cb.dataset.lang || '';
    const btn = document.createElement('button');
    btn.className = 'cb-copy'; btn.type = 'button'; btn.textContent = '복사';
    btn.addEventListener('click', async () => {
      const code = cb.dataset.code || cb.querySelector('code').textContent;
      try { await navigator.clipboard.writeText(code); }
      catch (e) { legacyCopy(code); }
      btn.textContent = '복사됨!';
      setTimeout(() => { btn.textContent = '복사'; }, 1400);
    });
    bar.append(lang, btn);
    cb.insertBefore(bar, cb.firstChild);
  });
}

function markBrokenImages() {
  $$('img', D.preview).forEach(img => {
    img.addEventListener('error', () => {
      img.classList.add('broken');
      if (!img.alt) img.alt = '이미지를 불러올 수 없습니다';
    }, { once: true });
  });
}

function renderToc() {
  const t = activeTab();
  const hs = (t && t.headings) || [];
  D.tocCount.textContent = hs.length ? String(hs.length) : '';
  if (!hs.length) {
    D.toc.innerHTML = '<div class="toc-empty">제목(#)이 있으면 여기에 목차가 표시됩니다.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const h of hs) {
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'h' + h.level;
    a.textContent = h.text || '(제목 없음)';
    a.title = h.text;
    a.dataset.id = h.id;
    frag.appendChild(a);
  }
  D.toc.innerHTML = '';
  D.toc.appendChild(frag);
}

// 저장 상태 한 곳에서만 그린다. 여러 군데서 문자열을 만들면 서로 어긋난다.
const SAVE_CHIP = {
  idle:  ['준비됨',      ''],
  ok:    ['✓ 저장됨',    'ok'],
  dirty: ['● 저장 대기', 'dirty'],
  busy:  ['⟳ 저장 중…',  'busy'],
  err:   ['⚠ 저장 실패', 'err'],
};
function setSaveChip(kind) {
  const [text, cls] = SAVE_CHIP[kind] || SAVE_CHIP.idle;
  D.saveState.textContent = text;
  D.saveState.className = 'savechip ' + cls;
  D.saveState.title = kind === 'err' ? (saveError || '') : '';
}

function updateStatus() {
  const t = activeTab();
  if (!t) {
    setSaveChip('idle');
    D.filePath.textContent = ''; D.statHead.textContent = '';
    D.statCount.textContent = ''; D.statRead.textContent = '';
    D.statSize.textContent = '';
    D.statZoom.textContent = '확대 ' + Math.round(state.zoom * 100) + '%';
    return;
  }
  const text  = D.editor.value;
  const chars = text.length;
  const noSp  = text.replace(/\s/g, '').length;
  const words = (text.trim().match(/[^\s]+/g) || []).length;
  const lines = text ? text.split('\n').length : 0;
  const mins  = Math.max(1, Math.round(noSp / 500 + words / 250));

  const dirty = isDirty(t);
  setSaveChip(saveError ? 'err' : savingNow.size ? 'busy' : dirty ? 'dirty' : 'ok');
  D.filePath.textContent = t.path ? t.path + ' / ' + t.name : t.name;
  D.filePath.title = D.filePath.textContent;
  D.statHead.textContent = '제목 ' + ((t.headings || []).length);
  D.statCount.textContent = '글자 ' + chars.toLocaleString() + ' · 단어 ' + words.toLocaleString() + ' · 줄 ' + lines.toLocaleString();

  // Firestore 문서 상한(1 MiB) 대비 용량. 한글은 UTF-8 에서 3바이트라
  // 글자 수만 보면 실제 크기를 크게 낮잡게 된다.
  const bytes = docBytes(text), pct = Math.round(bytes * 100 / FS_DOC_LIMIT);
  D.statSize.textContent = (bytes / 1024).toFixed(0) + 'KB · 상한의 ' + pct + '%';
  D.statSize.style.color = pct >= 90 ? 'var(--danger)' : pct >= 60 ? 'var(--warn)' : '';
  D.statSize.style.fontWeight = pct >= 60 ? '700' : '';
  D.statSize.title = 'Firestore 는 문서 하나에 1 MiB 까지만 저장할 수 있습니다.';

  D.statRead.textContent = '읽는 시간 약 ' + mins + '분';
  D.statRead.title = '이 문서를 소리 내지 않고 읽었을 때 걸리는 예상 시간입니다.';
  D.statZoom.textContent = '확대 ' + Math.round(state.zoom * 100) + '%';
  D.statZoom.title = '화면 글자 크기입니다. Ctrl + / Ctrl - 로 조절하고 Ctrl 0 으로 되돌립니다.';
  document.title = t.name + ' — NOTEPAD';
  const tabEl = D.tabbar.querySelector('.tab[data-id="' + t.id + '"]');
  if (tabEl) tabEl.classList.toggle('dirty', dirty);
}

/* ============================ 7. Firestore ============================= */
const foldersCol = () => collection(db, 'users', DATA_PATH, 'folders');
const filesCol   = () => collection(db, 'users', DATA_PATH, 'files');
// 마크다운으로 옮기기 전의 원본 HTML 을 보관하는 곳.
// 한 문서에 원본과 마크다운을 같이 두면 가장 큰 원고가 1 MiB 상한을 넘는다.
const legacyCol  = () => collection(db, 'users', DATA_PATH, 'legacy');

// 내가 쓴 updatedAt 을 기억해 둔다. 서버가 확인해준 내 저장이 스냅샷으로
// 돌아올 때 남의 변경으로 오인하지 않기 위해서다.
const myWrites = new Map();
function noteWrite(id, u) {
  let s = myWrites.get(id);
  if (!s) { s = new Set(); myWrites.set(id, s); }
  s.add(u);
  if (s.size > 8) s.delete(s.values().next().value);
}

const stampDoc = o => { const u = Date.now(); noteWrite(o.id, u); return { ...o, updatedAt: u }; };
async function saveFolderDoc(f) { await setDoc(doc(foldersCol(), f.id), stampDoc(f)); }
async function saveFileDoc(f)   { await setDoc(doc(filesCol(),   f.id), stampDoc(f)); }

/* --- 구독 --------------------------------------------------------------
   onSnapshot 이 최초 로드와 이후 변경을 모두 담당한다. getDocs 로 한 번
   읽고 다시 구독하면 문서 전체를 두 번 받게 된다. */
let unsubFolders = null, unsubFiles = null;
const seenFirst = { folders: false, files: false };

function stopSync() {
  if (unsubFolders) unsubFolders();
  if (unsubFiles) unsubFiles();
  unsubFolders = unsubFiles = null;
  seenFirst.folders = seenFirst.files = false;
}
function startSync() {
  stopSync();
  state.syncError = null;
  unsubFolders = onSnapshot(foldersCol(), s => applyRemote('folders', s), onSyncError);
  unsubFiles   = onSnapshot(filesCol(),   s => applyRemote('files',   s), onSyncError);
}
function onSyncError(e) {
  console.error('동기화 오류:', e);
  state.syncError = (e && (e.code || e.message)) || String(e);
  state.loading = false;
  renderTree();
  toast('동기화 오류: ' + state.syncError);
}

function applyRemote(kind, snap) {
  if (snap.metadata.hasPendingWrites) return;   // 아직 확정되지 않은 내 쓰기
  const docs = snap.docs.map(d => d.data());

  if (kind === 'folders') {
    state.folders      = docs.filter(f => !f.deletedAt).sort(byOrder);
    state.trashFolders = docs.filter(f => f.deletedAt);
  } else {
    const prev = new Map(state.files.map(f => [f.id, f]));
    state.files      = docs.filter(f => !f.deletedAt).sort(byOrder);
    state.trashFiles = docs.filter(f => f.deletedAt);
    reconcileTabs(prev);
  }

  seenFirst[kind] = true;
  if (seenFirst.folders && seenFirst.files) {
    state.loading = false;
    restoreTabs(savedSession);      // 문서를 다 받은 뒤에 저장돼 있던 탭을 되살린다
  }
  renderTree();
}

/* 열어 둔 탭과 서버 내용을 맞춘다.
   편집 중이던 문서를 원격 내용으로 덮으면 치던 글이 날아간다. 그래서
   편집분이 남아 있으면 덮지 않고 알리기만 하고, 깨끗한 탭만 갱신한다. */
function reconcileTabs(prev) {
  for (const t of state.tabs) {
    if (!t.docId) continue;
    const rf = state.files.find(f => f.id === t.docId);
    if (!rf) continue;
    const before = prev.get(t.docId);
    if (before && before.updatedAt === rf.updatedAt) continue;      // 안 바뀜
    const mine = myWrites.get(rf.id);
    if (rf.updatedAt && mine && mine.has(rf.updatedAt)) continue;   // 내 저장이 돌아온 것

    if (isDirty(t) || saveTimers.has(t.id)) {
      if (!t.conflict) {
        t.conflict = true;
        toast('⚠ "' + t.name + '" 가 다른 곳에서 수정되었습니다. 저장하면 그 변경을 덮어씁니다.');
      }
      continue;
    }
    const md = docToMd(rf);
    t.content = md; t.saved = md; t.name = rf.name;
    if (t.id === state.active) {
      const pos = D.editor.selectionStart;
      D.editor.value = md;
      try { D.editor.setSelectionRange(pos, pos); } catch (e) {}
      lastRendered = null; renderPreview();
    }
  }
  renderTabs(); updateStatus();
}

/* --- HTML → 마크다운 --------------------------------------------------
   기존 문서는 contenteditable 이 만든 HTML 로 저장돼 있다. 열 때 마크다운
   으로 바꿔서 보여주되, 이 단계에서는 아직 아무것도 기록하지 않는다. */
const MK = { b: '', i: '', s: '', uo: '', uc: '' };
const unmark = s => s
  .replace(//g, '**').replace(//g, '*').replace(//g, '~~')
  .replace(//g, '<u>').replace(//g, '</u>');

const BLOCK_EL = /^(div|p)$/i;
const isEl2 = n => n.nodeType === 1;
const isBlockEl = n => isEl2(n) && BLOCK_EL.test(n.tagName);
const hasBlockChild = el => Array.from(el.childNodes).some(isBlockEl);

function escapeMd(line) {
  if (line === '') return line;
  let s = line.replace(/\\/g, '\\\\');
  s = s.replace(/~~/g, '\\~\\~');
  const bare = s.replace(/[-]/g, '');
  if (bare.trim() !== '' && /^[ \t]*[*\-_=][ \t*\-_=]*$/.test(bare)) return s.replace(/([*\-_=])/g, '\\$1');
  const P = '[\\uE001-\\uE005]*';
  s = s.replace(new RegExp('^([ \\t]*' + P + ')([*+-])([ \\t])'), '$1\\$2$3');
  s = s.replace(new RegExp('^([ \\t]*' + P + ')(#{1,6})([ \\t])'), '$1\\$2$3');
  s = s.replace(new RegExp('^([ \\t]*' + P + ')(>)'), '$1\\$2');
  s = s.replace(new RegExp('^([ \\t]*' + P + '\\d{1,9})([.)])([ \\t])'), '$1\\$2$3');
  return s;
}

function htmlToMd(html) {
  const dom = new DOMParser().parseFromString('<body><div id="r"></div></body>', 'text/html');
  const root = dom.getElementById('r');
  root.innerHTML = String(html == null ? '' : html);

  const lines = [];
  let cur = '';
  const flush = () => { lines.push(cur); cur = ''; };

  function tighten(body, open, close) {
    const m = /^([ \t]*)([\s\S]*?)([ \t]*)$/.exec(body);
    if (!m || m[2] === '') return body;
    return m[1] + open + m[2] + close + m[3];
  }
  function wrap(n, open, close) {
    const before = lines.length, base = cur.length;
    cur += open; walk(n);
    if (lines.length === before) {
      cur = cur.slice(0, base) + tighten(cur.slice(base + open.length), open, close);
      return;
    }
    const head = lines[before].slice(0, base);
    lines[before] = head + tighten(lines[before].slice(base + open.length), open, close);
    for (let k = before + 1; k < lines.length; k++)
      if (lines[k].trim() !== '') lines[k] = tighten(lines[k], open, close);
    if (cur.trim() !== '') cur = tighten(cur, open, close);
  }
  function walk(node) {
    const kids = Array.from(node.childNodes);
    for (let i = 0; i < kids.length; i++) {
      const n = kids[i];
      if (n.nodeType === 3) {
        const parts = String(n.nodeValue).split('\n');
        for (let k = 0; k < parts.length; k++) { if (k > 0) flush(); cur += parts[k]; }
        continue;
      }
      if (!isEl2(n)) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') {
        if (i === kids.length - 1 && isBlockEl(node)) continue;
        flush(); continue;
      }
      if (BLOCK_EL.test(tag)) {
        if (hasBlockChild(n)) { walk(n); continue; }
        if (cur !== '') flush();
        const before = lines.length;
        walk(n);
        if (!(cur === '' && lines.length > before)) flush();
        continue;
      }
      if (tag === 'b' || tag === 'strong') { wrap(n, MK.b, MK.b); continue; }
      if (tag === 'i' || tag === 'em')     { wrap(n, MK.i, MK.i); continue; }
      if (tag === 's' || tag === 'del' || tag === 'strike') { wrap(n, MK.s, MK.s); continue; }
      if (tag === 'u') { wrap(n, MK.uo, MK.uc); continue; }
      walk(n);
    }
  }
  walk(root);
  if (cur !== '') flush();
  return lines.map(l => unmark(escapeMd(l.replace(/[ \t]+$/, '')))).join('\n');
}

// 이미 마크다운으로 옮긴 문서는 md 필드를 쓰고, 아직인 문서는 그때그때 변환한다.
const docToMd = f => (f.format === 'md' && typeof f.md === 'string') ? f.md : htmlToMd(f.content);

/* --- 저장 엔진 ---------------------------------------------------------
   타이머를 문서별로 둔다. 전역 타이머 하나를 쓰면 A를 치다가 타이머가
   끝나기 전에 B로 넘어갔을 때 A의 저장이 취소된 채 사라진다. 구버전에서
   실제로 일어나던 사고다. */
const saveTimers = new Map();     // tabId -> timer
const savingNow  = new Set();
let saveError = null;

function scheduleSave(tabId) {
  clearTimeout(saveTimers.get(tabId));
  saveTimers.set(tabId, setTimeout(() => flushTab(tabId), 800));
  updateStatus();
}

async function writeDoc(t) {
  const f = state.files.find(x => x.id === t.docId);
  if (!f) throw new Error('문서를 찾을 수 없습니다');

  const md = t.content;
  if (docBytes(md) > FS_DOC_LIMIT - 8192) throw new Error('LIMIT');

  const now = Date.now();

  // 아직 옮기지 않은 문서라면 원본 HTML 을 먼저 따로 보관한다.
  // 이 쓰기가 실패하면 아래로 진행하지 않으므로 원본이 사라질 일이 없다.
  if (f.format !== 'md') {
    await setDoc(doc(legacyCol(), f.id), {
      id: f.id, name: f.name, html: String(f.content ?? ''),
      folderId: f.folderId ?? null, savedAt: now,
    });
  }

  const next = { ...f, md, format: 'md', schema: 2, updatedAt: now };
  delete next.content;   // 원본은 legacy 로 옮겼다. 둘 다 두면 상한을 넘는다.
  noteWrite(f.id, now);
  await setDoc(doc(filesCol(), f.id), next);
}

async function flushTab(tabId) {
  clearTimeout(saveTimers.get(tabId));
  saveTimers.delete(tabId);
  const t = state.tabs.find(x => x.id === tabId);   // await 전에 잡아둔다
  if (!t || !t.docId || t.content === t.saved) return;

  savingNow.add(tabId);
  updateStatus();
  try {
    await writeDoc(t);
    t.saved = t.content;
    saveError = null;
  } catch (e) {
    saveError = e && e.message === 'LIMIT'
      ? '문서가 1 MiB 상한을 넘어 저장하지 못했습니다. 문서를 나눠 주세요.'
      : ((e && (e.code || e.message)) || String(e));
    console.error('저장 실패:', t.name, e);
    toast('⚠ 저장 실패 — ' + saveError);
  } finally {
    savingNow.delete(tabId);
  }
  renderTabs(); updateStatus();
}

const flushAll = () => Promise.all([...saveTimers.keys()].map(flushTab));

// Ctrl+S — 자동 저장이 이미 돌지만, 지금 바로 올리고 싶을 때를 위해 남긴다.
async function saveNow() {
  const t = activeTab();
  if (!t) return;
  stash();
  if (!t.docId) { toast('아직 문서에 연결되지 않은 탭입니다.'); return; }
  if (!isDirty(t) && !saveError) { toast('이미 저장돼 있습니다.'); return; }
  await flushTab(t.id);
  if (!saveError) toast('저장했습니다 · ' + t.name);
}

// 창을 떠날 때 대기 중인 저장을 밀어넣는다.
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', () => { flushAll(); });

/* --- 문서 열기 --------------------------------------------------------- */
function openDoc(fileId) {
  const f = state.files.find(x => x.id === fileId);
  if (!f) return;
  const existing = state.tabs.find(t => t.docId === fileId);
  if (existing) { setActive(existing.id); return; }
  const md = docToMd(f);
  const t = createTab({ name: f.name, path: folderPathOf(f.folderId), docId: fileId, content: md, saved: md });
  setActive(t.id);
}

function folderPathOf(folderId) {
  const parts = [];
  let cur = state.folders.find(f => f.id === folderId), guard = 0;
  while (cur && guard++ < 20) { parts.unshift(cur.name); cur = state.folders.find(f => f.id === cur.parentId); }
  return parts.join(' / ');
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/markdown') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* --- 내려받기 (구버전의 ↓.txt / ↓.md) ----------------------------------
   v2 는 본문을 마크다운으로 들고 있으므로 .md 는 원문 그대로 나간다.
   .txt 는 문법 기호를 걷어낸 순수 글자만 남긴다. */
function mdToPlainText(md) {
  return String(md || '')
    .replace(/^```[\s\S]*?^```$/gm, m => m.replace(/^```.*$/gm, ''))  // 코드 울타리 줄만 제거
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')       // 이미지 → 설명
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')        // 링크 → 글자
    .replace(/<\/?u>/gi, '')                        // 밑줄 태그
    .replace(/^\s{0,3}#{1,6}\s+/gm, '')             // 제목 기호
    .replace(/^\s{0,3}>\s?/gm, '')                  // 인용
    .replace(/^(\s*)[-*+]\s+/gm, '$1')              // 글머리
    .replace(/^(\s*)\d{1,9}[.)]\s+/gm, '$1')        // 번호
    .replace(/\*\*\*([\s\S]*?)\*\*\*/g, '$1')
    .replace(/\*\*([\s\S]*?)\*\*/g, '$1')
    .replace(/\*([^*\n]+)\*/g, '$1')
    .replace(/~~([\s\S]*?)~~/g, '$1')
    .replace(/==([\s\S]*?)==/g, '$1')
    .replace(/`([^`\n]+)`/g, '$1')
    .replace(/\\([\\`*_{}\[\]()#+\-.!>~|=])/g, '$1'); // 이스케이프 해제 — 마지막에
}

function exportDoc(format) {
  const t = activeTab();
  if (!t) { toast('열려 있는 문서가 없습니다.'); return; }
  stash();
  const base = t.name.replace(/\.(md|markdown|txt)$/i, '') || '문서';
  const text = format === 'md' ? t.content : mdToPlainText(t.content);
  downloadText(base + '.' + format, text, 'text/plain');
  toast(base + '.' + format + ' 내려받았습니다');
}

function exportHtml() {
  const t = activeTab();
  if (!t) return;
  const css = document.querySelector('style').textContent;
  const res = mdRender(D.editor.value);
  const title = t.name.replace(/\.(md|markdown|txt)$/i, '');
  const doc = '<!DOCTYPE html>\n<html lang="ko" data-theme="' + state.theme + '">\n<head>\n'
    + '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>' + esc(title) + '</title>\n<style>\n' + css
    + '\nbody{overflow:auto;background:var(--bg)}\n.markdown-body{background:var(--bg-elev);min-height:100vh;padding-bottom:80px}\n'
    + '</style>\n</head>\n<body>\n<article class="markdown-body">\n' + res.html + '\n</article>\n</body>\n</html>';
  downloadText(title + '.html', doc, 'text/html');
  toast('HTML로 내보냈습니다');
}

function printDoc() {
  const prev = state.mode;
  if (prev !== 'view') setMode('view');
  const restore = () => { if (prev !== 'view') setMode(prev); window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(() => window.print(), 120);
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

/* ======================= 7b. 폴더 트리 / 인증 ========================== */
function childFolders(pid) {
  return state.folders.filter(f => (f.parentId || null) === (pid || null)).sort(byOrder);
}
function filesIn(fid) {
  return state.files.filter(f => f.folderId === fid).sort(byOrder);
}

let treeOrder = [];   // 화면에 보이는 순서 — Shift 범위 선택에 쓴다

function renderTree() {
  const host = D.tree;
  treeOrder = [];
  if (state.loading) { host.innerHTML = '<div class="tree-empty">문서를 불러오는 중…</div>'; return; }
  if (state.syncError) {
    host.innerHTML = '<div class="tree-empty">불러오지 못했습니다.<br>' + esc(state.syncError) + '</div>';
    return;
  }

  const frag = document.createDocumentFragment();

  // 머리줄 — 새 폴더, 휴지통, 선택 개수
  const head = document.createElement('div');
  head.className = 'tree-head';
  const trashCount = state.trashFiles.length;
  head.innerHTML =
    '<button data-act="newroot" title="최상위 폴더 만들기">＋ 폴더</button>' +
    '<button data-act="trash" title="휴지통">🗑' + (trashCount ? ' ' + trashCount : '') + '</button>' +
    '<span class="selinfo">' + (state.selected.length > 1 ? state.selected.length + '개 선택' : '') + '</span>';
  frag.appendChild(head);

  if (!state.folders.length && !state.files.length) {
    const e = document.createElement('div');
    e.className = 'tree-empty';
    e.textContent = '문서가 없습니다.';
    frag.appendChild(e);
    host.innerHTML = ''; host.appendChild(frag);
    return;
  }

  const row = (depth, cls) => {
    const d = document.createElement('div');
    d.className = 'row ' + cls;
    d.style.paddingLeft = (6 + depth * 13) + 'px';
    return d;
  };
  const nameCell = (r, kind, item) => {
    if (state.renaming && state.renaming.kind === kind && state.renaming.id === item.id) {
      const inp = document.createElement('input');
      inp.className = 'rename';
      inp.value = item.name;
      inp.dataset.renameKind = kind;
      inp.dataset.renameId = item.id;
      r.appendChild(inp);
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
    } else {
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = item.name;
      r.appendChild(nm);
    }
  };

  function walkFolder(folder, depth) {
    const open = state.openFolders.includes(folder.id);
    const kids = filesIn(folder.id);
    const subs = childFolders(folder.id);

    const r = row(depth, 'folder');
    r.dataset.folder = folder.id;
    if (isSel('folder', folder.id)) r.classList.add('sel');
    r.innerHTML =
      '<span class="tw">' + (subs.length || kids.length ? (open ? '▾' : '▸') : '') + '</span>' +
      '<span class="ic">📁<span class="dot" style="background:' + esc(folder.color || '#8b949e') + '"></span></span>';
    nameCell(r, 'folder', folder);
    const ct = document.createElement('span');
    ct.className = 'ct'; ct.textContent = kids.length || '';
    r.appendChild(ct);
    // 폴더마다 새 문서 버튼 (구버전과 동일)
    const add = document.createElement('button');
    add.className = 'addbtn'; add.textContent = '+';
    add.title = '이 폴더에 새 문서';
    add.dataset.addfile = folder.id;
    r.appendChild(add);
    frag.appendChild(r);
    treeOrder.push(selKey('folder', folder.id));

    if (!open) return;
    subs.forEach(s => walkFolder(s, depth + 1));
    kids.forEach(f => {
      const fr = row(depth + 1, 'file');
      fr.dataset.file = f.id;
      if (state.tabs.some(t => t.docId === f.id && t.id === state.active)) fr.classList.add('on');
      if (isSel('file', f.id)) fr.classList.add('sel');
      fr.innerHTML = '<span class="tw"></span><span class="ic">📄</span>';
      nameCell(fr, 'file', f);
      frag.appendChild(fr);
      treeOrder.push(selKey('file', f.id));
    });
  }

  childFolders(null).forEach(f => walkFolder(f, 0));
  host.innerHTML = '';
  host.appendChild(frag);
}

/* --- 폴더 열고 닫기 -----------------------------------------------------
   기존 버전의 동작을 그대로 옮긴다. 폴더를 누르면 그 폴더의 문서가 전부
   탭으로 열리고, 다른 폴더의 탭과 펼침은 정리된다. 한 번에 한 폴더만
   보는 방식이라 탭이 무한정 쌓이지 않는다. */
function descendantFolderIds(id) {
  const out = [id];
  state.folders.filter(f => f.parentId === id).forEach(c => out.push(...descendantFolderIds(c.id)));
  return out;
}
function ancestorIds(id) {
  const out = [];
  let cur = state.folders.find(f => f.id === id), guard = 0;
  while (cur && cur.parentId && guard++ < 20) { out.push(cur.parentId); cur = state.folders.find(f => f.id === cur.parentId); }
  return out;
}

function toggleFolder(id) {
  if (state.openFolders.includes(id)) {
    // 접기 — 자신과 하위 폴더를 접고, 그 안 문서의 탭도 닫는다
    const ids = descendantFolderIds(id);
    state.openFolders = state.openFolders.filter(x => !ids.includes(x));
    const docIds = state.files.filter(f => ids.includes(f.folderId)).map(f => f.id);
    state.tabs.slice().forEach(t => { if (docIds.includes(t.docId)) closeTab(t.id, true); });
  } else {
    // 펼치기 — 조상만 남기고 나머지 폴더는 접는다
    state.openFolders = [...ancestorIds(id), id];
    const docs = filesIn(id);
    if (docs.length) {
      // 이 폴더의 문서만 탭에 남긴다
      state.tabs.slice().forEach(t => closeTab(t.id, true));
      docs.forEach(f => openDoc(f.id));
      const first = state.tabs.find(t => t.docId === docs[0].id);
      if (first) setActive(first.id);
    }
  }
  renderTree(); persist();
}

/* --- 선택 --------------------------------------------------------------
   Ctrl 로 하나씩 더하고 Shift 로 범위를 잡는다. 여러 개를 골라 한꺼번에
   옮기거나 지우기 위한 것이다. */
function pickRow(kind, id, e) {
  const key = selKey(kind, id);
  if (e.shiftKey && state.anchor) {
    const a = treeOrder.indexOf(state.anchor), b = treeOrder.indexOf(key);
    if (a >= 0 && b >= 0) {
      state.selected = treeOrder.slice(Math.min(a, b), Math.max(a, b) + 1);
      return true;
    }
  }
  if (e.ctrlKey || e.metaKey) {
    state.selected = state.selected.includes(key)
      ? state.selected.filter(k => k !== key)
      : [...state.selected, key];
    state.anchor = key;
    return true;
  }
  state.selected = [key];
  state.anchor = key;
  return false;   // 단순 클릭 — 열기/펼치기까지 진행
}

});
