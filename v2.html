/* --- 트리 조작 --------------------------------------------------------- */
async function commitRename(kind, id, value) {
  state.renaming = null;
  const name = String(value || '').trim();
  const list = kind === 'file' ? state.files : state.folders;
  const item = list.find(x => x.id === id);
  if (!item || !name || name === item.name) { renderTree(); return; }
  const next = { ...item, name };
  if (kind === 'file') {
    state.files = state.files.map(f => f.id === id ? next : f);
    state.tabs.forEach(t => { if (t.docId === id) t.name = name; });
    renderTabs();
  } else {
    state.folders = state.folders.map(f => f.id === id ? next : f);
  }
  renderTree(); updateStatus();
  try { kind === 'file' ? await saveFileDoc(next) : await saveFolderDoc(next); }
  catch (err) { toast('이름 바꾸기 실패: ' + (err.code || err.message)); }
}

async function createFolder(parentId) {
  const sibs = childFolders(parentId);
  const maxO = sibs.reduce((m, f) => Math.max(m, f.order ?? 0), -1);
  const f = {
    id: newId(), name: '새 폴더', parentId: parentId || null,
    color: COLORS[state.folders.length % COLORS.length],
    createdAt: Date.now(), order: maxO + 1, deletedAt: null,
  };
  state.folders = [...state.folders, f].sort(byOrder);
  if (parentId && !state.openFolders.includes(parentId)) state.openFolders.push(parentId);
  state.renaming = { kind: 'folder', id: f.id };
  renderTree();
  try { await saveFolderDoc(f); } catch (e) { toast('폴더 만들기 실패: ' + (e.code || e.message)); }
}

async function createFile(folderId) {
  const maxO = filesIn(folderId).reduce((m, f) => Math.max(m, f.order ?? 0), -1);
  const f = {
    id: newId(), folderId, name: '새 문서', md: '', format: 'md', schema: 2,
    createdAt: Date.now(), order: maxO + 1, updatedAt: Date.now(), deletedAt: null,
  };
  state.files = [...state.files, f].sort(byOrder);
  if (!state.openFolders.includes(folderId)) state.openFolders.push(folderId);
  // 탭으로 바로 열고 이름 입력 상태로 둔다 (구버전과 같은 동작).
  const t = createTab({ name: f.name, path: folderPathOf(folderId), docId: f.id, content: '', saved: '' });
  state.renaming = { kind: 'file', id: f.id };
  setActive(t.id);   // 탭·미리보기·트리·상태바를 함께 그린다
  try { await saveFileDoc(f); } catch (e) { toast('문서 만들기 실패: ' + (e.code || e.message)); }
}

/* --- 상단 바 "+ 새 문서" ------------------------------------------------
   폴더 기반 앱이라 문서는 반드시 폴더 안에 있어야 한다. 지금 보고 있는
   문서나 열려 있는 폴더가 있으면 그 자리에 만들고, 없으면 폴더를 고르게
   한다. 폴더가 하나도 없으면 만들 곳이 없다는 뜻이라 안내만 한다. */
function currentFolderContext() {
  const t = activeTab();
  if (t && t.docId) {
    const f = state.files.find(x => x.id === t.docId);
    if (f) return f.folderId;
  }
  if (state.openFolders.length) return state.openFolders[state.openFolders.length - 1];
  return null;
}

async function newDocFlow() {
  const fid = currentFolderContext();
  if (fid) { await createFile(fid); return; }
  if (!state.folders.length) { toast('먼저 폴더를 만들어 주세요. 문서는 폴더 안에만 둘 수 있습니다.'); return; }
  openNewDocFolderPicker();
}

function openNewDocFolderPicker() {
  const rows = [];
  const walk = (pid, depth) => childFolders(pid).forEach(f => {
    rows.push('<div class="pickrow" data-newdoc="' + f.id + '" style="padding-left:' + (10 + depth * 16) + 'px">' +
      '<span class="dot" style="background:' + esc(f.color || '#8b949e') + '"></span>' +
      '<span>' + esc(f.name) + '</span></div>');
    walk(f.id, depth + 1);
  });
  walk(null, 0);
  openSheet('새 문서를 만들 폴더 고르기', rows.join(''));
}

async function changeFolderColor(id, color) {
  const f = state.folders.find(x => x.id === id);
  if (!f) return;
  const next = { ...f, color };
  state.folders = state.folders.map(x => x.id === id ? next : x);
  renderTree();
  try { await saveFolderDoc(next); } catch (e) { toast('색 바꾸기 실패: ' + (e.code || e.message)); }
}

/* 선택한 것들을 한 폴더로 옮긴다. 자기 자신이나 자기 하위로는 못 옮긴다. */
async function moveSelection(targetId) {
  const sel = state.selected.map(k => k.split(':'));
  const movingFolders = sel.filter(([k]) => k === 'folder').map(([, id]) => id);
  const blocked = new Set(movingFolders.flatMap(descendantFolderIds));
  if (targetId && blocked.has(targetId)) { toast('폴더를 자기 자신 안으로는 옮길 수 없습니다.'); return; }

  const jobs = [];
  for (const [kind, id] of sel) {
    if (kind === 'folder') {
      const f = state.folders.find(x => x.id === id);
      if (!f || (f.parentId || null) === (targetId || null)) continue;
      const maxO = childFolders(targetId).reduce((m, x) => Math.max(m, x.order ?? 0), -1);
      const next = { ...f, parentId: targetId || null, order: maxO + 1 };
      state.folders = state.folders.map(x => x.id === id ? next : x);
      jobs.push(saveFolderDoc(next));
    } else {
      if (!targetId) continue;   // 문서는 최상위에 둘 수 없다
      const f = state.files.find(x => x.id === id);
      if (!f || f.folderId === targetId) continue;
      const maxO = filesIn(targetId).reduce((m, x) => Math.max(m, x.order ?? 0), -1);
      const next = { ...f, folderId: targetId, order: maxO + 1 };
      state.files = state.files.map(x => x.id === id ? next : x);
      state.tabs.forEach(t => { if (t.docId === id) t.path = folderPathOf(targetId); });
      jobs.push(saveFileDoc(next));
    }
  }
  state.selected = [];
  if (targetId && !state.openFolders.includes(targetId)) state.openFolders.push(targetId);
  renderTree(); updateStatus(); closeSheet();
  try { await Promise.all(jobs); toast(jobs.length + '개를 옮겼습니다'); }
  catch (e) { toast('이동 실패: ' + (e.code || e.message)); }
}

/* 삭제는 휴지통으로만 보낸다. 실제 삭제는 휴지통에서 따로 한다. */
async function deleteSelection() {
  const sel = state.selected.map(k => k.split(':'));
  const batch = newId(), now = Date.now();
  const folderIds = [...new Set(sel.filter(([k]) => k === 'folder').flatMap(([, id]) => descendantFolderIds(id)))];
  const fileIds = [...new Set([
    ...sel.filter(([k]) => k === 'file').map(([, id]) => id),
    ...state.files.filter(f => folderIds.includes(f.folderId)).map(f => f.id),
  ])];

  // 지우기 전에 대기 중인 저장을 정리한다. 안 그러면 지운 문서가 되살아난다.
  state.tabs.slice().forEach(t => { if (fileIds.includes(t.docId)) { saveTimers.delete(t.id); closeTab(t.id, true); } });

  const goneFolders = state.folders.filter(f => folderIds.includes(f.id));
  const goneFiles   = state.files.filter(f => fileIds.includes(f.id));
  state.trashFolders = [...goneFolders.map(f => ({ ...f, deletedAt: now, deletedBatch: batch })), ...state.trashFolders];
  state.trashFiles   = [...goneFiles.map(f => ({ ...f, deletedAt: now, deletedBatch: batch })), ...state.trashFiles];
  state.folders = state.folders.filter(f => !folderIds.includes(f.id));
  state.files   = state.files.filter(f => !fileIds.includes(f.id));
  state.selected = [];
  renderTree();

  const mark = { deletedAt: now, deletedBatch: batch, updatedAt: now };
  try {
    await Promise.all([
      ...fileIds.map(id => { noteWrite(id, now); return setDoc(doc(filesCol(), id), mark, { merge: true }); }),
      ...folderIds.map(id => { noteWrite(id, now); return setDoc(doc(foldersCol(), id), mark, { merge: true }); }),
    ]);
    toast('휴지통으로 보냈습니다 · 문서 ' + fileIds.length + '개');
  } catch (e) { toast('삭제 실패: ' + (e.code || e.message)); }
}

  const hasFiles = moving.some(([k]) => k === 'file');

  const rows = [];

    if (!blocked.has(f.id)) {
      rows.push('<div class="pickrow" data-target="' + f.id + '" style="padding-left:' + (10 + depth * 16) + 'px">' +
        '<span class="dot" style="background:' + esc(f.color || '#8b949e') + '"></span>' +

    '<p style="margin:0 0 16px;color:var(--fg-dim);font-size:12.5px">휴지통에서 되돌릴 수 있습니다.</p>' +
    '<button class="btn primary" data-act="doDelete" style="width:100%;justify-content:center;height:36px">휴지통으로</button>');
}

/* --- 휴지통 --- */
function trashBatches() {
  const map = new Map();
  const push = (item, kind) => {
    const b = item.deletedBatch || ('_' + item.id);
    if (!map.has(b)) map.set(b, { batch: b, at: item.deletedAt, folders: [], files: [] });
    const e = map.get(b);
    e[kind].push(item);
    if (item.deletedAt > e.at) e.at = item.deletedAt;
  };
  state.trashFolders.forEach(f => push(f, 'folders'));
  state.trashFiles.forEach(f => push(f, 'files'));
  return [...map.values()].sort((a, b) => b.at - a.at);
}

function openTrash() {
  const bs = trashBatches();
  const fmt = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  openSheet('휴지통', bs.length ? bs.map(e => {
    const label = e.folders.length
      ? '📁 ' + esc(e.folders[0].name) + (e.folders.length > 1 ? ' 외 폴더 ' + (e.folders.length - 1) + '개' : '')
      : '📄 ' + esc((e.files[0] || {}).name || '(이름 없음)') + (e.files.length > 1 ? ' 외 ' + (e.files.length - 1) + '개' : '');
    return '<div class="trashrow"><div class="meta"><b>' + label + '</b>' +
      '<span>' + fmt(e.at) + ' 삭제 · 문서 ' + e.files.length + '개</span></div>' +
      '<button data-restore="' + e.batch + '">복원</button>' +
      '<button class="danger" data-purge="' + e.batch + '">영구 삭제</button></div>';
  }).join('') : '<p style="color:var(--fg-faint);text-align:center;padding:24px 0">휴지통이 비어 있습니다.</p>');
}

async function restoreBatch(batch) {
  const e = trashBatches().find(x => x.batch === batch);
  if (!e) return;
  const alive = new Set([...state.folders.map(f => f.id), ...e.folders.map(f => f.id)]);
  const folders = e.folders.map(f => ({ ...f, deletedAt: null, deletedBatch: null,
    parentId: (f.parentId && alive.has(f.parentId)) ? f.parentId : null }));

  // 문서가 있던 폴더가 사라졌으면 갈 곳이 없다. 화면에 안 보이면 잃은 것과
  // 같으므로 그럴 때만 복구용 폴더를 만든다.
  let rescue = null;
  if (e.files.some(f => !alive.has(f.folderId))) {
    rescue = state.folders.find(f => f.name === '복구된 문서' && !f.parentId);
    if (!rescue) {
      const maxO = childFolders(null).reduce((m, f) => Math.max(m, f.order ?? 0), -1);
      rescue = { id: newId(), name: '복구된 문서', parentId: null, color: COLORS[2],
                 createdAt: Date.now(), order: maxO + 1, deletedAt: null };
      folders.push(rescue);
    }
  }
  const files = e.files.map(f => ({ ...f, deletedAt: null, deletedBatch: null,
    folderId: alive.has(f.folderId) ? f.folderId : rescue.id }));

  state.folders = [...state.folders, ...folders].sort(byOrder);
  state.files   = [...state.files, ...files].sort(byOrder);
  state.trashFolders = state.trashFolders.filter(f => f.deletedBatch !== batch);
  state.trashFiles   = state.trashFiles.filter(f => f.deletedBatch !== batch);
  renderTree(); closeSheet();
  try {
    await Promise.all([...folders.map(saveFolderDoc), ...files.map(saveFileDoc)]);
    toast('복원했습니다 · 문서 ' + files.length + '개');
  } catch (err) { toast('복원 실패: ' + (err.code || err.message)); }
}

async function purgeBatch(batch) {
  const e = trashBatches().find(x => x.batch === batch);
  if (!e) return;
  state.trashFolders = state.trashFolders.filter(f => f.deletedBatch !== batch);
  state.trashFiles   = state.trashFiles.filter(f => f.deletedBatch !== batch);
  renderTree(); closeSheet();
  try {
    await Promise.all([
      ...e.files.map(f => deleteDoc(doc(filesCol(), f.id))),
      ...e.folders.map(f => deleteDoc(doc(foldersCol(), f.id))),
    ]);
    toast('영구 삭제했습니다');
  } catch (err) { toast('삭제 실패: ' + (err.code || err.message)); }
}

/* ============================ 8. 세션 저장 ============================= */
// 본문은 Firestore 가 원본이다. localStorage 에는 화면 설정과 어떤 문서를
// 열어 뒀는지(문서 id)만 담는다. 본문을 복사해 두면 두 벌이 어긋난다.

/* ============================ 10. 에디터 =============================== */
function replaceRange(start, end, text, selStart, selEnd) {
  const ta = D.editor;
  ta.focus();
  ta.setSelectionRange(start, end);
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok) ta.setRangeText(text, start, end, 'end');
  if (selStart != null) ta.setSelectionRange(selStart, selEnd == null ? selStart : selEnd);
  onEditorInput();
}

function surround(before, after, placeholder) {
  const ta = D.editor, v = ta.value;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = v.slice(s, e);
  if (v.slice(Math.max(0, s - before.length), s) === before && v.slice(e, e + after.length) === after) {
    replaceRange(s - before.length, e + after.length, sel, s - before.length, s - before.length + sel.length);
    return;
  }
  if (sel.startsWith(before) && sel.endsWith(after) && sel.length >= before.length + after.length) {
    const inner = sel.slice(before.length, sel.length - after.length);
    replaceRange(s, e, inner, s, s + inner.length);
    return;
  }
  const body = sel || (placeholder || '');
  replaceRange(s, e, before + body + after, s + before.length, s + before.length + body.length);
}

function lineRange() {
  const ta = D.editor, v = ta.value;
  const s = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
  let e = v.indexOf('\n', ta.selectionEnd);
  if (e < 0) e = v.length;
  return [s, e];
}

function toggleLinePrefix(prefix, re) {
  const [s, e] = lineRange();
  const lines = D.editor.value.slice(s, e).split('\n');
  const all = lines.every(l => re.test(l));
  const out = lines.map(l => (all ? l.replace(re, '') : prefix + l.replace(re, ''))).join('\n');
  replaceRange(s, e, out, s, s + out.length);
}

function insertBlock(text) {
  const ta = D.editor, v = ta.value, s = ta.selectionStart;
  const before = s > 0 && v[s - 1] !== '\n' ? '\n\n' : (s > 1 && v[s - 2] !== '\n' ? '\n' : '');
  const after = v[ta.selectionEnd] && v[ta.selectionEnd] !== '\n' ? '\n\n' : '\n';
  const t = before + text + after;
  replaceRange(s, ta.selectionEnd, t, s + before.length + text.length);
}

const TOOLBAR = [
  ['H1', '제목 1',   () => toggleLinePrefix('# ',   /^#{1,6} /)],
  ['H2', '제목 2',   () => toggleLinePrefix('## ',  /^#{1,6} /)],
  ['H3', '제목 3',   () => toggleLinePrefix('### ', /^#{1,6} /)],
  ['|'],
  ['<b>B</b>',            '굵게 (Ctrl+B)',    () => surround('**', '**', '굵은 텍스트')],
  ['<i>I</i>',            '기울임 (Ctrl+I)',  () => surround('*', '*', '기울인 텍스트')],
  ['<s>S</s>',            '취소선',            () => surround('~~', '~~', '취소선')],
  ['<span style="background:var(--mark);padding:0 3px;border-radius:3px">H</span>', '형광펜', () => surround('==', '==', '강조')],
  ['|'],
  ['&lt;/&gt;', '인라인 코드',  () => surround('`', '`', 'code')],
  ['▤',         '코드 블록',    () => insertBlock('```js\n' + (D.editor.value.slice(D.editor.selectionStart, D.editor.selectionEnd) || '// 코드') + '\n```')],
  ['”',         '인용문',       () => toggleLinePrefix('> ', /^> ?/)],
  ['|'],
  ['•',  '글머리 목록',  () => toggleLinePrefix('- ', /^\s*([-*+]|\d{1,9}[.)]) /)],
  ['1.', '번호 목록',    () => toggleLinePrefix('1. ', /^\s*([-*+]|\d{1,9}[.)]) /)],
  ['☑',  '할 일 목록',   () => toggleLinePrefix('- [ ] ', /^\s*([-*+]|\d{1,9}[.)]) (\[[ xX]\] )?/)],
  ['|'],
  ['🔗', '링크 (Ctrl+K)', () => surround('[', '](https://)', '링크 텍스트')],
  ['🖼', '이미지',        () => surround('![', '](이미지경로.png)', '설명')],
  ['▦',  '표 삽입',       () => insertBlock('| 항목 | 설명 |\n| --- | --- |\n| 내용 1 | 내용 2 |')],
  ['―',  '구분선',        () => insertBlock('---')],
];

function buildToolbar() {
  const frag = document.createDocumentFragment();
  for (const item of TOOLBAR) {
    if (item[0] === '|') { const g = document.createElement('span'); g.className = 'gap'; frag.appendChild(g); continue; }
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = item[0];
    b.title = item[1];
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', item[2]);
    frag.appendChild(b);
  }
  D.toolbar.appendChild(frag);
}

// 기존 버전의 F5 = 날짜·시간 삽입. 브라우저 새로고침을 가로채서 쓴다.
function insertDateTime() {
  if (!activeTab()) return;
  const now = new Date();
  const stamp = now.toLocaleDateString('ko-KR') + ' ' + now.toLocaleTimeString('ko-KR');
  const s = D.editor.selectionStart, e = D.editor.selectionEnd;

}

const scheduleRender = debounce(() => { renderPreview(); updateStatus(); }, 140);

/* ---- 되돌리기 / 다시 실행 ----------------------------------------------
   탭마다 이력을 따로 들고 간다. textarea 가 원래 갖고 있는 되돌리기는
   value 를 코드로 갈아끼우는 순간 통째로 사라지는데, 이 앱은 탭을 바꿀
   때마다 그렇게 한다. 그래서 브라우저 것에 기댈 수 없다. */
const HIST_MAX = 300;
const hist = new Map();   // tabId -> {stack:[{text,sel}], idx}

function histInit(tabId, text) {
  hist.set(tabId, { stack: [{ text: text || '', sel: 0 }], idx: 0 });
}
function histPush(tabId, text, sel) {
  const h = hist.get(tabId);
  if (!h) { histInit(tabId, text); return; }
  if (h.stack[h.idx] && h.stack[h.idx].text === text) return;
  h.stack = h.stack.slice(0, h.idx + 1);      // 되돌린 뒤 새로 치면 앞쪽 갈래는 버린다
  h.stack.push({ text, sel });
  if (h.stack.length > HIST_MAX) h.stack.shift();
  h.idx = h.stack.length - 1;
}
// 타이핑 중에는 일정 간격으로만 지점을 남긴다. 글자마다 남기면 한 번
// 되돌릴 때 한 글자씩만 사라져 쓸모가 없다.
const histPushSoon = debounce(() => {
  const t = activeTab();
  if (t) histPush(t.id, D.editor.value, D.editor.selectionStart);
  updateUndoButtons();
}, 400);

function histMove(dir) {
  const t = activeTab();
  if (!t) return;
  let h = hist.get(t.id);
  if (!h) { histInit(t.id, D.editor.value); h = hist.get(t.id); }
  // 아직 안 남긴 최신 상태가 있으면 먼저 남긴다. 안 그러면 방금 친 것이
  // 되돌리기 대상에서 빠진다.
  if (h.stack[h.idx].text !== D.editor.value) histPush(t.id, D.editor.value, D.editor.selectionStart);

  const next = h.idx + dir;
  if (next < 0 || next >= h.stack.length) return;
  h.idx = next;
  const snap = h.stack[next];
  D.editor.value = snap.text;
  try { D.editor.setSelectionRange(snap.sel, snap.sel); } catch (e) {}
  t.content = snap.text;
  const tabEl = D.tabbar.querySelector('.tab[data-id="' + t.id + '"]');
  if (tabEl) tabEl.classList.toggle('dirty', isDirty(t));
  scheduleRender();
  if (t.docId) scheduleSave(t.id);
  updateUndoButtons();
  persist();
}
const undo = () => histMove(-1);
const redo = () => histMove(1);

function updateUndoButtons() {
  const t = activeTab();
  const h = t ? hist.get(t.id) : null;
  const canU = !!h && (h.idx > 0 || h.stack[h.idx].text !== D.editor.value);
  const canR = !!h && h.idx < h.stack.length - 1;
  const bu = $('#btnUndo'), br = $('#btnRedo');
  if (bu) bu.disabled = !canU;
  if (br) br.disabled = !canR;
}

function onEditorInput() {
  const t = activeTab();
  if (!t) return;
  t.content = D.editor.value;
  const tabEl = D.tabbar.querySelector('.tab[data-id="' + t.id + '"]');
  if (tabEl) tabEl.classList.toggle('dirty', isDirty(t));
  scheduleRender();
  histPushSoon();
  if (t.docId) scheduleSave(t.id);
  persist();
}

/* ---- 목록 자동 이어쓰기 / Tab 들여쓰기 ---- */
D.editor.addEventListener('keydown', e => {
  const ta = D.editor, v = ta.value;

  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.isComposing) {
    if (ta.selectionStart !== ta.selectionEnd) return;
    const s = ta.selectionStart;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const line = v.slice(ls, s);
    const m = /^(\s*)(?:([-*+])|(\d{1,9})([.)]))([ \t]+)(\[[ xX]\][ \t]+)?(.*)$/.exec(line);
    if (m) {
      if (!m[7].trim()) { e.preventDefault(); replaceRange(ls, s, '', ls, ls); return; }
      e.preventDefault();
      const marker = m[2] ? m[2] : (parseInt(m[3], 10) + 1) + m[4];
      const ins = '\n' + m[1] + marker + m[5] + (m[6] ? '[ ] ' : '');
      replaceRange(s, s, ins, s + ins.length);
      return;
    }
    const q = /^(\s*>[ \t]?)(.*)$/.exec(line);
    if (q) {
      if (!q[2].trim()) { e.preventDefault(); replaceRange(ls, s, '', ls, ls); return; }
      e.preventDefault();
      const ins = '\n' + q[1];
      replaceRange(s, s, ins, s + ins.length);
      return;
    }
    return;
  }

  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd;
    const multi = v.slice(s, en).includes('\n');
    if (!multi && !e.shiftKey) { replaceRange(s, en, '  ', s + 2); return; }
    const [ls, le] = lineRange();
    const lines = v.slice(ls, le).split('\n');
    const out = lines.map(l => e.shiftKey ? l.replace(/^ {1,2}|^\t/, '') : '  ' + l).join('\n');
    replaceRange(ls, le, out, ls, ls + out.length);
    return;
  }
});

D.editor.addEventListener('input', onEditorInput);

/* ---- 스크롤 동기화 ---- */
let syncLock = 0;
function syncScroll(from) {
  if (state.mode !== 'split') return;
  if (Date.now() < syncLock) return;
  syncLock = Date.now() + 60;
  const a = from === 'editor' ? D.editor : D.pvPane;
  const b = from === 'editor' ? D.pvPane : D.editor;
  const ra = a.scrollHeight - a.clientHeight;
  const rb = b.scrollHeight - b.clientHeight;
  if (ra <= 0 || rb <= 0) return;
  b.scrollTop = (a.scrollTop / ra) * rb;
}
D.editor.addEventListener('scroll', () => syncScroll('editor'));
D.pvPane.addEventListener('scroll', () => { syncScroll('preview'); spyToc(); });

/* ---- 목차 스크롤 스파이 ---- */
const spyToc = debounce(() => {
  const t = activeTab();
  if (!t || !t.headings || !t.headings.length || !state.sidebar) return;
  const top = D.pvPane.scrollTop + 80;
  let cur = t.headings[0].id;
  for (const h of t.headings) {
    const el2 = D.preview.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(h.id) : h.id) + '"]');
    if (el2 && el2.offsetTop <= top) cur = h.id; else break;
  }
  $$('a', D.toc).forEach(a => a.classList.toggle('on', a.dataset.id === cur));
}, 90);

/* ============================ 11. 찾기 ================================= */
const findState = { matches: [], idx: 0, cs: false };

function openFind() {
  D.findbar.classList.add('on');
  D.findIn.focus();
  D.findIn.select();
  if (D.findIn.value) runFind();
}
function closeFind() {
  D.findbar.classList.remove('on');
  clearFind();
  findState.matches = []; findState.idx = 0;
  D.findCnt.textContent = '0/0';
}
function clearFind() {
  $$('mark.find', D.preview).forEach(m => {
    const p = m.parentNode;
    if (!p) return;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
    p.normalize();
  });
}
function runFind() {
  clearFind();
  findState.matches = []; findState.idx = 0;
  const q = D.findIn.value;
  if (!q) { D.findCnt.textContent = '0/0'; return; }

  if (state.mode === 'edit') {   // 편집 모드에서는 원문에서 찾기
    const hay = findState.cs ? D.editor.value : D.editor.value.toLowerCase();
    const needle = findState.cs ? q : q.toLowerCase();
    const pos = [];
    let i = hay.indexOf(needle);
    while (i >= 0) { pos.push(i); i = hay.indexOf(needle, i + needle.length); }
    findState.matches = pos.map(p => ({ textarea: true, start: p, end: p + q.length }));
    D.findCnt.textContent = (pos.length ? 1 : 0) + '/' + pos.length;
    if (pos.length) gotoMatch(0);
    return;
  }

  const walker = document.createTreeWalker(D.preview, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.nodeValue && n.nodeValue.length && n.parentNode && n.parentNode.nodeName !== 'SCRIPT')
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  let node;
  while ((node = walker.nextNode())) nodes.push(node);

  const needle = findState.cs ? q : q.toLowerCase();
  const marks = [];
  for (const n of nodes) {
    const raw = n.nodeValue;
    const hay = findState.cs ? raw : raw.toLowerCase();
    let idx = hay.indexOf(needle);
    if (idx < 0) continue;
    let cursor = n, consumed = 0;
    while (idx >= 0) {
      const rel = idx - consumed;
      const target = cursor.splitText(rel);
      const tail = target.splitText(needle.length);
      const mk = document.createElement('mark');
      mk.className = 'find';
      target.parentNode.replaceChild(mk, target);
      mk.appendChild(target);
      marks.push(mk);
      consumed = idx + needle.length;
      cursor = tail;
      idx = hay.indexOf(needle, consumed);
    }
  }
  findState.matches = marks;
  D.findCnt.textContent = (marks.length ? 1 : 0) + '/' + marks.length;
  if (marks.length) gotoMatch(0);
}
function gotoMatch(i) {
  const list = findState.matches;
  if (!list.length) return;
  findState.idx = (i + list.length) % list.length;
  const m = list[findState.idx];
  if (m.textarea) {
    D.editor.focus();
    D.editor.setSelectionRange(m.start, m.end);
    const ratio = m.start / Math.max(1, D.editor.value.length);
    D.editor.scrollTop = ratio * (D.editor.scrollHeight - D.editor.clientHeight);
  } else {
    list.forEach(x => x.classList && x.classList.remove('cur'));
    m.classList.add('cur');
    m.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  D.findCnt.textContent = (findState.idx + 1) + '/' + list.length;
}

/* ============================ 12. 더보기 시트 ========================== */
const SHEET_BTN = 'display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-elev);cursor:pointer;margin-bottom:7px;font-size:13.5px';

function openSheet(title, html) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;

}
function closeSheet() { $('#modal').classList.remove('on'); }

function showMore() {

    + '탭을 닫거나 폴더를 옮길 때도 대기 중인 저장을 먼저 올립니다.</p>'

    + '<p style="margin:0 0 8px">아직 붙지 않은 것: 새 문서 · 이름 바꾸기 · 삭제 · 휴지통.</p>'
    + '<p style="margin:0;color:var(--fg-dim);font-size:12.5px">데이터 경로: <code>users/' + esc(DATA_PATH) + '</code></p>');
}

$('#modalBody').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  closeSheet();
  if (act === 'doDelete') { deleteSelection(); return; }
  if (act === 'dlMd') exportDoc('md');
  else if (act === 'dlTxt') exportDoc('txt');
  else if (act === 'export') exportHtml();
  else if (act === 'print') printDoc();
  else if (act === 'copyMd') {
    const t = activeTab();
    if (!t) return;
    navigator.clipboard.writeText(D.editor.value).then(() => toast('원문을 복사했습니다'), () => { legacyCopy(D.editor.value); toast('원문을 복사했습니다'); });
  } else if (act === 'width') {
    const opts = [700, 860, 1080, 0];
    setWidth(opts[(opts.indexOf(state.width) + 1) % opts.length]);
    toast('문서 폭: ' + (state.width ? state.width + 'px' : '전체 너비'));
  } else if (act === 'closeOth') {
    state.tabs.filter(t => t.id !== state.active).forEach(t => closeTab(t.id));
  } else if (act === 'closeAll') {
    if (state.tabs.some(isDirty) && !confirm('저장하지 않은 문서가 있습니다. 모두 닫을까요?')) return;
    state.tabs.slice().forEach(t => closeTab(t.id, true));
  } else if (act === 'help') showHelp();
});

/* ============================ 13. 이벤트 연결 ========================== */
$('#btnSidebar').addEventListener('click', () => toggleSidebar());
D.fontSel.addEventListener('change', () => setFont(D.fontSel.value));
$('#btnZoomIn').addEventListener('click', () => setZoom(state.zoom + 0.1));
$('#btnZoomOut').addEventListener('click', () => setZoom(state.zoom - 0.1));
$('#zoomVal').addEventListener('click', () => setZoom(1));   // 눌러서 100% 로
$('#btnNew').addEventListener('click', newDocFlow);
$('#btnUndo').addEventListener('click', () => { D.editor.focus(); undo(); });
$('#btnRedo').addEventListener('click', () => { D.editor.focus(); redo(); });
$('#tabLeft').addEventListener('click', () => { D.tabbar.scrollLeft -= 200; });
$('#tabRight').addEventListener('click', () => { D.tabbar.scrollLeft += 200; });
$('#btnSave').addEventListener('click', () => saveNow());
$('#btnFind').addEventListener('click', () => (D.findbar.classList.contains('on') ? closeFind() : openFind()));
$('#btnToc').addEventListener('click', () => {
  // 사이드바가 닫혀 있으면 열면서 목차로, 이미 목차를 보고 있으면 닫는다
  if (state.sidebar && state.sidebarView === 'toc') { toggleSidebar(false); return; }
  toggleSidebar(true);
  setSidebarView('toc');
});
function setSidebarView(v) {
  state.sidebarView = v;
  $$('#sideSwitch button').forEach(x => x.classList.toggle('on', x.dataset.view === v));
  D.tree.hidden = v !== 'tree';
  D.toc.hidden  = v !== 'toc';
  persist();
}
$('#btnTheme').addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]));
$('#btnMore').addEventListener('click', showMore);
$('#modalClose').addEventListener('click', closeSheet);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });

$$('#modeSwitch button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

/* ---- 탭 클릭 / 닫기 / 순서 변경 ---- */
D.tabbar.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  if (e.target.classList.contains('x')) { closeTab(tab.dataset.id); return; }
  setActive(tab.dataset.id);
});
D.tabbar.addEventListener('auxclick', e => {
  const tab = e.target.closest('.tab');
  if (tab && e.button === 1) { e.preventDefault(); closeTab(tab.dataset.id); }
});
let dragTabId = null;
D.tabbar.addEventListener('dragstart', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  dragTabId = tab.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'tab:' + dragTabId); } catch (err) {}
});
D.tabbar.addEventListener('dragover', e => {
  if (!dragTabId) return;
  e.preventDefault();
  const tab = e.target.closest('.tab');
  $$('.tab', D.tabbar).forEach(t => t.classList.remove('drag-over'));
  if (tab && tab.dataset.id !== dragTabId) tab.classList.add('drag-over');
});
D.tabbar.addEventListener('drop', e => {
  if (!dragTabId) return;
  e.preventDefault();
  e.stopPropagation();
  const tab = e.target.closest('.tab');
  $$('.tab', D.tabbar).forEach(t => t.classList.remove('drag-over'));
  if (tab && tab.dataset.id !== dragTabId) {
    const from = state.tabs.findIndex(t => t.id === dragTabId);
    const to = state.tabs.findIndex(t => t.id === tab.dataset.id);
    if (from >= 0 && to >= 0) { const [m] = state.tabs.splice(from, 1); state.tabs.splice(to, 0, m); renderTabs(); persist(); }
  }
  dragTabId = null;
});
D.tabbar.addEventListener('dragend', () => {
  dragTabId = null;
  $$('.tab', D.tabbar).forEach(t => t.classList.remove('drag-over'));
});

/* ---- 목차 클릭 ---- */
D.toc.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  const id = a.dataset.id;
  // 목차는 미리보기 쪽 위치로 이동한다. 편집 중이라면 먼저 미리보기로
  // 바꾼 다음에 위치를 재야 한다 — 숨겨진 요소는 offsetTop 이 0 이다.
  if (state.mode !== 'view') setMode('view');
  requestAnimationFrame(() => {
    const target = D.preview.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (target) D.pvPane.scrollTo({ top: target.offsetTop - 12, behavior: 'smooth' });
  });
  $$('a', D.toc).forEach(x => x.classList.toggle('on', x === a));
});

/* ---- 프리뷰 내부 링크 / 체크박스 ---- */
D.preview.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a) {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('#')) {
      e.preventDefault();
      const id = decodeURIComponent(href.slice(1));
      const target = D.preview.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (target) D.pvPane.scrollTo({ top: target.offsetTop - 12, behavior: 'smooth' });
    }
  }
});
D.preview.addEventListener('change', e => {
  const box = e.target;
  if (box.tagName !== 'INPUT' || box.type !== 'checkbox' || !box.dataset.task) return;
  toggleSourceTask(parseInt(box.dataset.task, 10), box.checked);
});

function toggleSourceTask(index, checked) {
  const t = activeTab();
  if (!t) return;
  const lines = D.editor.value.split('\n');
  let fence = null, count = 0;
  for (let i = 0; i < lines.length; i++) {
    const f = /^ {0,3}(`{3,}|~{3,})/.exec(lines[i]);
    if (f) { if (!fence) fence = f[1][0]; else if (f[1][0] === fence) fence = null; continue; }
    if (fence) continue;
    const m = /^(\s*(?:[-*+]|\d{1,9}[.)])[ \t]+\[)([ xX])(\])/.exec(lines[i]);
    if (!m) continue;
    if (count === index) {
      lines[i] = m[1] + (checked ? 'x' : ' ') + m[3] + lines[i].slice(m[0].length);
      const pos = D.editor.selectionStart;
      D.editor.value = lines.join('\n');
      try { D.editor.setSelectionRange(pos, pos); } catch (e) {}
      onEditorInput();
      return;
    }
    count++;
  }
}

/* ---- 분할 크기 조절 ---- */
(() => {
  let dragging = false;
  D.splitter.addEventListener('mousedown', e => {
    dragging = true;
    D.splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const ws = $('#workspace').getBoundingClientRect();
    const ratio = Math.min(0.85, Math.max(0.15, (e.clientX - ws.left) / ws.width));
    D.edPane.style.flex = ratio + ' 1 0';
    D.pvPane.style.flex = (1 - ratio) + ' 1 0';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    D.splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

/* ---- 찾기 바 ---- */
D.findIn.addEventListener('input', debounce(runFind, 180));
D.findIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoMatch(findState.idx + (e.shiftKey ? -1 : 1)); }
  else if (e.key === 'Escape') { e.preventDefault(); closeFind(); D.editor.focus(); }
});
$('#findNext').addEventListener('click', () => gotoMatch(findState.idx + 1));
$('#findPrev').addEventListener('click', () => gotoMatch(findState.idx - 1));
$('#findClose').addEventListener('click', closeFind);
$('#findCase').addEventListener('click', function () {
  findState.cs = !findState.cs;
  this.classList.toggle('on', findState.cs);
  runFind();
});

/* ---- 전역 단축키 ---- */
window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;

  if (e.key === 'F1') { e.preventDefault(); showHelp(); return; }
  if (e.key === 'F5' && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); insertDateTime(); return; }
  if (e.key === 'Escape') {
    if ($('#modal').classList.contains('on')) { closeSheet(); return; }
    if (D.findbar.classList.contains('on')) { closeFind(); return; }
  }
  if (!mod) return;

  const k = e.key.toLowerCase();
  if (k === 'o') { e.preventDefault(); toggleSidebar(true); }
  // Ctrl+N 은 뺐다 — Chrome/Edge 가 "새 창" 으로 미리 예약해 둔 단축키라
  // 페이지에서 preventDefault() 해도 막히지 않는다. 새 문서는 상단
  // "+ 새 문서" 버튼이나 폴더 우클릭 메뉴로 만든다.
  // 되돌리기는 우리 이력을 쓴다. 브라우저 기본 동작은 막아야 두 이력이
  // 엇갈리지 않는다.
  else if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (k === 'y') { e.preventDefault(); redo(); }
  else if (k === 's') { e.preventDefault(); saveNow(); }
  else if (k === 'w') { e.preventDefault(); if (state.active) closeTab(state.active); }
  else if (k === 'f') { e.preventDefault(); openFind(); }
  else if (k === 'p') { e.preventDefault(); printDoc(); }
  else if (k === '\\') { e.preventDefault(); toggleSidebar(); }
  else if (k === 'l' && e.shiftKey) { e.preventDefault(); setTheme(THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]); }
  else if (k === '1') { e.preventDefault(); setMode('edit'); }
  else if (k === '2') { e.preventDefault(); setMode('view'); }
  else if (k === '=' || k === '+') { e.preventDefault(); setZoom(state.zoom + 0.1); }
  else if (k === '-' || k === '_') { e.preventDefault(); setZoom(state.zoom - 0.1); }
  else if (k === '0') { e.preventDefault(); setZoom(1); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    if (state.tabs.length < 2) return;
    const i = state.tabs.findIndex(t => t.id === state.active);
    const n = (i + (e.shiftKey ? -1 : 1) + state.tabs.length) % state.tabs.length;
    setActive(state.tabs[n].id);
  }
  else if (document.activeElement === D.editor) {
    if (k === 'b') { e.preventDefault(); surround('**', '**', '굵은 텍스트'); }
    else if (k === 'i') { e.preventDefault(); surround('*', '*', '기울인 텍스트'); }
    else if (k === 'k') { e.preventDefault(); surround('[', '](https://)', '링크 텍스트'); }
  }
});

window.addEventListener('beforeunload', (e) => {
  try { stash(); flushAll(); } catch (err) {}
  // 아직 서버로 못 올린 편집분이 있으면 창을 닫기 전에 한 번 잡는다.
  if (saveTimers.size || savingNow.size || saveError || state.tabs.some(isDirty)) {
    e.preventDefault(); e.returnValue = ''; return '';
  }
});

/* ============================ 14. 시작 ================================= */
let savedSession = null;

function boot() {
  document.documentElement.style.setProperty('--zoom', state.zoom);
  savedSession = restoreUI();
  setTheme(state.theme);
  setMode(state.mode);
  setZoom(state.zoom);
  setWidth(state.width);
  toggleSidebar(state.sidebar);
  buildToolbar();

  D.fontSel.innerHTML = Object.entries(FONT_LABELS)
    .map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('');
  setFont(state.font);

  // 사이드바 전환 상태 반영
  $$('#sideSwitch button').forEach(b => b.classList.toggle('on', b.dataset.view === state.sidebarView));
  D.tree.hidden = state.sidebarView !== 'tree';
  D.toc.hidden  = state.sidebarView !== 'toc';

  renderTabs(); renderPreview(); updateStatus(); renderTree(); updateUndoButtons();

  // 기억해 둔 비밀번호가 있으면 게이트를 건너뛴다 (onAuthStateChanged 가 처리)
  if (localStorage.getItem('notepad_authed') === '1') {
    D.gatePw.value = PASSWORD;
    signInAnonymously(fbAuth).catch(e => {
      D.gateErr.textContent = '연결 실패: ' + (e.code || e.message);
      D.gateErr.hidden = false;
      D.gate.hidden = false;
    });
  } else {
    D.gate.hidden = false;
    setTimeout(() => D.gatePw.focus(), 60);
  }
}
boot();
