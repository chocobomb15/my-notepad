    e.preventDefault();e.stopPropagation();
    // 선택 밖을 누르면 그것만 선택한다. 선택 안이면 선택 전체가 대상이다.
    if(!isSel(type,id)){state.selected=[selKey(type,id)];state.selAnchor=selKey(type,id);}
    state.contextMenu={type,id,x:e.clientX,y:e.clientY};render();
  };
  window._moveSel=()=>{state.moveModal={multi:true};state.contextMenu=null;render();};
  window._delSel=()=>{
    const {folderIds,fileIds,chars}=selectionScope();
    state.contextMenu=null;
    askConfirm({
      title:"휴지통으로 보내기",
      message:`폴더 <b>${folderIds.length}</b>개 · 문서 <b>${fileIds.length}</b>개를 휴지통으로 보냅니다.`,
      detail:`본문 ${chars.toLocaleString()}자<br>🗑 휴지통에서 한 번에 되돌릴 수 있습니다.`,
      okLabel:"휴지통으로",
      onConfirm:()=>deleteSelection(),
    });
  };
  window._ctxA=(a,id)=>{
    if     (a==="rename")        {state.renamingId=id;state.renamingVal=state.files.find(f=>f.id===id)?.name||"";
                                  state.renameSrc="side";state.renameFresh=false;state.contextMenu=null;render();}
    else if(a==="renamefolder")  {state.renamingFolderId=id;state.renamingFolderVal=state.folders.find(f=>f.id===id)?.name||"";state.contextMenu=null;render();}
    else if(a==="delfile"){
      const f=state.files.find(x=>x.id===id);
      const chars=htmlToText(f?.content||"").length;
      state.contextMenu=null;
      askConfirm({
        title:"문서 삭제",
        message:`<b>${esc(f?.name||"")}</b> 문서를 휴지통으로 보냅니다.`,
        detail:`본문 ${chars.toLocaleString()}자 · 🗑 휴지통에서 되돌릴 수 있습니다.`,
        okLabel:"휴지통으로",
        onConfirm:()=>deleteFile(id),
      });
    }
    else if(a==="newfile")     {newFile(id);state.contextMenu=null;}
    else if(a==="duplicate")   {duplicateFile(id);}
    else if(a==="delfolder"){
      const folder=state.folders.find(x=>x.id===id);
      const allIds=getAllDescendantFolderIds(id);
      const victims=state.files.filter(f=>allIds.includes(f.folderId));
      const chars=victims.reduce((n,f)=>n+htmlToText(f.content||"").length,0);
      state.contextMenu=null;
      askConfirm({
        title:"폴더 삭제",
        message:`<b>${esc(folder?.name||"")}</b> 폴더를 휴지통으로 보냅니다.<br>안에 든 것도 <b>전부 함께</b> 들어갑니다.`,
        detail:`하위 폴더 ${allIds.length-1}개 · 문서 ${victims.length}개 · 본문 ${chars.toLocaleString()}자<br>🗑 휴지통에서 한 번에 되돌릴 수 있습니다.`,
        okLabel:`${victims.length}개 문서 휴지통으로`,
        onConfirm:()=>deleteFolder(id),
      });
    }
    else if(a==="newsubfolder"){state.newFolderMode=true;state.newFolderParentId=id;state.contextMenu=null;render();}
    else if(a==="movefile")    {state.moveModal={itemId:id,itemType:"file"};state.contextMenu=null;render();}
    else if(a==="movefolder")  {state.moveModal={itemId:id,itemType:"folder"};state.contextMenu=null;render();}
  };
  window._moveTo=(targetId)=>{
    const {itemId,itemType,multi}=state.moveModal;
    const target=targetId==="__root__"?null:targetId;
    if(multi)                    moveSelection(target);
    else if(itemType==="file")   moveFileTo(itemId, targetId);
    else                         moveFolderTo(itemId, target);
  };
  window._closeMoveModal=()=>{state.moveModal=null;render();};
  window._undo=()=>undoMove(-1);
  window._redo=()=>undoMove(1);
  window._gsOpen=()=>{state.globalOpen=true;render();};
  window._gsClose=()=>{state.globalOpen=false;render();};
  // 입력 중에는 render() 를 부르지 않는다. 입력칸이 새로 만들어져 커서가 날아간다.
  let gsTimer=null;
  window._gsInput=(v)=>{
    state.globalQuery=v;
    clearTimeout(gsTimer);
    gsTimer=setTimeout(renderGlobalResults,180);
  };
  window._gsKey=(e)=>{
    if(e.key==="Enter"){clearTimeout(gsTimer);renderGlobalResults();}
    if(e.key==="Escape"){state.globalOpen=false;render();}
  };
  // 결과를 누르면 그 문서를 열고, 기존 찾기 기능으로 해당 위치까지 데려간다.
  window._gsGo=(fileId)=>{
    const f=state.files.find(x=>x.id===fileId);if(!f)return;
    const q=state.globalQuery.trim();
    state.globalOpen=false;
    openFile(f);
    if(!q)return;
    state.findText=q;state.findIndex=-1;state.findOpen=true;
    render();
    setTimeout(()=>handleFind("down"),60);
  };
  window._scToggle=(id)=>{
    const sc=state.syncClash;if(!sc)return;
    sc.picked.has(id)?sc.picked.delete(id):sc.picked.add(id);
    render();
  };
  window._scAll=(on)=>{
    const sc=state.syncClash;if(!sc)return;
    sc.picked=on?new Set(sc.files.map(f=>f.id)):new Set();
    render();
  };
  window._scClose=()=>{state.syncClash=null;render();};
  window._retryLoad=()=>{loadRetries=0;clearTimeout(loadRetryTimer);loadRetryPending=false;loadData();};
  window._scApply=async()=>{
    const sc=state.syncClash;if(!sc)return;
    const chosen=sc.files.filter(f=>sc.picked.has(f.id));
    state.syncClash=null;render();
    try{
      // 고른 것만 내 내용으로 덮는다. 고르지 않은 것은 건드리지 않고,
      // 이어지는 loadData 가 서버 내용을 받아온다.
      if(chosen.length) await Promise.all(chosen.map(f=>pushFileNow(f)));
      // 덮어쓰지 않기로 한 문서는 로컬 편집분을 버려야 서버 것이 들어온다.
      sc.files.filter(f=>!sc.picked.has(f.id)).forEach(f=>cancelSave(f.id));
      saveError=null;
      const pulled=await loadData({quiet:true});
      if(!pulled){
        toast((chosen.length?`${chosen.length}개는 덮어썼지만, `:"")+"서버 내용을 받아오지 못했습니다. 잠시 뒤 다시 동기화해 주세요.","err");
        return;
      }
      toast(chosen.length?`${chosen.length}개를 내 것으로 덮어썼습니다`:"서버 내용을 받아왔습니다","ok");
    }catch(e){
      toast("동기화 실패: "+((e&&(e.code||e.message))||e),"err");
    }
  };
  window._help=()=>{state.helpOpen=true;render();};
  window._helpClose=()=>{state.helpOpen=false;render();};
  window._cfYes=()=>{const cb=state.confirmDialog?.onConfirm;state.confirmDialog=null;render();if(cb)cb();};
  window._cfNo =()=>{state.confirmDialog=null;render();};
  window._export2=exportBackup;
  window._trOpen =()=>{state.trashOpen=true;render();};
  window._trClose=()=>{state.trashOpen=false;render();};
  window._trRestore=(b)=>restoreBatch(b);
  window._trPurge=(b)=>{
    const e=trashBatches().find(x=>x.batch===b);if(!e)return;
    const chars=e.files.reduce((n,f)=>n+htmlToText(f.content||"").length,0);
    askConfirm({
      title:"영구 삭제",
      message:`문서 <b>${e.files.length}</b>개를 <b>완전히</b> 지웁니다.`,
      detail:`본문 ${chars.toLocaleString()}자<br>이 작업은 되돌릴 수 없습니다. 백업에도 남지 않습니다.`,
      okLabel:"영구 삭제",
      onConfirm:()=>purgeBatch(b),
    });
  };
  window._rfi=(v)=>{state.renamingFolderVal=v;};
  window._rfc=(id)=>commitFolderRename(id);
  window._rfEsc=()=>{state.renamingFolderId=null;state.renamingFolderVal="";render();};
  window._findDir=(dir)=>handleFind(dir);
  window._changeColor=(id,color)=>changeFolderColor(id,color);
  window._paste=(e)=>{
    e.preventDefault();
    const cb=e.clipboardData;
    const text=cb.getData("text/plain");
    // 서식이 있으면 살려서 넣고, 없거나 추려낼 게 없으면 글자만 넣는다.
    let html=null;
    try{ const raw=cb.getData("text/html"); if(raw) html=sanitizePasteHTML(raw); }catch(err){ html=null; }
    if(!html){
      html=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .split("\n").map(l=>`<div>${l||"<br>"}</div>`).join("");
    }
    // 문서 하나가 1 MiB 를 넘으면 저장이 아예 안 된다. 넣기 전에 막는다.
    const file=state.files.find(f=>f.id===state.activeTab);
    if(file&&docBytes(file.content)+docBytes(html)>FS_DOC_LIMIT-8192){
      toast("붙여넣으면 문서가 저장 한도(1 MiB)를 넘습니다. 문서를 나눠 주세요.","err");
      return;
    }
    document.execCommand("insertHTML",false,html);
    handleTextChange();
  };
  window._kd=(e)=>{
    if(handleTypography(e))return;   // “ ” 와 … 자동 변환
    if((e.ctrlKey||e.metaKey)&&e.key==="b"){e.preventDefault();applyFormat("bold");}
    if((e.ctrlKey||e.metaKey)&&e.key==="i"){e.preventDefault();applyFormat("italic");}
    if((e.ctrlKey||e.metaKey)&&e.key==="u"){e.preventDefault();applyFormat("underline");}
    if(e.key==="F5"){e.preventDefault();insertDateTime();}
    if(e.key==="Tab"){e.preventDefault();document.execCommand("insertText",false,"    ");}
  };
  document.onclick=(e)=>{
    if(state.contextMenu&&!e.target.closest("#ctxmenu")){state.contextMenu=null;render();}
  };
}

// ─── 좌우로 미는 막대에서 마우스 휠 ───
// 휴대폰은 손가락으로 밀면 되지만, 좁은 PC 창에서 마우스로는 가로로 밀 방법이 없다
// (스크롤바는 높이를 먹어서 숨겼다). 세로 휠을 가로 이동으로 바꿔 준다.
// 막대가 넘치지 않으면 아무것도 하지 않는다.
window.addEventListener("wheel",(e)=>{
  const bar=e.target.closest&&e.target.closest(".hscroll");
  if(!bar||bar.scrollWidth<=bar.clientWidth)return;
  if(Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;      // 트랙패드 가로 밀기는 그대로 둔다
  bar.scrollLeft+=e.deltaY;
  e.preventDefault();
},{passive:false});

// ─── 전역 단축키 ──────────────
// render() 는 매번 body.innerHTML 을 통째로 새로 쓰기 때문에, 그때마다
// document.activeElement 가 body 로 리셋된다. 찾기·줌·모달 닫기처럼
// 에디터에 커서가 없어도 되는 단축키를 #editor 의 onkeydown 에만 걸어두면
// 포커스가 body 에 있는 대부분의 순간에 브라우저 기본 동작(예: Ctrl+H
// 방문기록)이 대신 실행된다. 이 셋은 window 레벨에서 한 번만 등록한다.
window.addEventListener("keydown",(e)=>{
  if(e.key==="F1"){e.preventDefault();state.helpOpen=true;render();return;}
  if(e.key==="Escape"){
    if(!state.contextMenu&&!state.findOpen&&!state.moveModal&&!state.confirmDialog&&!state.trashOpen&&!state.helpOpen&&!state.globalOpen&&!state.syncClash&&!state.selected.length)return;
    const st=document.getElementById("editor")?.scrollTop||0;
    // 확인 모달이 떠 있으면 그것만 닫는다. 뒤에 있는 휴지통까지 같이 닫히면 안 된다.
    if(state.confirmDialog){state.confirmDialog=null;render();return;}
    if(state.helpOpen){state.helpOpen=false;render();return;}
    if(state.syncClash){state.syncClash=null;render();return;}
    if(state.globalOpen){state.globalOpen=false;render();return;}
    const wasFindOpen=state.findOpen;
    state.contextMenu=null;state.findOpen=false;state.moveModal=null;state.trashOpen=false;
    state.selected=[];state.selAnchor=null;render();
    if(wasFindOpen) landCaretAtLastMatch(st);
    else{const ed=document.getElementById("editor");if(ed)ed.scrollTop=st;}
    return;
  }
  if(!(e.ctrlKey||e.metaKey))return;
  if(!state.authed)return;
  const k=e.key.toLowerCase();
  // 되돌리기는 우리 이력을 쓴다. 브라우저 기본 동작이 같이 돌면 두 이력이
  // 엇갈려 내용이 뒤죽박죽된다.
  if(k==="z"){e.preventDefault();e.shiftKey?undoMove(1):undoMove(-1);return;}
  if(k==="y"){e.preventDefault();undoMove(1);return;}
  // Ctrl+S — 지금 동기화. 자동 저장이 이미 돌지만, 확실히 올리고 싶을 때를 위해 둔다.
  if(k==="s"){e.preventDefault();manualSync();return;}
  // Ctrl+Shift+F — 전체 문서에서 찾기 (열린 문서가 없어도 쓸 수 있다)
  if(k==="f"&&e.shiftKey){e.preventDefault();state.globalOpen=true;render();return;}
  if(k==="h"||k==="f"){
    if(!state.activeTab)return;
    e.preventDefault();
    const st=document.getElementById("editor")?.scrollTop||0;
    const opening=!state.findOpen;
    if(opening){findMatchStart=null;findMatchEnd=null;}
    state.findOpen=opening;render();
    if(opening)setTimeout(()=>document.getElementById("findInput")?.focus(),50);
    else landCaretAtLastMatch(st);
  } else if(k==="="||k==="+"){e.preventDefault();state.zoom=Math.min(state.zoom+10,200);render();}
  else if(k==="-"){e.preventDefault();state.zoom=Math.max(state.zoom-10,50);render();}
});

render();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}
#editor::selection,#editor *::selection{background:#388bfd44;}
/* 한 줄에 다 안 들어가는 막대(상단 바·서식 도구줄·상태줄). 넘치는 부분을 잘라내거나
   항목을 억지로 줄이면(글씨가 세로로 찌그러짐) 휴대폰에서 버튼에 손이 닿지 않는다.
   항목 크기는 그대로 두고 손가락으로 좌우로 밀게 한다. 스크롤바는 높이를 먹으므로 숨긴다. */
.hscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.hscroll::-webkit-scrollbar{display:none;}
.hscroll>*{flex-shrink:0;white-space:nowrap;}
/* 좁은 화면에서는 "✓ 저장됨" 글씨를 숨기고 저장 버튼 자체가 상태를 보여준다 */
@media (max-width:600px){.save-ind{display:none;}}
/* 형광펜은 연한 파스텔이라, 다크모드의 흰 글자를 그대로 두면 읽을 수 없다.
   칠해진 부분만 글자색을 어둡게 고정한다. 지우다 남은 transparent 는 제외. */
#editor [style*="background-color"]:not([style*="transparent"]){color:#1a1a1a;}
.drag-handle:active{cursor:grabbing;}
.sortable-ghost{opacity:0.35;background:#58a6ff22;}
.sortable-chosen{opacity:0.95;}
#tabBar::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f8fa;color:#0969da;font-family:'Nanum Gothic',sans-serif;">불러오는 중...</div>
</body>
</html>
