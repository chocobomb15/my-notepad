let toastTimer=null;
function toast(msg,kind){
  let el=document.getElementById("toastbox");
  if(!el){
    el=document.createElement("div");
    el.id="toastbox";
    document.body.appendChild(el);
  }
  const t=T();
  el.textContent=msg;
  el.style.cssText=`position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:4000;
    padding:10px 18px;border-radius:20px;font-size:13px;font-family:inherit;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:1;transition:opacity .25s;
    background:${kind==="err"?"#f87171":kind==="ok"?"#34d399":t.tx};
    color:${kind?"#fff":t.bg};`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ if(el) el.style.opacity="0"; },2400);
}

// ─── Firestore ───────────────
// 데이터 경로. 실제 사용은 "shared", 개편 작업 리허설은 "staging".
// 배포 전에 반드시 "shared" 인지 확인할 것.
const DATA_PATH="shared";
function uid(){return DATA_PATH;}
function foldersCol(){return collection(db,"users",uid(),"folders");}
function filesCol()  {return collection(db,"users",uid(),"files");}

// 저장할 때마다 updatedAt 을 남긴다. 기존 필드는 건드리지 않고 추가만 한다.
const stamp=o=>({...o,updatedAt:Date.now()});
async function saveFolder(f){await setDoc(doc(foldersCol(),f.id),stamp(f));}
async function saveFile(f)  {await setDoc(doc(filesCol(),f.id),stamp(f));}

// ─── 소프트 삭제 ──────────────
// deleteDoc 은 휴지통 비우기에서만 쓴다. 일반 삭제는 deletedAt 표시만 남긴다.
// deletedBatch 는 "폴더 하나를 지웠다" 를 한 묶음으로 복원하기 위한 그룹 ID.
const markDeleted=b=>({deletedAt:Date.now(),deletedBatch:b,updatedAt:Date.now()});
const markRestored=()=>({deletedAt:null,deletedBatch:null,updatedAt:Date.now()});
async function softDelFolder(id,b){await setDoc(doc(foldersCol(),id),markDeleted(b),{merge:true});}
async function softDelFile(id,b)  {await setDoc(doc(filesCol(),id),  markDeleted(b),{merge:true});}
async function undelFile(id)      {await setDoc(doc(filesCol(),id),  markRestored(),{merge:true});}
async function purgeFolder(id){await deleteDoc(doc(foldersCol(),id));}
async function purgeFile(id)  {await deleteDoc(doc(filesCol(),id));}

const byOrder=(a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0);

// ─── 서버에서 읽기 ────────────
// getDocs 는 서버에 닿지 못하면 오류를 내지 않고 캐시를 돌려준다. 이 앱은 캐시를
// 따로 두지 않으므로 그 결과는 "문서 0개" 다. 실험으로 확인했다 — 네트워크를
// 끊고 읽으면 오류 없이 0개, fromCache:true, 11ms 만에 "성공" 한다.
// 절전에서 깨어난 직후나 와이파이가 바뀌는 순간 새로고침하면 이 빈 결과를 진짜로
// 믿게 되고, 실제로 원고가 있는 데이터베이스에 기본 폴더("개인"·"업무")를 써넣은
// 일이 있었다. 그래서 서버에서 받은 결과만 쓰고, 못 받으면 오류로 멈춘다.
//
// orderBy("createdAt") 은 쓰지 않는다. 그 필드가 없는 문서가 조용히 빠진다.
// 정렬은 어차피 클라이언트가 다시 하므로 전량을 그냥 읽는다.
async function readAllFromServer(){
  const [fSnap,fileSnap]=await Promise.all([getDocsFromServer(foldersCol()),getDocsFromServer(filesCol())]);
  return {fSnap,fileSnap};
}

// 처음 여는데 못 받았으면 조금 뒤 스스로 다시 시도한다. 절전에서 깨어난 직후처럼
// 연결이 몇 초 늦게 붙는 경우가 대부분이라 대개 이것으로 풀린다.
let loadRetries=0,loadRetryTimer=null,loadRetryPending=false;
const nothingLoaded=()=>!state.folders.length&&!state.files.length&&!state.trashFolders.length&&!state.trashFiles.length;
function scheduleLoadRetry(){
  if(loadRetries>=3){loadRetryPending=false;return;}
  clearTimeout(loadRetryTimer);
  loadRetries++;
  loadRetryPending=true;
  loadRetryTimer=setTimeout(()=>{
    loadRetryPending=false;
    if(state.authed&&state.loadError&&nothingLoaded()) loadData();
  },loadRetries*2500);
}
window.addEventListener("online",()=>{
  if(state.authed&&state.loadError&&nothingLoaded()){loadRetries=0;loadData();}
});

async function loadData(opts={}){
  const hadData=!nothingLoaded();
  let fSnap,fileSnap;
  try{
    ({fSnap,fileSnap}=await readAllFromServer());
  }catch(e){
    // 못 받았으면 지금 화면과 상태를 그대로 둔다. 비우면 원고가 사라진 것처럼
    // 보이고, 그 상태에서 동기화하면 옛 내용이 새 내용을 덮는다.
    state.loadError=(e&&(e.code||e.message))||String(e);
    console.error("불러오기 실패:",e);
    if(hadData){
      if(!opts.quiet) toast("서버에 연결하지 못해 최신 내용을 받지 못했습니다. 화면은 그대로 둡니다.","err");
    }else{
      scheduleLoadRetry();
      render();
    }
    return false;
  }
  const allFolders=fSnap.docs.map(d=>d.data());
  const allFiles  =fileSnap.docs.map(d=>d.data());

  // 마지막 방어선. 서버가 통째로 비었다고 답했는데 이 창에는 내용이 있었다면
  // 믿지 않는다. 삭제는 휴지통 표시만 남기므로 정상이라면 0개가 될 수 없다.
  if(hadData&&!allFolders.length&&!allFiles.length){
    if(!opts.quiet) toast("서버에서 문서를 하나도 받지 못했습니다. 화면은 그대로 둡니다. 잠시 뒤 다시 동기화해 주세요.","err");
    return false;
  }
  state.loadError=null;loadRetries=0;clearTimeout(loadRetryTimer);loadRetryPending=false;

  // 아직 서버에 못 올린 편집분은 서버 내용으로 덮지 않는다.
  // 덮으면 방금 친 글이 조용히 사라진다. 저장이 끝나면 자연히 풀린다.
  const pending=new Set([...unsaved,...saveTimers.keys()]);
  const localBefore=new Map(state.files.map(f=>[f.id,f]));   // 덮기 전에 잡아둔다
  const serverIds=new Set(allFiles.map(f=>f.id));

  state.folders=allFolders.filter(f=>!f.deletedAt).sort(byOrder);
  const merged=allFiles.filter(f=>!f.deletedAt)
    .map(f=>(pending.has(f.id)&&localBefore.get(f.id))||f);
  // 서버에 아직 올라가지 않은(막 만든) 문서도 남긴다
  for(const id of pending){
    if(!serverIds.has(id)&&localBefore.has(id)) merged.push(localBefore.get(id));
  }
  state.files=merged.sort(byOrder);
  state.trashFolders=allFolders.filter(f=>f.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
  state.trashFiles  =allFiles.filter(f=>f.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);
  // 예전에는 폴더가 0개면 기본 폴더("개인"·"업무")와 예시 문서를 서버에 써넣었다.
  // 연결이 불안정할 때 받은 빈 결과를 믿고 실제 원고가 있는 데이터베이스에 그것을
  // 써넣은 원인이라 없앴다. 빈 데이터베이스라면 빈 화면에서 폴더를 만들면 된다.
  restoreSession();
  render();
  return true;
}

// ─── 세션 복원 ────────────────
// 열어 둔 폴더·탭을 기억했다가 다시 열 때 되살린다. 본문은 Firestore 가
// 원본이므로 여기에는 id 만 담는다. 본문을 복사해 두면 두 벌이 어긋난다.
const SESSION_KEY="notepad_session_v1";
let sessionRestored=false;
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY,JSON.stringify({
      openFolderIds:state.openFolderIds,
      tabs:state.tabs.map(t=>t.fileId),
      activeTab:state.activeTab,
    }));
  }catch(e){/* 용량 초과 등 무시 */}
}
function restoreSession(){
  if(sessionRestored)return;
  sessionRestored=true;
  let s=null;
  try{s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");}catch(e){s=null;}
  if(!s)return;
  // 지워졌거나 사라진 문서는 조용히 걸러낸다.
  const alive=new Set(state.files.map(f=>f.id));
  const aliveFolders=new Set(state.folders.map(f=>f.id));
  const ids=(s.tabs||[]).filter(id=>alive.has(id));
  if(!ids.length)return;
  state.openFolderIds=(s.openFolderIds||[]).filter(id=>aliveFolders.has(id));
  state.tabs=ids.map(id=>({fileId:id,folderId:state.files.find(f=>f.id===id).folderId}));
  state.activeTab=alive.has(s.activeTab)?s.activeTab:ids[ids.length-1];
}
// ─── 수동 동기화 ──────────────
// 순서가 중요하다. 먼저 내 편집분을 올리고(push) 그다음 서버를 다시 읽는다(pull).
// 반대로 하면 아직 안 올라간 글이 서버 내용에 덮여 사라진다.
let syncing=false;
async function manualSync(){
  if(syncing)return;
  if(!state.authed)return;
  syncing=true;
  setSaveIndicator();                                 // 저장·🔄 버튼을 "… 저장" 으로 막는다
  try{
    commitEditor();                                   // 편집 중 내용을 state 에 반영

    // 저장 대기열(unsaved)에만 기대면 안 된다. 자동 저장이 성공하면 대기열은
    // 비워지고, 저장이 실패했거나 어떤 이유로든 대기열에서 빠진 문서는 서버와
    // 달라도 영영 안 올라간다. 그래서 이 창의 내용을 서버와 통째로 대조해
    // 다른 것을 전부 올린다. "이 창에서 만들고 고친 것 전부" 가 기준이다.
    //
    // 이 대조는 반드시 서버에서 받은 결과로 해야 한다. 빈 결과를 믿으면 모든 문서가
    // "서버에 없음" 으로 보여 전부 올라가고, 충돌 확인(서버 쪽이 더 최신인가)도
    // 서버 문서가 없으니 건너뛰게 된다. 다른 기기에서 쓴 글이 이 창의 옛 내용에
    // 조용히 덮인다. 못 받으면 여기서 멈추고 아무것도 올리지 않는다.
    let fSnap,fileSnap;
    try{
      ({fSnap,fileSnap}=await readAllFromServer());
    }catch(e){
      toast("서버에 연결하지 못해 아무것도 올리지 않았습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.","err");
      return;
    }
    const srvFiles  =new Map(fileSnap.docs.map(d=>[d.id,d.data()]));
    const srvFolders=new Map(fSnap.docs.map(d=>[d.id,d.data()]));

    const fileDiffers=(f,s)=>!s
      ||(s.content||"")!==(f.content||"")
      ||s.name!==f.name||s.folderId!==f.folderId
      ||(s.order??null)!==(f.order??null)
      ||(s.deletedAt??null)!==(f.deletedAt??null);
    const folderDiffers=(f,s)=>!s
      ||s.name!==f.name||(s.parentId||null)!==(f.parentId||null)
      ||(s.order??null)!==(f.order??null)||s.color!==f.color
      ||(s.deletedAt??null)!==(f.deletedAt??null);

    const pushFiles  =state.files.filter(f=>fileDiffers(f,srvFiles.get(f.id)));
    const pushFolders=state.folders.filter(f=>folderDiffers(f,srvFolders.get(f.id)));

    // 내가 바꾼 문서를 다른 곳에서 더 나중에 바꿨으면 그냥 올리면 안 된다.
    const clash=pushFiles.filter(f=>{
      const s=srvFiles.get(f.id);
      return s&&s.updatedAt&&f.updatedAt&&s.updatedAt>f.updatedAt;
    });

    // 충돌한 문서와 아닌 문서를 나눈다. 충돌 하나 때문에 멀쩡한 나머지까지
    // 못 올리면, 정작 안전하게 올릴 수 있던 글도 창을 닫는 순간 잃는다.
    const clashIds=new Set(clash.map(f=>f.id));
    const safeFiles=pushFiles.filter(f=>!clashIds.has(f.id));

    const doPush=async(files,folders,quiet)=>{
      await Promise.all([
        ...files.map(f=>pushFileNow(f)),
        ...(folders||[]).map(f=>saveFolder(f)),
      ]);
      saveError=null;
      const pulled=await loadData({quiet:true});      // 그다음 최신 내용을 받아온다
      const parts=[];
      if(files.length)             parts.push(`문서 ${files.length}개`);
      if((folders||[]).length)     parts.push(`폴더 ${folders.length}개`);
      if(!pulled){
        toast((parts.length?`${parts.join(" · ")} 올렸지만, `:"")+"최신 내용을 받아오지 못했습니다. 잠시 뒤 다시 동기화해 주세요.","err");
        return;
      }
      if(quiet)return;
      toast(parts.length?`${parts.join(" · ")} 올리고 동기화했습니다`:"이미 최신 상태입니다","ok");
    };

    if(clash.length){
      // 충돌 없는 것은 먼저 올려 둔다. 사용자가 고민하는 동안 잃지 않도록.
      if(safeFiles.length||pushFolders.length) await doPush(safeFiles,pushFolders,true);
      state.syncClash={files:clash,server:srvFiles,picked:new Set(clash.map(f=>f.id)),safe:safeFiles.length};
      render();
      return;
    }

    await doPush(pushFiles,pushFolders);
  }catch(e){
    toast("동기화 실패: "+((e&&(e.code||e.message))||e),"err");
  }finally{
    syncing=false;
    setSaveIndicator();
  }
}
const refreshData=manualSync;

// ─── Auth ────────────────────
async function tryLogin(){
  if(state.pwInput===PASSWORD){
    state.pwError=false;localStorage.setItem("notepad_authed","1");
    if(!state.firebaseReady) await signInAnonymously(auth);
    else{state.authed=true;await loadData();}
  } else {state.pwError=true;render();setTimeout(()=>document.getElementById("pwInput")?.focus(),50);}
}
onAuthStateChanged(auth,async(user)=>{
  state.firebaseReady=!!user;
  const remembered=localStorage.getItem("notepad_authed")==="1";
  if(user&&(state.pwInput===PASSWORD||remembered)){state.authed=true;await loadData();}
});

// ─── Content helpers ─────────
function textToHTML(content){
  if(isHTML(content)) return content;
  return content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .split("\n").map(l=>`<div>${l||"<br>"}</div>`).join("");
}
function isHTML(s){return /<(strong|em|b|i|s|del|div|br|p|u|span|mark)\b/i.test(s);}

// ─── 붙여넣기 서식 추려내기 ───
// 워드·웹에서 복사한 HTML 을 그대로 넣으면 <span style> · <font> 같은 것이
// 딸려와 문서가 크게 부풀고(문서당 1 MiB 상한), 이 앱의 변환기가 다루지
// 못하는 태그가 섞인다. 이 원고가 지금까지 써온 여섯 가지
// (b i u strike div br) 로만 추려서 넣는다.
const PASTE_INLINE={B:"b",STRONG:"b",I:"i",EM:"i",U:"u",INS:"u",S:"strike",STRIKE:"strike",DEL:"strike"};
const PASTE_BLOCK=/^(DIV|P|LI|TR|H[1-6]|BLOCKQUOTE|PRE|SECTION|ARTICLE|UL|OL|TABLE|TBODY|THEAD)$/;
const PASTE_DROP="script,style,head,meta,link,noscript,img,svg,video,audio,iframe,object,embed,input,button,select,textarea";

// style 에서 형광펜으로 살릴 배경색을 읽는다.
// 어두운 배경은 버린다. 다크 테마 웹페이지에서 복사하면 배경이 딸려오는데,
// 이 에디터는 칠해진 글자를 검게 그리므로 검정 위 검정이 되어 안 보인다.
function readHighlight(style){
  const m=style.match(/background(?:-color)?\s*:\s*([^;]+)/);
  if(!m)return null;
  const v=m[1].trim();
  if(!v||v==="transparent"||v==="initial"||v==="inherit"||v==="none")return null;
  let r,g,b;
  const rgb=v.match(/rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:[\s,/]+([\d.]+))?/);
  if(rgb){
    [r,g,b]=[+rgb[1],+rgb[2],+rgb[3]];
    if(rgb[4]!==undefined&&+rgb[4]<0.1)return null;        // 사실상 투명
  }else{
    const hex=v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if(!hex)return null;                                    // 이름 색(yellow 등)은 다루지 않는다
    const h=hex[1].length===3?hex[1].replace(/./g,c=>c+c):hex[1];
    const n=parseInt(h,16);
    [r,g,b]=[n>>16&255,n>>8&255,n&255];
  }
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum<0.6)return null;                                   // 어두운 배경은 형광펜이 아니다
  if(lum>0.97)return null;                                  // 흰 배경은 칠한 게 아니다
  return `rgb(${r}, ${g}, ${b})`;
}

// style 에서 살릴 글자색을 읽는다.
// 웹페이지 본문 글자색(검정·진회색·흰색 계열)은 버린다. 그것은 "색을 넣은
// 것" 이 아니라 그 사이트의 기본 글자색일 뿐인데, 그대로 가져오면 다크모드에서
// 검정 위 검정이 되거나 라이트모드에서 흰 글자가 되어 안 보인다.
function readTextColor(style){
  const m=style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/);
  if(!m)return null;
  const v=m[1].trim();
  if(!v||v==="inherit"||v==="initial"||v==="currentcolor")return null;
  let r,g,b;
  const rgb=v.match(/rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:[\s,/]+([\d.]+))?/);
  if(rgb){
    [r,g,b]=[+rgb[1],+rgb[2],+rgb[3]];
    if(rgb[4]!==undefined&&+rgb[4]<0.3)return null;
  }else{
    const hex=v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if(!hex)return null;
    const h=hex[1].length===3?hex[1].replace(/./g,c=>c+c):hex[1];
    const n=parseInt(h,16);
    [r,g,b]=[n>>16&255,n>>8&255,n&255];
  }
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  if(max-min<40)return null;                      // 무채색 = 본문 기본 글자색
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum<0.18||lum>0.85)return null;              // 너무 어둡거나 밝으면 한쪽 배경에서 안 보인다
  return `rgb(${r}, ${g}, ${b})`;
}

function sanitizePasteHTML(html){
  const dom=new DOMParser().parseFromString(`<div id="r">${html}</div>`,"text/html");
  const root=dom.getElementById("r");
  if(!root) return null;
  root.querySelectorAll(PASTE_DROP).forEach(n=>n.remove());

  const lines=[];
  let cur="",curTrailFromSource=false;
  const flush=()=>{
    // 줄 끝 공백이 소스 줄바꿈에서 온 것이면 버린다
    lines.push(curTrailFromSource?cur.replace(/ +$/,""):cur);
    cur="";curTrailFromSource=false;
  };
  // 워드·구글독스는 <b> 대신 <span style="font-weight:700"> 을 쓴다.
  // 태그 이름만 보면 굵게가 통째로 사라지므로 style 도 함께 본다.
  const inlineFromStyle=el=>{
    const s=(el.getAttribute&&el.getAttribute("style")||"").toLowerCase();
    if(!s)return [];
    const tags=[];
    if(/font-weight\s*:\s*(bold|[6-9]00)/.test(s))tags.push("b");
    if(/font-style\s*:\s*italic/.test(s))tags.push("i");
    if(/text-decoration[^;]*underline/.test(s))tags.push("u");
    if(/text-decoration[^;]*line-through/.test(s))tags.push("strike");
    const hl=readHighlight(s);
    if(hl)tags.push("hl:"+hl);
    const fc=readTextColor(s);
    if(fc)tags.push("fc:"+fc);
    return tags;
  };
  const escT=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const isStyleTag=t=>t.startsWith("hl:")||t.startsWith("fc:");
  const openTag=t=>t.startsWith("hl:")?`<span style="background-color: ${t.slice(3)};">`
                 :t.startsWith("fc:")?`<span style="color: ${t.slice(3)};">`:`<${t}>`;
  const closeTag=t=>isStyleTag(t)?"</span>":`</${t}>`;
  const wrap=(text,tags)=>{
    if(!tags.length)return text;
    // 형광펜과 글자색은 각각 하나만 남긴다. 겹쳐 오면 안쪽(나중) 것이 실제로
    // 보이는 색이므로 그것으로 덮어쓴다.
    const seen=new Map(),u=[];
    for(const t of tags){
      const key=isStyleTag(t)?t.slice(0,2):t;
      if(seen.has(key)){ if(isStyleTag(t)) u[seen.get(key)]=t; continue; }
      seen.set(key,u.length);u.push(t);
    }
    return u.map(openTag).join("")+text+u.slice().reverse().map(closeTag).join("");
  };

  (function walk(node,open){
    for(const n of node.childNodes){
      if(n.nodeType===3){
        const raw=n.nodeValue;
        // 태그 사이에 낀 줄바꿈·들여쓰기는 HTML 소스를 보기 좋게 만든 것일 뿐
        // 내용이 아니다. 그대로 두면 붙여넣은 줄 맨 앞에 공백이 생긴다.
        if(raw.trim()===""&&/[\r\n\t]/.test(raw)) continue;
        let t=raw.replace(/[\r\n\t]+/g," ");
        // 줄 맨 앞인데 소스 줄바꿈에서 온 공백이면 버린다.
        // (사용자가 직접 넣은 들여쓰기는 줄바꿈이 아니라 공백으로 시작하므로 남는다)
        const atLineStart=cur.replace(/<[^>]*>/g,"")==="";
        if(atLineStart&&/^[\r\n\t]/.test(raw)) t=t.replace(/^ +/,"");
        // 연속 공백은 줄이지 않는다. 이 에디터는 white-space:pre-wrap 이라
        // Tab 으로 넣은 들여쓰기처럼 공백 개수가 그대로 화면에 보인다.
        if(t){ cur+=wrap(escT(t),open); curTrailFromSource=/[\r\n\t][ ]*$/.test(raw); }
        continue;
      }
      if(n.nodeType!==1)continue;
      const tag=n.tagName;
      if(tag==="BR"){flush();continue;}
      // 굵게 위에 형광펜을 칠하면 브라우저가 <b style="background-color:..."> 를
      // 만든다. 태그 이름만 보면 그 형광펜이 사라지므로 style 도 함께 읽는다.
      const inline=PASTE_INLINE[tag];
      if(inline){walk(n,[...open,inline,...inlineFromStyle(n)]);continue;}
      if(PASTE_BLOCK.test(tag)){
        if(cur.trim()!=="")flush(); else cur="";
        walk(n,open);
        if(cur.trim()!=="")flush(); else cur="";
        continue;
      }
      walk(n,[...open,...inlineFromStyle(n)]);   // 모르는 태그는 벗기되 style 의 서식은 살린다
    }
  })(root,[]);
  if(cur.trim()!=="")flush();

  while(lines.length&&!lines[0].trim())lines.shift();
  while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  if(!lines.length) return null;
  return lines.map(l=>`<div>${l||"<br>"}</div>`).join("");
}
function htmlToMarkdown(html){
  let md=html;
  md=md.replace(/<strong>([\s\S]*?)<\/strong>/gi,"**$1**");
  md=md.replace(/<b>([\s\S]*?)<\/b>/gi,"**$1**");
  md=md.replace(/<em>([\s\S]*?)<\/em>/gi,"*$1*");
  md=md.replace(/<i>([\s\S]*?)<\/i>/gi,"*$1*");
  md=md.replace(/<s>([\s\S]*?)<\/s>/gi,"~~$1~~");
  md=md.replace(/<strike>([\s\S]*?)<\/strike>/gi,"~~$1~~");
  md=md.replace(/<del>([\s\S]*?)<\/del>/gi,"~~$1~~");
  md=md.replace(/<u>([\s\S]*?)<\/u>/gi,"$1");
  md=md.replace(/<br\s*\/?>/gi,"\n");
  md=md.replace(/<div><br\s*\/?><\/div>/gi,"\n");
  md=md.replace(/<\/div><div>/gi,"\n");
  md=md.replace(/<div>/gi,"\n").replace(/<\/div>/gi,"");
  md=md.replace(/<\/p>/gi,"\n").replace(/<p>/gi,"");
  md=md.replace(/<[^>]+>/g,"");
  md=md.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ");
  return md.replace(/\n{3,}/g,"\n\n").replace(/^\n+/,"").trim();
}
function htmlToText(html){
  let t=htmlToMarkdown(html);
  t=t.replace(/\*\*([\s\S]*?)\*\*/g,"$1").replace(/\*([\s\S]*?)\*/g,"$1").replace(/~~([\s\S]*?)~~/g,"$1");
  return t;
}
function getEditorContent(){const e=document.getElementById("editor");return e?e.innerHTML:"";}

// ─── 저장 엔진 ────────────────
// 타이머를 파일별로 둔다. 전역 타이머 하나를 쓰면 A를 치다가 700ms 안에
// B로 넘어갔을 때 A의 저장이 취소된 채로 사라진다.
const saveTimers=new Map();   // fileId -> timer
const unsaved=new Set();      // 아직 서버에 못 올린 fileId
let   saveError=null;         // 마지막 저장 실패

function setSaveIndicator(){
  const t=T();
  const si=document.getElementById("saveindicator");
  if(si){
    if(saveError)      si.innerHTML=`<span style="color:#f87171;font-size:10px;" title="${esc(saveError)}">⚠ 저장 실패</span>`;
    else if(unsaved.size) si.innerHTML=`<span style="color:${t.mt};font-size:10px;">저장 중...</span>`;
    else               si.innerHTML=`<span style="color:#34d399;font-size:10px;">✓ 저장됨</span>`;
  }
  // 휴대폰 폭에서는 위 글씨가 숨겨지므로 저장 버튼 자체가 같은 상태를 보여준다.
  // 앞 기호만 바꿔 버튼 폭이 흔들리지 않게 한다(글자 칠 때마다 상단 바가 들썩이지 않도록).
  const b=document.getElementById("saveBtn");
  if(b){
    let label="✓ 저장",fg="#34d399",bd=t.bd;
    if(syncing)           {label="… 저장";fg=t.mt;}
    else if(saveError)    {label="⚠ 저장";fg="#f87171";bd="#f87171";}
    else if(unsaved.size) {label="● 저장";fg=t.ac;bd=t.ac;}
    b.textContent=label;
    b.style.color=fg;b.style.borderColor=bd;
    b.style.minWidth="68px";
    b.style.opacity=syncing?"0.6":"1";b.style.pointerEvents=syncing?"none":"auto";
    b.title=saveError?`저장 실패: ${saveError} — 눌러서 다시 저장`:"저장 (Ctrl+S) — 내 편집분을 올리고 다른 기기의 최신 내용을 받아옵니다";
  }
  // 🔄 도 같은 동작이라, 동기화 중에는 함께 막는다. render() 가 새로 그려도 유지되도록 여기서 한다.
  const r=document.getElementById("refreshBtn");
  if(r){r.style.opacity=syncing?"0.4":"1";r.style.pointerEvents=syncing?"none":"auto";}
}

function scheduleSave(fileId){
  if(!fileId)return;
  unsaved.add(fileId);
  clearTimeout(saveTimers.get(fileId));
  saveTimers.set(fileId,setTimeout(()=>flushFile(fileId),700));
  setSaveIndicator();
}

async function flushFile(fileId){
  clearTimeout(saveTimers.get(fileId));saveTimers.delete(fileId);
  const f=state.files.find(x=>x.id===fileId);
  if(!f){unsaved.delete(fileId);setSaveIndicator();return;}
  try{
    await saveFile(f);
    unsaved.delete(fileId);saveError=null;
  }catch(e){
    // 문서가 1MiB를 넘었거나 권한/네트워크 문제. 조용히 넘어가면 안 된다.
    saveError=(e&&(e.code||e.message))||String(e);
    console.error("저장 실패:",f.name,e);
  }
  setSaveIndicator();
}

// 저장이 한 번 실패하면 타이머는 이미 지워지고 unsaved 에만 남는다.
// 타이머만 훑으면 그 내용은 영영 안 올라가므로 둘을 합쳐서 민다.
function flushAll(){
  const ids=new Set([...saveTimers.keys(),...unsaved]);
  return Promise.all([...ids].map(id=>flushFile(id)));
}

// 지금 바로 올린다. 예약된 자동 저장은 중복 쓰기가 되므로 취소하되, 서버에 실제로
// 올라가기 전까지는 unsaved 에 남겨 둔다. 먼저 비우면 연결이 끊겨 올리기가 멈춘
// 사이 창을 닫아도 "저장 안 된 내용" 경고가 뜨지 않아 그 글을 잃는다.
async function pushFileNow(f){
  clearTimeout(saveTimers.get(f.id));saveTimers.delete(f.id);
  unsaved.add(f.id);setSaveIndicator();
  try{
    await saveFile(f);
    // 올리는 사이 새로 친 글이 있으면 그 저장이 따로 예약돼 있다. 그때는 남겨 둔다.
    if(!saveTimers.has(f.id)) unsaved.delete(f.id);
  }finally{
    setSaveIndicator();
  }
}

// 삭제 직전에 예약된 저장을 버린다. 안 그러면 지운 문서가 다시 살아난다.
function cancelSave(fileId){
  clearTimeout(saveTimers.get(fileId));
  saveTimers.delete(fileId);unsaved.delete(fileId);
}

// 탭을 떠나거나 창을 닫을 때 대기 중인 저장을 밀어넣는다.
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushAll();});
window.addEventListener("pagehide",()=>{flushAll();});
window.addEventListener("beforeunload",(e)=>{
  const ed=document.getElementById("editor");
  if(ed&&state.activeTab) state.files=state.files.map(f=>f.id===state.activeTab?{...f,content:ed.innerHTML}:f);
  flushAll();
  if(unsaved.size||saveError){e.preventDefault();e.returnValue="";return "";}
});

// 현재 편집 중인 내용을 state에 반영하고 즉시 저장 예약 (탭 전환·닫기용)
function commitEditor(){
  const ed=document.getElementById("editor");
  if(!ed||!state.activeTab)return;
  const id=state.activeTab;
  state.files=state.files.map(f=>f.id===id?{...f,content:ed.innerHTML}:f);
  if(saveTimers.has(id)) flushFile(id);
}

// ─── 커서 위치 다루기 ─────────
// contenteditable 은 textarea 와 달리 커서를 숫자 하나로 못 잡는다.
// 글자 수 기준 위치로 바꿔서 저장했다가 복원한다.
function caretOffset(el){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||!el.contains(sel.anchorNode))return null;
  const r=sel.getRangeAt(0),pre=r.cloneRange();
  pre.selectNodeContents(el);pre.setEnd(r.endContainer,r.endOffset);
  return pre.toString().length;
}
function setCaret(el,offset){
  if(offset==null)return;
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let n,acc=0;
  while(n=walker.nextNode()){
    const len=n.textContent.length;
    if(acc+len>=offset){
      const r=document.createRange();
      r.setStart(n,Math.max(0,Math.min(len,offset-acc)));r.collapse(true);
      const s=window.getSelection();s.removeAllRanges();s.addRange(r);
      return;
    }
    acc+=len;
  }
  const r=document.createRange();
  r.selectNodeContents(el);r.collapse(false);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}

// ─── 찾기 결과 표시 ───────────
// 글자 수 기준 위치로 Range 를 만든다 (setCaret 과 같은 방식, 범위 버전).
function rangeFromOffsets(el,start,end){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let n,acc=0,sn=null,so=0,en=null,eo=0;
  while(n=walker.nextNode()){
    const len=n.textContent.length;
    if(sn===null&&acc+len>=start){sn=n;so=Math.max(0,Math.min(len,start-acc));}
    if(en===null&&acc+len>=end){en=n;eo=Math.max(0,Math.min(len,end-acc));}
    if(sn&&en)break;
    acc+=len;
  }
  if(!sn)return null;
  if(!en){en=sn;eo=so;}
  const r=document.createRange();
  r.setStart(sn,so);r.setEnd(en,eo);
  return r;
}
function setEditorRange(el,start,end){
  const r=rangeFromOffsets(el,start,end);if(!r)return false;
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
  return true;
}

// 찾기 입력창으로 포커스를 되돌리면 window.Selection 이 즉시 지워진다
// (input 에 포커스가 가는 순간 브라우저가 에디터의 선택을 비운다).
// 그래서 실제 선택에 기대지 않고 좌표만 계산해 별도 표시를 그린다.
let findMatchStart=null,findMatchEnd=null,findHLLayer=null;
function clearFindHighlight(){
  if(findHLLayer){findHLLayer.remove();findHLLayer=null;}
}
function drawFindHighlight(ed,range){
  clearFindHighlight();
  const rects=range.getClientRects();
  if(!rects.length)return;
  const t=T();
  const layer=document.createElement("div");
  layer.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50;";
  for(const r of rects){
    const box=document.createElement("div");
    box.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background:${t.ac}55;border-radius:2px;`;
    layer.appendChild(box);
  }
  document.body.appendChild(layer);
  findHLLayer=layer;
}
// 찾기 창을 닫을 때 마지막으로 찾은 자리에 실제 커서를 심는다.
// render() 가 body.innerHTML 을 통째로 새로 쓰므로 스크롤도 함께 복원해야 한다.
function landCaretAtLastMatch(fallbackScrollTop){
  clearFindHighlight();
  const ed=document.getElementById("editor");
  if(!ed)return;
  ed.scrollTop=fallbackScrollTop;
  if(findMatchStart!=null&&findMatchEnd!=null&&setEditorRange(ed,findMatchStart,findMatchEnd)){
    ed.focus();
  }
}
// 커서 앞의 글자 n개 (자동 변환 판단용)
// Range.toString() 은 <div> 같은 줄 경계를 줄바꿈으로 세지 않고 글자만
// 이어붙인다. 그대로 쓰면 새 줄 맨 앞인데도 이전 줄의 마지막 글자가
// 바로 앞 글자로 잡혀서, 대사가 줄 앞에서 시작하는 원고에서는 여는
// 따옴표가 거의 나오지 않는다. 줄 경계를 직접 세어 넣는다.
const LINE_BLOCK=/^(DIV|P|LI|BLOCKQUOTE|H[1-6])$/i;
function charsBeforeCaret(n){
  const ed=document.getElementById("editor");
  const sel=window.getSelection();
  if(!ed||!sel||!sel.rangeCount||!ed.contains(sel.anchorNode))return "";
  const r=sel.getRangeAt(0);

  // 커서가 속한 줄(블록)을 찾아 그 안에서만 앞 글자를 본다.
  // 블록을 넘어가면 다른 줄이므로 '줄 시작'으로 취급해야 한다.
  let block=r.startContainer;
  if(block.nodeType===3)block=block.parentNode;
  while(block&&block!==ed&&!LINE_BLOCK.test(block.tagName||""))block=block.parentNode;
  if(!block)block=ed;

  const pre=r.cloneRange();
  try{
    pre.selectNodeContents(block);
    pre.setEnd(r.startContainer,r.startOffset);
  }catch(e){return "";}

  // 한 블록 안에서 <br> 로 줄이 나뉜 경우도 그 뒤는 새 줄로 본다
  const frag=pre.cloneContents();
  if(frag.querySelector&&frag.querySelector("br")){
    const holder=document.createElement("div");
    holder.appendChild(frag);
    const parts=holder.innerHTML.split(/<br\s*\/?>/i);
    const tail=document.createElement("div");
    tail.innerHTML=parts[parts.length-1];
    return (tail.textContent||"").slice(-n);
  }
  return pre.toString().slice(-n);
}

// ─── 되돌리기 / 다시 실행 ─────
// render() 가 화면을 통째로 다시 그리면서 contenteditable 의 기본 되돌리기
// 이력이 사라진다. 그래서 문서별로 직접 들고 간다.
const UNDO_MAX=200;
const undoHist=new Map();          // fileId -> {stack:[{html,caret}], idx}

function undoInit(fileId,html){
  undoHist.set(fileId,{stack:[{html:html||"",caret:null}],idx:0});
}
function undoPush(fileId,html,caret){
  const h=undoHist.get(fileId);
  if(!h){undoInit(fileId,html);return;}
  if(h.stack[h.idx]&&h.stack[h.idx].html===html)return;
  h.stack=h.stack.slice(0,h.idx+1);   // 되돌린 뒤 새로 치면 앞쪽 갈래는 버린다
  h.stack.push({html,caret});
  if(h.stack.length>UNDO_MAX)h.stack.shift();
  h.idx=h.stack.length-1;
}
// 타이핑 중에는 일정 간격으로만 지점을 남긴다. 글자마다 남기면 한 번
// 되돌릴 때 한 글자씩만 사라져 쓸모가 없다.
let undoTimer=null;
function undoPushSoon(){
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{
    const ed=document.getElementById("editor");
    if(ed&&state.activeTab)undoPush(state.activeTab,ed.innerHTML,caretOffset(ed));
    updateUndoButtons();
  },450);
}
function undoMove(dir){
  const id=state.activeTab,ed=document.getElementById("editor");
  if(!id||!ed)return;
  let h=undoHist.get(id);
  if(!h){undoInit(id,ed.innerHTML);h=undoHist.get(id);}
  clearTimeout(undoTimer);
  // 아직 안 남긴 최신 상태를 먼저 남긴다. 안 그러면 방금 친 것이 빠진다.
  if(h.stack[h.idx].html!==ed.innerHTML)undoPush(id,ed.innerHTML,caretOffset(ed));
  const next=h.idx+dir;
  if(next<0||next>=h.stack.length){toast(dir<0?"더 되돌릴 것이 없습니다":"더 되돌아올 것이 없습니다");return;}
  h.idx=next;
  const snap=h.stack[next];
  ed.innerHTML=snap.html;
  state.files=state.files.map(f=>f.id===id?{...f,content:snap.html}:f);
  ed.focus();setCaret(ed,snap.caret);
  updateStatusBar(true);scheduleSave(id);updateUndoButtons();
}
function updateUndoButtons(){
  const id=state.activeTab,h=id?undoHist.get(id):null;
  const ed=document.getElementById("editor");
  const bu=document.getElementById("btnUndo"),br=document.getElementById("btnRedo");
  const canU=!!h&&(h.idx>0||(ed&&h.stack[h.idx].html!==ed.innerHTML));
  const canR=!!h&&h.idx<h.stack.length-1;
  if(bu){bu.style.opacity=canU?"1":"0.35";bu.style.pointerEvents=canU?"auto":"none";}
  if(br){br.style.opacity=canR?"1":"0.35";br.style.pointerEvents=canR?"auto":"none";}
}

// ─── 자동 글자 변환 ───────────
// 쌍따옴표를 여는/닫는 모양으로 바꾸고, 마침표 세 개를 말줄임표로 바꾼다.
// 여는 따옴표로 볼 자리: 줄 처음이거나 앞이 공백·여는 괄호인 경우.
// 여는 자리인지 판단: 줄 처음이거나 앞이 공백·여는 괄호·여는 따옴표.
// 작은따옴표는 don't 처럼 글자 뒤에 오면 닫는 모양(’)이 맞다. 실제로
// 아포스트로피의 정식 문자가 ’ 이므로 같은 규칙으로 처리하면 된다.
function isOpeningSpot(){
  const before=charsBeforeCaret(1);
  return !before||/[\s(\[{「『“‘—–\-]/.test(before);
}
function handleTypography(e){
  if(e.isComposing)return false;      // 한글 조합 중에는 건드리지 않는다
  if(e.ctrlKey||e.metaKey||e.altKey)return false;
  if(e.key==='"'){
    e.preventDefault();
    document.execCommand("insertText",false,isOpeningSpot()?"“":"”");
    handleTextChange();
    return true;
  }
  if(e.key==="'"){
    e.preventDefault();
    document.execCommand("insertText",false,isOpeningSpot()?"‘":"’");
    handleTextChange();
    return true;
  }
  if(e.key==="."&&charsBeforeCaret(2)===".."){
    e.preventDefault();
    document.execCommand("delete",false,null);
    document.execCommand("delete",false,null);
    document.execCommand("insertText",false,"…");
    handleTextChange();
    return true;
  }
  return false;
}

// ─── 형광펜 ───────────────────
// 브라우저가 만드는 <span style="background-color:...">를 그대로 쓴다.
// <mark> 로 줄여 저장하면 용량은 아끼지만, execCommand 가 <mark> 를 건드리지
// 못해서 나중에 색을 바꾸거나 지울 수 없다(실험으로 확인). 편집이 되는 쪽을
// 택했다. 표시 하나에 약 48바이트이므로 상한(1 MiB)에는 영향이 거의 없다.

  {k:"p",name:"분홍",css:"#ffd3e2"},
];

// 글자색. 밝은 배경과 어두운 배경 양쪽에서 읽혀야 하므로 중간 밝기로 골랐다
// (흰 배경·다크 배경 모두 대비 4 안팎). 배경색에 따라 색을 바꾸면 저장된
// 값과 화면이 어긋나므로, 한 벌로 양쪽을 견디는 색을 쓴다.
const TEXT_COLORS=[

  {k:"g",name:"초록",css:"#1f9254"},
  {k:"p",name:"보라",css:"#8b5cf6"},

// 되돌리기용 표식. execCommand 에는 "색 없음" 이 없어서, 일단 이 색으로 덮어
// 브라우저가 구간을 깔끔히 쪼개게 한 뒤 그 속성만 걷어낸다.
const COLOR_RESET="rgb(1, 2, 3)";

function applyTextColor(css){
  const ed=document.getElementById("editor");if(!ed)return;
  ed.focus();
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.getRangeAt(0).collapsed){
    toast("색을 넣을 부분을 먼저 선택해 주세요","err");
    return;
  }
  try{document.execCommand("styleWithCSS",false,true);}catch(e){}
  document.execCommand("foreColor",false,css||COLOR_RESET);

function cleanupTextColor(ed){
  ed.querySelectorAll("[style]").forEach(el=>{
    if(el.style.color!==COLOR_RESET)return;
    el.style.removeProperty("color");
    if(!(el.getAttribute("style")||"").trim()) el.removeAttribute("style");
    if(el.tagName==="SPAN"&&!el.attributes.length){
      el.replaceWith(...el.childNodes);
    }
  });
}

function applyHighlight(css){
  const ed=document.getElementById("editor");if(!ed)return;
  ed.focus();
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.getRangeAt(0).collapsed){

  }
  try{document.execCommand("styleWithCSS",false,true);}catch(e){}

// 지우기 뒤에 남는 빈 껍데기를 치운다. 그대로 두면 문서가 조용히 부푼다.
function cleanupHighlight(ed){
  // [style*="background"] 만 보면 안 된다. 크롬은 지울 때 배경색 자체를 없애고
  // style="" 라는 빈 껍데기만 남기는데, 그러면 이 선택자에 걸리지 않는다.
  // 그대로 두면 칠했다 지울 때마다 문서가 조금씩 부푼다.
  ed.querySelectorAll("[style]").forEach(el=>{
    const bg=el.style.backgroundColor;
    if(bg&&bg!=="transparent"&&bg!=="rgba(0, 0, 0, 0)")return;   // 살아있는 형광펜은 둔다
    el.style.removeProperty("background-color");
    if(!(el.getAttribute("style")||"").trim()) el.removeAttribute("style");
    if(el.tagName==="SPAN"&&!el.attributes.length){
      el.replaceWith(...el.childNodes);          // 아무것도 안 남은 span 은 벗긴다
    }
  });
}

function insertDateTime(){
  const ed=document.getElementById("editor");if(!ed)return;
  ed.focus();
  const now=new Date();
  document.execCommand("insertText",false,`${now.toLocaleDateString("ko-KR")} ${now.toLocaleTimeString("ko-KR")}`);
  handleTextChange();
}
function exportFile(format){
  const file=state.files.find(f=>f.id===state.activeTab);if(!file)return;
  const base=file.name.replace(/\.[^/.]+$/,"");
  const content=format==="md"?htmlToMarkdown(file.content):htmlToText(file.content);
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=base+(format==="md"?".md":".txt");a.click();
  URL.revokeObjectURL(url);
}
async function convertToMd(fileId){
  state.files=state.files.map(f=>f.id===fileId?{...f,name:f.name.replace(/\.txt$/i,".md")}:f);
  await saveFile(state.files.find(f=>f.id===fileId));render();
}

// ─── Find / Replace ──────────
function handleFind(dir){
  const ed=document.getElementById("editor");if(!ed||!state.findText)return;
  if(dir) state.findDirection=dir;
  const direction=state.findDirection||'down';
  const walker=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const nodes=[];let nd;
  while(nd=walker.nextNode()) nodes.push(nd);
  let fullText="",offsets=[];
  nodes.forEach(n=>{offsets.push(fullText.length);fullText+=n.textContent;});
  const matches=[];
  for(let i=0;i<=fullText.length-state.findText.length;){
    const idx=fullText.indexOf(state.findText,i);if(idx===-1)break;
    matches.push(idx);i=idx+1;
  }
  const countEl=document.getElementById("findCount");
  if(!matches.length){if(countEl)countEl.textContent="없음";state.findIndex=-1;findMatchStart=null;findMatchEnd=null;clearFindHighlight();return;}
  if(direction==='down'){
    state.findIndex=state.findIndex===-1?0:(state.findIndex+1)%matches.length;
  } else {
    state.findIndex=state.findIndex===-1?matches.length-1:(state.findIndex-1+matches.length)%matches.length;
  }
  const ms=matches[state.findIndex],me=ms+state.findText.length;
  findMatchStart=ms;findMatchEnd=me;
  let sn=null,so=0,en=null,eo=0;
  for(let i=0;i<nodes.length;i++){
    const s=offsets[i],e=s+nodes[i].textContent.length;
    if(!sn&&ms>=s&&ms<=e){sn=nodes[i];so=ms-s;}
    if(!en&&me>=s&&me<=e){en=nodes[i];eo=me-s;}
  }
  if(sn&&en){
    const nodeEl=sn.parentElement;
    if(nodeEl){
      const relTop=nodeEl.getBoundingClientRect().top-ed.getBoundingClientRect().top+ed.scrollTop;
      ed.scrollTop=relTop-ed.clientHeight/2;
    }
    // 위치를 옮긴 뒤(스크롤 반영 후) 좌표를 재서 표시를 그린다.
    // 찾기 입력창으로 포커스가 돌아가면 window.Selection 은 바로 지워지므로
    // 그 값에 기대지 않는다.
    const range=document.createRange();
    range.setStart(sn,so);range.setEnd(en,eo);
    drawFindHighlight(ed,range);
    setTimeout(()=>document.getElementById("findInput")?.focus(),0);
  } else {
    findMatchStart=null;findMatchEnd=null;
  }
  if(countEl) countEl.textContent=`${state.findIndex+1} / ${matches.length}`;
}
async function handleReplace(){
  const file=state.files.find(f=>f.id===state.activeTab);if(!file||!state.findText)return;
  let newHTML,count=0;

  if(isHTML(file.content)){
    // 마크다운으로 왕복하면 <strong> 이 리터럴 ** 로 뭉개진다.
    // 텍스트 노드만 직접 치환해서 서식을 그대로 둔다.
    const dom=new DOMParser().parseFromString(`<div id="r">${file.content}</div>`,"text/html");
    const root=dom.getElementById("r");
    const walker=dom.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];let n;
    while(n=walker.nextNode()) nodes.push(n);
    nodes.forEach(node=>{
      const parts=node.nodeValue.split(state.findText);
      if(parts.length<2) return;
      count+=parts.length-1;
      node.nodeValue=parts.join(state.replaceText);
    });
    newHTML=root.innerHTML;
  } else {
    count=file.content.split(state.findText).length-1;
    newHTML=textToHTML(file.content.split(state.findText).join(state.replaceText));
  }

  const cnt=document.getElementById("findCount");
  if(!count){if(cnt)cnt.textContent="없음";return;}

  state.files=state.files.map(f=>f.id===state.activeTab?{...f,content:newHTML}:f);
  const ed=document.getElementById("editor");if(ed)ed.innerHTML=newHTML;
  state.findIndex=-1;
  if(cnt)cnt.textContent=`${count}개 바꿈`;
  scheduleSave(state.activeTab);updateStatusBar();
}

// ─── Move helpers ─────────────
function getAllDescendantFolderIds(folderId){
  const result=[folderId];
  state.folders.filter(f=>f.parentId===folderId).forEach(c=>result.push(...getAllDescendantFolderIds(c.id)));
  return result;
}

// 파일을 다른 폴더로 이동
async function moveFileTo(fileId,targetFolderId){
  const maxO=state.files.filter(f=>f.folderId===targetFolderId).reduce((m,f)=>Math.max(m,f.order??0),0);
  state.files=state.files.map(f=>f.id===fileId?{...f,folderId:targetFolderId,order:maxO+1}:f);
  state.tabs=state.tabs.map(t=>t.fileId===fileId?{...t,folderId:targetFolderId}:t);
  const file=state.files.find(f=>f.id===fileId);
  await saveFile(file);
  state.moveModal=null;render();
}

// 폴더를 다른 폴더 아래로 이동
async function moveFolderTo(folderId,targetParentId){
  // 자기 자신의 하위로 이동 방지
  if(folderId===targetParentId) return;
  if(getAllDescendantFolderIds(folderId).includes(targetParentId)) return;
  const maxO=state.folders.filter(f=>(f.parentId||null)===(targetParentId||null)).reduce((m,f)=>Math.max(m,f.order??0),0);
  state.folders=state.folders.map(f=>f.id===folderId?{...f,parentId:targetParentId||null,order:maxO+1}:f);
  const folder=state.folders.find(f=>f.id===folderId);
  await saveFolder(folder);
  state.moveModal=null;render();
}

// ─── 다중 선택 일괄 처리 ──────
// 선택한 것들을 한 폴더로 옮긴다. 폴더를 자기 자신이나 자기 하위로는
// 넣지 못하게 막고, 문서는 폴더 안에만 둘 수 있으므로 최상위는 건너뛴다.
async function moveSelection(targetId){
  const sel=state.selected.map(k=>k.split(":"));
  const movingFolders=sel.filter(([k])=>k==="folder").map(([,id])=>id);
  const blocked=new Set(movingFolders.flatMap(getAllDescendantFolderIds));
  if(targetId&&blocked.has(targetId)){toast("폴더를 자기 자신 안으로는 옮길 수 없습니다","err");return;}

  const jobs=[];let moved=0,skipped=0;
  for(const [kind,id] of sel){
    if(kind==="folder"){
      const f=state.folders.find(x=>x.id===id);
      if(!f||(f.parentId||null)===(targetId||null))continue;
      const maxO=state.folders.filter(x=>(x.parentId||null)===(targetId||null)).reduce((m,x)=>Math.max(m,x.order??0),0);
      const next={...f,parentId:targetId||null,order:maxO+1};
      state.folders=state.folders.map(x=>x.id===id?next:x);
      jobs.push(saveFolder(next));moved++;
    } else {
      if(!targetId){skipped++;continue;}     // 문서는 최상위에 둘 수 없다
      const f=state.files.find(x=>x.id===id);
      if(!f||f.folderId===targetId)continue;
      const maxO=state.files.filter(x=>x.folderId===targetId).reduce((m,x)=>Math.max(m,x.order??0),0);
      const next={...f,folderId:targetId,order:maxO+1};
      state.files=state.files.map(x=>x.id===id?next:x);
      state.tabs=state.tabs.map(t=>t.fileId===id?{...t,folderId:targetId}:t);
      jobs.push(saveFile(next));moved++;
    }
  }
  // order 만 바꾸고 배열 순서를 그대로 두면 둘이 어긋난다. 드래그 순서
  // 변경이 그 어긋남을 그대로 밟으면 엉뚱한 문서가 옮겨진다.
  state.files=state.files.slice().sort(byOrder);
  state.folders=state.folders.slice().sort(byOrder);
  state.selected=[];state.selAnchor=null;state.moveModal=null;render();
  try{
    await Promise.all(jobs);
    toast(`${moved}개를 옮겼습니다`+(skipped?` (문서 ${skipped}개는 최상위로 못 감)`:""),"ok");
  }catch(e){toast("이동 실패: "+(e.code||e.message),"err");}
}

// 선택한 것들을 한 묶음으로 휴지통에 보낸다.
async function deleteSelection(){
  const sel=state.selected.map(k=>k.split(":"));
  const batch=genId(),now=Date.now();
  const folderIds=[...new Set(sel.filter(([k])=>k==="folder").flatMap(([,id])=>getAllDescendantFolderIds(id)))];
  const fileIds=[...new Set([
    ...sel.filter(([k])=>k==="file").map(([,id])=>id),
    ...state.files.filter(f=>folderIds.includes(f.folderId)).map(f=>f.id),
  ])];

  // 지우기 전에 예약된 저장을 버린다. 안 그러면 지운 문서가 되살아난다.
  fileIds.forEach(cancelSave);
  state.tabs=state.tabs.filter(t=>!fileIds.includes(t.fileId));
  if(fileIds.includes(state.activeTab)) state.activeTab=state.tabs.length?state.tabs[state.tabs.length-1].fileId:null;

  const goneFolders=state.folders.filter(f=>folderIds.includes(f.id));
  const goneFiles  =state.files.filter(f=>fileIds.includes(f.id));
  state.trashFolders=[...goneFolders.map(f=>({...f,deletedAt:now,deletedBatch:batch})),...state.trashFolders];
  state.trashFiles  =[...goneFiles.map(f=>({...f,deletedAt:now,deletedBatch:batch})),...state.trashFiles];
  state.folders=state.folders.filter(f=>!folderIds.includes(f.id));
  state.files  =state.files.filter(f=>!fileIds.includes(f.id));
  state.selected=[];state.selAnchor=null;render();

  try{
    await Promise.all([
      ...fileIds.map(id=>softDelFile(id,batch)),
      ...folderIds.map(id=>softDelFolder(id,batch)),
    ]);
    toast(`휴지통으로 보냈습니다 · 문서 ${fileIds.length}개`,"ok");
  }catch(e){toast("삭제 실패: "+(e.code||e.message),"err");}
}

// 선택 묶음의 규모 (확인 문구용)
function selectionScope(){
  const sel=state.selected.map(k=>k.split(":"));
  const folderIds=[...new Set(sel.filter(([k])=>k==="folder").flatMap(([,id])=>getAllDescendantFolderIds(id)))];
  const fileIds=[...new Set([
    ...sel.filter(([k])=>k==="file").map(([,id])=>id),
    ...state.files.filter(f=>folderIds.includes(f.folderId)).map(f=>f.id),
  ])];
  const chars=state.files.filter(f=>fileIds.includes(f.id))
    .reduce((n,f)=>n+htmlToText(f.content||"").length,0);
  return {folderIds,fileIds,chars};
}

// ─── Folder / File actions ────
function getAncestorIds(folderId){
  const result=[];
  let cur=state.folders.find(f=>f.id===folderId);
  while(cur&&cur.parentId){result.push(cur.parentId);cur=state.folders.find(f=>f.id===cur.parentId);}
  return result;
}
function toggleFolder(folderId){
  commitEditor();
  const isOpen=state.openFolderIds.includes(folderId);
  if(isOpen){
    const allIds=getAllDescendantFolderIds(folderId);
    state.openFolderIds=state.openFolderIds.filter(id=>!allIds.includes(id));
    const fileIds=state.files.filter(f=>allIds.includes(f.folderId)).map(f=>f.id);
    state.tabs=state.tabs.filter(t=>!fileIds.includes(t.fileId));
    if(fileIds.includes(state.activeTab)) state.activeTab=state.tabs.length>0?state.tabs[state.tabs.length-1].fileId:null;
  } else {
    // 상위폴더 ID들을 보존하면서 열기
    const ancestors=getAncestorIds(folderId);
    const keepIds=new Set([folderId,...ancestors]);
    const otherIds=state.files.filter(f=>!keepIds.has(f.folderId)).map(f=>f.id);
    state.tabs=state.tabs.filter(t=>!otherIds.includes(t.fileId));
    state.openFolderIds=[...new Set([...ancestors,folderId])];
// 다른 폴더 탭 모두 닫고 이 폴더 파일만 열기
    const ff=state.files.filter(f=>f.folderId===folderId);
    state.tabs=ff.map(f=>({fileId:f.id,folderId}));
    state.activeTab=ff.length>0?ff[0].id:null;
  }
  render();
}
function scrollToActiveTab(){
  setTimeout(()=>{
    const tabBar=document.getElementById("tabBar");
    const el=document.querySelector(`[data-file-id="${state.activeTab}"]`);
    if(!tabBar||!el) return;
    const barLeft=tabBar.scrollLeft;
    const barRight=barLeft+tabBar.clientWidth;
    const elLeft=el.offsetLeft;
    const elRight=elLeft+el.offsetWidth;
    // 탭이 이미 보이는 영역 안에 있으면 스크롤 안 함
    if(elLeft>=barLeft && elRight<=barRight) return;
    // 화면 밖에 있을 때만 최소한으로 스크롤
    if(elLeft<barLeft) tabBar.scrollLeft=elLeft;
    else tabBar.scrollLeft=elRight-tabBar.clientWidth;
  },60);
}
// 문서를 떠나기 직전의 스크롤 위치를 기억해 두고, 돌아오면 그 자리로 되돌린다.
// 탭 바와 사이드바(그리고 전체 검색 결과)가 같은 코드를 쓰도록 함수로 묶었다.
function rememberScroll(){
  const ed=document.getElementById("editor");
  if(ed&&state.activeTab) state.scrollPositions={...state.scrollPositions,[state.activeTab]:ed.scrollTop};
}
function restoreScroll(fileId){
  const ed=document.getElementById("editor");
  if(ed) ed.scrollTop=state.scrollPositions[fileId]||0;
}

function openFile(file){
  rememberScroll();
  commitEditor();
  if(!state.tabs.find(t=>t.fileId===file.id)) state.tabs=[...state.tabs,{fileId:file.id,folderId:file.folderId}];
  state.activeTab=file.id;render();scrollToActiveTab();
  restoreScroll(file.id);
}
function closeTab(fileId){
  state.tabs=state.tabs.filter(t=>t.fileId!==fileId);
  if(state.activeTab===fileId) state.activeTab=state.tabs.length>0?state.tabs[state.tabs.length-1].fileId:null;
  render();
}
async function newFile(folderId){
  const maxO=state.files.filter(f=>f.folderId===folderId).reduce((m,f)=>Math.max(m,f.order??0),0);
  const f={id:genId(),folderId,name:"새 파일.md",content:"",createdAt:Date.now(),order:maxO+1};
  state.files=[...state.files,f];state.tabs=[...state.tabs,{fileId:f.id,folderId}];
  // 만든 폴더를 펼쳐 둬야 탐색기에 새 문서가 보이고, 거기서 이름을 칠 수 있다.
  if(!state.openFolderIds.includes(folderId)) state.openFolderIds=[...state.openFolderIds,folderId];
  state.activeTab=f.id;state.renamingId=f.id;state.renamingVal="새 파일.md";
  state.renameSrc="side";state.renameFresh=true;
  await saveFile(f);render();
}
// 문서 복사본 만들기.
// 원본 바로 아래에 넣고, 이름은 "원본 (사본)" · "원본 (사본 2)" 로 붙인다.
async function duplicateFile(fileId){
  const src=state.files.find(f=>f.id===fileId);
  if(!src){toast("문서를 찾지 못했습니다","err");return;}

  // 편집 중이던 내용이 아직 state 에 안 들어갔을 수 있다. 화면의 최신 내용으로 복사한다.
  if(state.activeTab===fileId) commitEditor();
  const latest=state.files.find(f=>f.id===fileId)||src;

  // 복사본이 1 MiB 상한을 넘으면 저장이 통째로 실패한다. 만들기 전에 막는다.
  if(docBytes(latest.content)>FS_DOC_LIMIT-8192){
    toast("이 문서는 너무 커서 복사본을 저장할 수 없습니다","err");
    return;
  }

  const base=String(latest.name||"제목 없음").replace(/\s*\(사본( \d+)?\)$/,"");
  const taken=new Set(state.files.filter(f=>f.folderId===latest.folderId).map(f=>f.name));
  let name=`${base} (사본)`;
  for(let i=2;taken.has(name);i++) name=`${base} (사본 ${i})`;

  // 순서를 다시 매긴다. 옛 문서는 order 가 없고 createdAt 으로 정렬되는데,
  // 복사본에만 order 를 넣으면 기준이 뒤섞여 엉뚱한 자리에 놓인다.
  // 이 폴더의 문서 전체에 0,1,2… 를 다시 부여하면서 원본 바로 뒤에 끼워 넣는다.
  const sibs=state.files.filter(f=>f.folderId===latest.folderId).sort(byOrder);
  const copy={...latest,id:genId(),name,createdAt:Date.now(),
              updatedAt:Date.now(),deletedAt:null,deletedBatch:null};
  // 원본 뒤에 이미 사본들이 붙어 있으면 그 마지막 뒤에 놓는다.
  // 원본 바로 뒤에 끼우면 (사본 2) 가 (사본) 앞에 오게 된다.
  const copyOf=new RegExp("^"+base.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*\\(사본( \\d+)?\\)$");
  let insertAfter=sibs.findIndex(f=>f.id===latest.id);
  while(insertAfter+1<sibs.length&&copyOf.test(sibs[insertAfter+1].name||"")) insertAfter++;

  const ordered=[];
  sibs.forEach((f,i)=>{
    ordered.push(f);
    if(i===insertAfter) ordered.push(copy);
  });
  const renumbered=new Map();
  ordered.forEach((f,i)=>{ if((f.order??null)!==i) renumbered.set(f.id,{...f,order:i}); });
  const finalCopy=renumbered.get(copy.id)||copy;

  const touched=[...renumbered.values()].filter(f=>f.id!==copy.id);
  state.files=[
    ...state.files.map(f=>renumbered.get(f.id)||f),
    finalCopy,
  ].sort(byOrder);
  state.contextMenu=null;
  render();

  try{
    await Promise.all([saveFile(finalCopy),...touched.map(f=>saveFile(f))]);
    toast(`복사본을 만들었습니다 · ${name}`,"ok");
  }catch(e){
    toast("복사본 저장 실패: "+((e&&(e.code||e.message))||e),"err");
  }
}

async function newFolder(parentId=null){
  const name=state.newFolderName.trim();
  if(!name){state.newFolderMode=false;state.newFolderName="";state.newFolderParentId=null;render();return;}
  const siblings=state.folders.filter(f=>(f.parentId||null)===(parentId||null));
  const maxO=siblings.reduce((m,f)=>Math.max(m,f.order??0),-1);
  const f={id:genId(),name,color:COLORS[state.folders.length%COLORS.length],createdAt:Date.now(),order:maxO+1,parentId:parentId||null};
  state.folders=[...state.folders,f];state.newFolderMode=false;state.newFolderName="";state.newFolderParentId=null;
  await saveFolder(f);render();
}
// 이름 입력칸을 한 곳에만 낸다.
// 예전에는 탐색기와 탭 바 양쪽에 동시에 냈다. 포커스는 늘 탭 바로 갔고, 탐색기
// 쪽을 누르는 순간 탭 바 입력칸이 blur 되면서 이름 바꾸기가 끝나 입력칸이
// 사라졌다. 그래서 탐색기에서는 글자를 고칠 수가 없었다.
function renameSpot(){
  if(!state.renamingId) return null;
  if(state.renameSrc==="tab") return "tab";
  // 탐색기가 닫혀 있거나 그 폴더가 접혀 있으면 탐색기에는 칸이 그려지지 않는다.
  if(!state.sidebarOpen) return "tab";
  const f=state.files.find(x=>x.id===state.renamingId);
  if(f&&!state.openFolderIds.includes(f.folderId)) return "tab";
  return "side";
}

async function commitRename(id){
  const val=state.renamingVal.trim();
  if(val){state.files=state.files.map(f=>f.id===id?{...f,name:val}:f);await saveFile(state.files.find(f=>f.id===id));}
  state.renamingId=null;state.renameSrc=null;state.renameFresh=false;render();
}
async function commitFolderRename(id){
  const val=state.renamingFolderId===id?state.renamingFolderVal.trim():"";
  if(val){state.folders=state.folders.map(f=>f.id===id?{...f,name:val}:f);await saveFolder(state.folders.find(f=>f.id===id));}
  state.renamingFolderId=null;state.renamingFolderVal="";render();
}
async function deleteFile(id){
  cancelSave(id);
  const batch=genId(),now=Date.now();
  const f=state.files.find(x=>x.id===id);
  closeTab(id);state.files=state.files.filter(f=>f.id!==id);state.contextMenu=null;
  if(f) state.trashFiles=[{...f,deletedAt:now,deletedBatch:batch},...state.trashFiles];
  render();
  await softDelFile(id,batch);
}
async function deleteFolder(folderId){
  const batch=genId(),now=Date.now();
  const allIds=getAllDescendantFolderIds(folderId);
  const victims=state.files.filter(f=>allIds.includes(f.folderId));
  const fileIds=victims.map(f=>f.id);
  fileIds.forEach(cancelSave);
  state.tabs=state.tabs.filter(t=>!fileIds.includes(t.fileId));
  if(fileIds.includes(state.activeTab)) state.activeTab=null;

  const goneFolders=state.folders.filter(f=>allIds.includes(f.id));
  state.trashFolders=[...goneFolders.map(f=>({...f,deletedAt:now,deletedBatch:batch})),...state.trashFolders];
  state.trashFiles  =[...victims.map(f=>({...f,deletedAt:now,deletedBatch:batch})),...state.trashFiles];

  state.files=state.files.filter(f=>!allIds.includes(f.folderId));
  state.folders=state.folders.filter(f=>!allIds.includes(f.id));
  state.contextMenu=null;
  render();
  await Promise.all([...fileIds.map(id=>softDelFile(id,batch)),...allIds.map(id=>softDelFolder(id,batch))]);
}

// ─── 휴지통 ───────────────────
// 삭제는 묶음(batch) 단위로 되돌린다. 폴더 하나를 지우면 그 안의 문서까지
// 같은 batch 로 묶이므로, 복원 한 번이면 통째로 돌아온다.
function trashBatches(){
  const map=new Map();
  const push=(item,kind)=>{
    const b=item.deletedBatch||("_"+item.id);
    if(!map.has(b)) map.set(b,{batch:b,at:item.deletedAt,folders:[],files:[]});
    const e=map.get(b);e[kind].push(item);
    if(item.deletedAt>e.at) e.at=item.deletedAt;
  };
  state.trashFolders.forEach(f=>push(f,"folders"));
  state.trashFiles.forEach(f=>push(f,"files"));
  return [...map.values()].sort((a,b)=>b.at-a.at);
}

async function restoreBatch(batch){
  const e=trashBatches().find(x=>x.batch===batch);if(!e)return;
  const aliveIds=new Set([...state.folders.map(f=>f.id),...e.folders.map(f=>f.id)]);

  // 되살아난 폴더의 부모가 아직 휴지통에 있거나 사라졌으면 최상위로 올린다.
  const folders=e.folders.map(f=>({...f,deletedAt:null,deletedBatch:null,
    parentId:(f.parentId&&aliveIds.has(f.parentId))?f.parentId:null}));

  // 문서가 있던 폴더가 사라졌으면 갈 곳이 없다. 화면에 안 보이면 잃은 것과
  // 같으므로, 그럴 때만 복구용 폴더를 만들어 거기에 담는다.
  let rescue=null;
  const needRescue=e.files.some(f=>!aliveIds.has(f.folderId));
  if(needRescue){
    rescue=state.folders.find(f=>f.name==="복구된 문서"&&!f.parentId);
    if(!rescue){
      const maxO=state.folders.filter(f=>!f.parentId).reduce((m,f)=>Math.max(m,f.order??0),-1);
      rescue={id:genId(),name:"복구된 문서",color:COLORS[2],createdAt:Date.now(),order:maxO+1,parentId:null,deletedAt:null,deletedBatch:null};
      folders.push(rescue);
    }
  }
  const files=e.files.map(f=>({...f,deletedAt:null,deletedBatch:null,
    folderId:aliveIds.has(f.folderId)?f.folderId:rescue.id}));

  state.folders=[...state.folders,...folders].sort(byOrder);
  state.files  =[...state.files,...files].sort(byOrder);
  state.trashFolders=state.trashFolders.filter(f=>f.deletedBatch!==batch);
  state.trashFiles  =state.trashFiles.filter(f=>f.deletedBatch!==batch);
  render();

  // 위치가 바뀐 것은 문서 전체를 다시 쓰고, 그대로인 것은 표시만 지운다.
  await Promise.all([
    ...folders.map(f=>saveFolder(f)),
    ...files.map(f=>f.folderId===e.files.find(x=>x.id===f.id).folderId?undelFile(f.id):saveFile(f)),
  ]);
}

async function purgeBatch(batch){
  const e=trashBatches().find(x=>x.batch===batch);if(!e)return;
  state.trashFolders=state.trashFolders.filter(f=>f.deletedBatch!==batch);
  state.trashFiles  =state.trashFiles.filter(f=>f.deletedBatch!==batch);
  render();
  await Promise.all([...e.files.map(f=>purgeFile(f.id)),...e.folders.map(f=>purgeFolder(f.id))]);
}
async function changeFolderColor(folderId, color){
  state.folders=state.folders.map(f=>f.id===folderId?{...f,color}:f);
  await saveFolder(state.folders.find(f=>f.id===folderId));
  state.contextMenu=null; render();
}

// ─── Drag-and-drop ───────────
function initSortables(){
  if(!window.Sortable) return;

  // initSortables 는 render() 마다 setTimeout 으로 불린다. 렌더가 연달아
  // 일어나면 같은 요소에 Sortable 이 두 번 붙어 드래그가 제멋대로 동작한다.
  const once=(el,opts)=>{
    if(!el||el.dataset.sortableInit)return;
    el.dataset.sortableInit="1";
    Sortable.create(el,opts);
  };

  // 화면은 order 기준으로 정렬해서 그린다(renderFolderTree). 드래그 처리도
  // 같은 기준으로 정렬해야 evt.oldIndex/newIndex 가 같은 항목을 가리킨다.
  // 정렬을 빼먹으면 엉뚱한 문서가 옮겨진다.
  const filesOf  =fid=>state.files.filter(f=>f.folderId===fid).sort(byOrder);
  const foldersOf=pid=>state.folders.filter(f=>(f.parentId||null)===(pid||null)).sort(byOrder);

  async function applyReorder(list,evt,isFolder){
    if(evt.oldIndex===evt.newIndex)return;
    const arr=list.slice();
    const [moved]=arr.splice(evt.oldIndex,1);
    if(!moved){render();return;}          // 화면과 상태가 어긋난 상황 — 다시 그려 맞춘다
    arr.splice(evt.newIndex,0,moved);

    const changed=[];
    arr.forEach((f,i)=>{ if((f.order??null)!==i) changed.push({...f,order:i}); });
    if(!changed.length){render();return;}
    const byId=new Map(changed.map(f=>[f.id,f]));

    if(isFolder) state.folders=state.folders.map(f=>byId.get(f.id)||f).sort(byOrder);
    else         state.files  =state.files.map(f=>byId.get(f.id)||f).sort(byOrder);

    render();   // Sortable 이 만든 DOM 대신 상태 기준으로 다시 그린다
    try{
      await Promise.all(changed.map(f=>isFolder?saveFolder(f):saveFile(f)));
    }catch(e){
      toast("순서를 저장하지 못했습니다: "+((e&&(e.code||e.message))||e),"err");
    }
  }

  // 탭 순서를 문서 순서에 반영한다. 탭에는 여러 폴더의 문서가 섞일 수 있어서
  // 통째로 번호를 매기면 다른 폴더의 순서까지 뒤엉킨다. 폴더별로 따로 매긴다.
  async function applyTabReorder(evt){
    if(evt.oldIndex===evt.newIndex)return;
    const tabs=state.tabs.slice();
    const [moved]=tabs.splice(evt.oldIndex,1);
    if(!moved){render();return;}
    tabs.splice(evt.newIndex,0,moved);
    state.tabs=tabs;

    const grouped=new Map();
    for(const t of state.tabs){
      const f=state.files.find(x=>x.id===t.fileId);
      if(!f)continue;
      if(!grouped.has(f.folderId))grouped.set(f.folderId,[]);
      grouped.get(f.folderId).push(f);
    }
    const changed=[];
    for(const [fid,inTabs] of grouped){
      const shown=new Set(inTabs.map(f=>f.id));
      const rest=state.files.filter(f=>f.folderId===fid&&!shown.has(f.id)).sort(byOrder);
      [...inTabs,...rest].forEach((f,i)=>{ if((f.order??null)!==i) changed.push({...f,order:i}); });
    }
    if(changed.length){
      const byId=new Map(changed.map(f=>[f.id,f]));
      state.files=state.files.map(f=>byId.get(f.id)||f).sort(byOrder);
    }
    render();
    try{ await Promise.all(changed.map(f=>saveFile(f))); }
    catch(e){ toast("순서를 저장하지 못했습니다: "+((e&&(e.code||e.message))||e),"err"); }
  }

  function initFolder(folder){
    once(document.getElementById(`fileList-${folder.id}`),{animation:150,handle:".drag-handle",
      onEnd:evt=>applyReorder(filesOf(folder.id),evt,false)});
    once(document.getElementById(`subList-${folder.id}`),{animation:150,handle:".drag-handle",
      onEnd:evt=>applyReorder(foldersOf(folder.id),evt,true)});
    foldersOf(folder.id).forEach(initFolder);
  }

  once(document.getElementById("folderList-root"),{animation:150,handle:".drag-handle",
    onEnd:evt=>applyReorder(foldersOf(null),evt,true)});
  foldersOf(null).forEach(initFolder);

  once(document.getElementById("tabBar"),{animation:150,filter:".tab-close-btn",
    onEnd:applyTabReorder});
}

const FS_DOC_LIMIT=1048576;   // Firestore 문서 1개 상한 (1 MiB)
const encoder=new TextEncoder();

// 한글은 UTF-8에서 3바이트라 글자 수만 보면 실제 크기를 절반 이하로 착각한다.
function docBytes(html){return encoder.encode(html||"").length;}

function renderStatusBar(){
  const file=state.files.find(f=>f.id===state.activeTab);
  const t=T(),sb=document.getElementById("statusbar");if(!sb)return;
  const tail=`<div style="flex:1"></div><span>F5: 날짜 삽입 · Ctrl+H: 찾기/바꾸기</span>`;
  if(!file){sb.innerHTML=tail;return;}

  const txt=htmlToText(file.content);
  const bytes=docBytes(file.content),pct=Math.round(bytes*100/FS_DOC_LIMIT);
  // 조건부로 숨기면 서서히 커지는 문서를 놓친다. 퍼센트는 항상 보여주고
  // 색으로만 위험도를 구분한다 (60%부터 주의, 90%부터 경고).
  const warn=pct>=60,danger=pct>=90;
  const cap=`<span style="${warn?`color:${danger?"#f87171":"#fbbf24"};font-weight:700;`:""}"
    title="Firestore는 문서 하나에 1 MiB까지만 저장할 수 있습니다. 넘으면 저장이 실패하니 문서를 나눠 주세요.">
    ${(bytes/1024).toFixed(0)}KB · 상한의 ${pct}%</span>`;

  // 한글은 띄어쓰기 단위가 곧 어절이라 이 계산이 무난하다.
  const words=(txt.trim().match(/\S+/g)||[]).length;

  sb.innerHTML=`<span>${esc(file.name)}</span><span>줄: ${txt.split("\n").length.toLocaleString()}</span>`
    +`<span>글자: ${txt.length.toLocaleString()}</span>`
    +`<span>단어: ${words.toLocaleString()}</span>${cap}`
    +`<span>${state.wordWrap?"줄 바꿈 켜짐":"꺼짐"}</span>${tail}`;
}

// 큰 원고에서 htmlToText 가 무거워 타이핑이 밀린다. 통계는 늦춰서 계산한다.
let statTimer=null;
function updateStatusBar(immediate){
  clearTimeout(statTimer);

  statTimer=setTimeout(renderStatusBar,250);
}

// ─── 백업 내보내기 ────────────
// backup.html 과 같은 형식으로 내보낸다. 그 도구로 그대로 복원할 수 있다.
async function exportBackup(){
  if(state.exporting) return;
  state.exporting=true;render();
  try{
    // 서버에서 받은 것만 백업한다. 연결이 불안정할 때 빈 결과로 "백업 완료" 가
    // 뜨면, 백업이 있다고 믿었는데 파일이 비어 있는 일이 생긴다.
    const {fSnap,fileSnap}=await readAllFromServer();
    const folders=fSnap.docs.map(d=>({_docId:d.id,data:d.data()}));
    const files  =fileSnap.docs.map(d=>({_docId:d.id,data:d.data()}));
    if(!folders.length&&!files.length){
      state.exporting=false;render();
      askConfirm({title:"백업하지 않음",message:"받아온 폴더와 문서가 하나도 없어 백업 파일을 만들지 않았습니다.",
        detail:"빈 파일을 백업으로 믿게 되는 일을 막기 위해서입니다. 잠시 뒤 다시 시도해 주세요.",
        okLabel:"확인",noCancel:true,onConfirm:()=>{}});
      return;
    }
    const chars=files.reduce((n,f)=>n+String(f.data.content||"").length,0);
    const payload={
      tool:"notepad-backup",version:1,
      exportedAt:new Date().toISOString(),
      project:firebaseConfig.projectId,
      sourcePath:"users/"+uid(),
      counts:{folders:folders.length,files:files.length,contentChars:chars},
      folders,files,
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
    const d=new Date(),p=n=>String(n).padStart(2,"0");
    const st=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`notepad-backup-${uid()}-${st}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    state.exporting=false;render();
    askConfirm({title:"백업 완료",
      message:`폴더 <b>${folders.length}</b>개 · 문서 <b>${files.length}</b>개를 내려받았습니다.`,
      detail:`본문 ${chars.toLocaleString()}자 · 휴지통 항목 포함<br>backup.html 에서 이 파일로 복원할 수 있습니다.`,
      okLabel:"확인",tone:"ok",noCancel:true,onConfirm:()=>{}});
  }catch(e){
    state.exporting=false;render();
    const offline=e&&e.code==="unavailable";
    askConfirm({title:"백업 실패",
      message:offline?"서버에 연결하지 못해 백업 파일을 만들지 않았습니다.":"내보내는 중 오류가 발생했습니다.",
      detail:offline?"인터넷 연결을 확인한 뒤 다시 시도해 주세요.":esc(String(e&&(e.code||e.message)||e)),
      okLabel:"확인",noCancel:true,onConfirm:()=>{}});
  }
}

// ─── 전체 문서 검색 ───────────
// 본문은 이미 전부 메모리에 있으므로 서버를 다시 부르지 않는다.
// htmlToText 는 마크다운 변환까지 하느라 무거워서, 검색용으로는 태그만
// 걷어내는 가벼운 변환을 쓰고 결과를 문서별로 캐시한다.
const searchTextCache=new Map();   // fileId -> {len, text}
function fileSearchText(f){
  const raw=String(f.content||"");
  const hit=searchTextCache.get(f.id);
  if(hit&&hit.len===raw.length) return hit.text;
  const text=raw
    .replace(/<\/(div|p)>/gi,"\n")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  searchTextCache.set(f.id,{len:raw.length,text});
  return text;
}

function folderPathOf(folderId){
  const parts=[];
  let cur=state.folders.find(f=>f.id===folderId),guard=0;
  while(cur&&guard++<20){parts.unshift(cur.name);cur=state.folders.find(f=>f.id===cur.parentId);}
  return parts.join(" › ");
}

function globalSearch(q){
  const needle=q.toLowerCase();
  const out=[];
  for(const f of state.files){
    const text=fileSearchText(f);
    const lower=text.toLowerCase();
    let idx=lower.indexOf(needle);
    if(idx<0) continue;
    const pos=[];
    while(idx>=0&&pos.length<500){pos.push(idx);idx=lower.indexOf(needle,idx+needle.length);}
    out.push({file:f,text,pos});
  }
  // 많이 나온 문서를 위로
  return out.sort((a,b)=>b.pos.length-a.pos.length);
}

// 결과만 다시 그린다. render() 를 부르면 입력칸이 새로 만들어져 포커스가 날아간다.

    return;
  }
  const hits=globalSearch(q);
  const total=hits.reduce((n,h)=>n+h.pos.length,0);
  if(!hits.length){
    host.innerHTML=`<div style="padding:26px 10px;text-align:center;color:${t.mt};font-size:12.5px;">‘${esc(q)}’ 를 찾지 못했습니다.</div>`;
    return;
  }
  const rows=hits.map(h=>{
    const path=folderPathOf(h.file.folderId);
    // 앞쪽 세 군데만 미리 보여준다
    const snips=h.pos.slice(0,3).map(p=>{
      const s=Math.max(0,p-32),e=Math.min(h.text.length,p+q.length+38);

      return `<div style="font-size:11.5px;color:${t.mt};line-height:1.6;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
        ${s>0?"…":""}${pre}<mark style="background:${t.ac}44;color:${t.tx};border-radius:2px;padding:0 1px;">${mid}</mark>${post}${e<h.text.length?"…":""}
      </div>`;
    }).join("");
    return `
    <div onclick="window._gsGo('${h.file.id}')"
      style="padding:10px 12px;border-bottom:1px solid ${t.bd};cursor:pointer;border-radius:6px;"
      onmouseenter="this.style.background='${t.hv}'" onmouseleave="this.style.background='transparent'">

        <span style="font-size:10.5px;color:${t.ac};font-weight:700;flex-shrink:0;">${h.pos.length}</span>
      </div>
      <div style="font-size:10.5px;color:${t.mt};margin-top:2px;">${esc(path)}</div>
      ${snips}
    </div>`;
  }).join("");
  host.innerHTML=`<div style="padding:6px 12px;font-size:11px;color:${t.mt};">문서 ${hits.length}개 · 총 ${total.toLocaleString()}곳</div>${rows}`;
}

// ─── 이동 모달 렌더링 ─────────
function renderMoveModal(t,fontFamily){
  if(!state.moveModal) return "";
  const {itemId,itemType,multi}=state.moveModal;
  // 파일이동: 모든 폴더 선택 가능 / 폴더이동: 자기자신·하위폴더 제외
  // 여러 개를 옮길 때는 선택된 폴더들의 하위를 전부 제외한다.
  const excluded=multi
    ? state.selected.filter(k=>k.startsWith("folder:")).flatMap(k=>getAllDescendantFolderIds(k.slice(7)))
    : (itemType==="folder"?getAllDescendantFolderIds(itemId):[]);
  const targets=state.folders.filter(f=>!excluded.includes(f.id));
  const hasFiles=multi&&state.selected.some(k=>k.startsWith("file:"));

  function folderOptions(parentId,depth){
    return state.folders
      .filter(f=>(f.parentId||null)===(parentId||null)&&!excluded.includes(f.id))
      .sort((a,b)=>(a.order??a.createdAt)-(b.order??b.createdAt))
      .map(f=>`
        <div onclick="window._moveTo('${f.id}')"
          style="display:flex;align-items:center;gap:8px;padding:8px ${12+depth*16}px;cursor:pointer;border-radius:6px;"
          onmouseenter="this.style.background='${t.hv}'" onmouseleave="this.style.background='transparent'">
          <span style="color:${f.color};">📁</span>
          <span style="font-size:13px;">${esc(f.name)}</span>
        </div>
        ${folderOptions(f.id,depth+1)}`
      ).join("");
  }

  // 폴더이동: 루트(최상위)로 이동 옵션 추가
  // 여러 개를 옮길 때는 문서가 섞여 있으면 최상위를 못 쓴다 (문서는 폴더 안에만).
  const rootOption=(multi?!hasFiles:itemType==="folder")?`
    <div onclick="window._moveTo('__root__')"
      style="display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:6px;"
      onmouseenter="this.style.background='${t.hv}'" onmouseleave="this.style.background='transparent'">
      <span>🏠</span><span style="font-size:13px;">최상위 (루트)</span>
    </div>`:"";

  return `
  <div onclick="window._closeMoveModal()" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;display:flex;align-items:center;justify-content:center;">
    <div onclick="event.stopPropagation()" style="background:${t.sb};border:1px solid ${t.bd};border-radius:12px;padding:20px;min-width:260px;max-height:420px;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,0.3);font-family:${fontFamily};">
      <div style="font-size:14px;font-weight:700;color:${t.tx};margin-bottom:12px;">📂 이동할 폴더 선택</div>
      <div style="font-size:11px;color:${t.mt};margin-bottom:10px;">${multi
        ?`${state.selected.length}개 선택됨`+(hasFiles?" · 문서는 폴더 안에만 둘 수 있습니다":"")
        :itemType==="file"
          ?"파일: "+esc(state.files.find(f=>f.id===itemId)?.name||"")
          :"폴더: "+esc(state.folders.find(f=>f.id===itemId)?.name||"")}</div>
      <div style="border-top:1px solid ${t.bd};padding-top:8px;">
        ${rootOption}
        ${folderOptions(null,0)}
        ${targets.length===0&&itemType!=="folder"?`<div style="color:${t.mt};font-size:12px;padding:8px;">이동 가능한 폴더가 없습니다.</div>`:""}
      </div>
      <button onclick="window._closeMoveModal()" style="${btnC(t)};margin-top:12px;width:100%;text-align:center;">취소</button>
    </div>
  </div>`;
}

// ─── Recursive folder renderer ─
function renderFolderTree(parentId,depth){
  const t=T();
  if(!parentId) treeOrder=[];   // 최상위에서 시작할 때만 초기화
  const children=state.folders.filter(f=>(f.parentId||null)===(parentId||null))
    .sort((a,b)=>(a.order??a.createdAt)-(b.order??b.createdAt));
  if(!children.length) return "";
  const items=children.map(folder=>{
    const isOpen=state.openFolderIds.includes(folder.id);
    const ff=state.files.filter(f=>f.folderId===folder.id).sort((a,b)=>(a.order??a.createdAt)-(b.order??b.createdAt));
    const pad=12+depth*14;
    treeOrder.push(selKey("folder",folder.id));
    const fSel=isSel("folder",folder.id);
    const fBg=fSel?t.ac+"33":"transparent";
    return `<div>
      <div class="folder-row" onclick="window._tf('${folder.id}',event)" oncontextmenu="window._cm(event,'folder','${folder.id}')"
        style="display:flex;align-items:center;padding:6px 8px 6px ${pad}px;cursor:pointer;gap:4px;border-radius:4px;margin:1px 6px;background:${fBg};"
        onmouseenter="this.style.background='${fSel?t.ac+"33":t.hv}'" onmouseleave="this.style.background='${fBg}'">
        ${dh}
        <span style="font-size:10px;color:${t.mt};">${isOpen?"▾":"▸"}</span>
        <span style="position:relative;display:inline-block;font-size:${depth>0?12:13}px;">📁<span style="position:absolute;bottom:-1px;right:-3px;width:8px;height:8px;border-radius:50%;background:${folder.color};border:2px solid ${t.sb};"></span></span>
        ${state.renamingFolderId===folder.id
          ?`<input id="renameFolderInput" value="${esc(state.renamingFolderVal)}" onclick="event.stopPropagation()"
              oninput="window._rfi(this.value)"
              onkeydown="if(event.key==='Enter')window._rfc('${folder.id}');if(event.key==='Escape')window._rfEsc();"
              onblur="window._rfc('${folder.id}')"
              style="font-size:${depth>0?11:12}px;font-weight:600;flex:1;background:transparent;border:none;border-bottom:1px solid ${t.ac};outline:none;color:${t.tx};font-family:inherit;padding:0;"/>`
          :`<span style="font-size:${depth>0?11:12}px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(folder.name)}</span>`}
        <span style="font-size:10px;color:${t.mt};">${ff.length}</span>
        <button onclick="event.stopPropagation();window._nf('${folder.id}')" style="${btnC(t)};font-size:11px;padding:1px 5px;">+</button>
      </div>
      ${isOpen?`
        <!-- 하위폴더 먼저 표시 -->
        <div id="subList-${folder.id}">
          ${renderFolderTree(folder.id,depth+1)}
        </div>
        <!-- 파일 목록 -->
        <div id="fileList-${folder.id}">
          ${ff.map(file=>{
            treeOrder.push(selKey("file",file.id));
            const sSel=isSel("file",file.id);
            const bg=sSel?t.ac+"33":(state.activeTab===file.id?t.ac+"22":"transparent");
            return `
            <div class="file-row" onclick="window._of('${file.id}',event)" oncontextmenu="window._cm(event,'file','${file.id}')"
              style="display:flex;align-items:center;padding:4px 8px 4px ${pad+16}px;cursor:pointer;gap:4px;border-radius:4px;margin:1px 6px;
                background:${bg};
                border-left:${state.activeTab===file.id?`2px solid ${t.ac}`:"2px solid transparent"};"
              onmouseenter="this.style.background='${sSel?t.ac+"33":(state.activeTab===file.id?t.ac+"22":t.hv)}'"
              onmouseleave="this.style.background='${bg}'">
              ${dh}
              <span style="font-size:11px;">📄</span>
              ${state.renamingId===file.id&&renameSpot()==="side"
                ?`<input id="renameInput" value="${esc(state.renamingVal)}" onclick="event.stopPropagation()" oninput="window._ri(this.value)" onkeydown="window._rk(event,'${file.id}')" onblur="window._rc('${file.id}')" style="${inpC(t)};flex:1;font-size:11px;"/>`
                :`<span style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(file.name)}</span>`}
            </div>`;}).join("")}
        </div>`:""}
    </div>`;
  }).join("");
  if(parentId) return items;
  return `<div id="folderList-root">${items}</div>`;
}

          <button onclick="window._export('md')"  style="${fmtC(t)};font-size:10px;padding:2px 8px;">↓ .md</button>

        <!-- Find/Replace -->
        ${state.findOpen?`

             <div style="padding:6px 16px;border-top:1px solid ${t.bd};">
               <div style="font-size:10px;color:${t.mt};margin-bottom:6px;">폴더 색상</div>
               <div style="display:flex;gap:6px;flex-wrap:wrap;">
                 ${["#60a5fa","#34d399","#f87171","#fbbf24","#a78bfa","#fb923c","#38bdf8","#e879f9","#94a3b8","#f472b6","#4ade80","#fb7185"].map(color=>`
                   <div onclick="window._changeColor('${state.contextMenu.id}','${color}')"
                     style="width:18px;height:18px;border-radius:50%;background:${color};cursor:pointer;border:2px solid ${state.folders.find(f=>f.id===state.contextMenu.id)?.color===color?"#fff":"transparent"};"

    <!-- 이동 모달 -->

  const sbEl=document.getElementById("sidebarScroll");

  if(activeFile){const ed=document.getElementById("editor");if(ed)ed.innerHTML=textToHTML(activeFile.content);}

  if(state.authed&&sessionRestored) saveSession();

  // 새 파일을 만들면 이름 입력칸에 자동으로 포커스를 준다. 그런데 이름을
  // 무시하고 바로 에디터를 눌러 타이핑을 시작하면, 이 타이머가 조합 중인
  // 한글 입력 도중 포커스를 가로채 글자가 튀거나 겹쳐 찍힌다. 이미
  // 에디터에 포커스가 가 있으면(=사용자가 먼저 그쪽을 선택했으면)

  if(state.renamingId) setTimeout(()=>{
    if(document.activeElement===document.getElementById("editor"))return;

    el.focus();
    // 확장자(.md) 는 건드릴 일이 거의 없으므로 그 앞을 기준으로 잡는다.
    const dot=el.value.lastIndexOf(".");
    const base=dot>0?dot:el.value.length;
    if(state.renameFresh){
      // 방금 만든 문서는 "새 파일" 만 잡아 준다. 바로 치면 이름이 갈리고 .md 는 남는다.
      el.setSelectionRange(0,base);
    }else{
      // 이름을 고치러 온 것이므로 전체를 선택하지 않는다. 선택해 두면 한 글자만
      // 바꾸려 해도 이름이 통째로 지워진다. 커서를 .md 바로 앞에 둔다.

      const st=document.getElementById("editor")?.scrollTop||0;

      if(opening)setTimeout(()=>document.getElementById("findInput")?.focus(),50);
      else landCaretAtLastMatch(st);
    }
    else if(a==="find_exec")     handleFind();
    else if(a==="replace_exec")  handleReplace();

    else if(a==="confirmfolder") newFolder(state.newFolderParentId);

  window._pick=(kind,id,e)=>{
    const key=selKey(kind,id);
    if(e&&e.shiftKey&&state.selAnchor){
      const a=treeOrder.indexOf(state.selAnchor),b=treeOrder.indexOf(key);
      if(a>=0&&b>=0){state.selected=treeOrder.slice(Math.min(a,b),Math.max(a,b)+1);render();return true;}
    }
    if(e&&(e.ctrlKey||e.metaKey)){
      state.selected=state.selected.includes(key)
        ? state.selected.filter(k=>k!==key)
        : [...state.selected,key];
      state.selAnchor=key;render();return true;
    }
    state.selected=[key];state.selAnchor=key;
    return false;
  };

  };

    rememberScroll();

    if(tabBar) tabBar.scrollLeft=prevScroll;   // 탭 바 가로 위치는 그대로 둔다
    restoreScroll(id);
  };
  window._ct=(fileId)=>{commitEditor();closeTab(fileId);};
  window._tc=handleTextChange;
  window._fmt=applyFormat;
  window._hl=applyHighlight;
  window._tcol=applyTextColor;
  window._export=exportFile;
  window._cvtMd=convertToMd;
  window._refresh=refreshData;
  window._fi=(v,w)=>{
    if(w==="find"){
      // 검색어가 바뀌면 이전 검색에서 찾았던 위치는 더 이상 이 글자와 무관하다.
      // 놔두면 Enter 없이 바로 닫았을 때 엉뚱한 곳에 커서가 꽂힌다.
      if(v!==state.findText){state.findIndex=-1;findMatchStart=null;findMatchEnd=null;clearFindHighlight();}
      state.findText=v;
    } else state.replaceText=v;
  };

  window._ri=(v)=>{state.renamingVal=v;};
